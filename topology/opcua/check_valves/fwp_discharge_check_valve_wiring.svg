    <rect class="io" x="1100" y="482" width="250" height="116" rx="10"/>
    <text class="mono" x="1115" y="510">vppLPFWPCheckValveOpen</text><text class="mono" x="1115" y="532">vppLPFWPCheckValveOpening</text><text class="mono" x="1115" y="554">vppLPFWPCheckValveMassFlowTH</text><text class="mono" x="1115" y="576">+ pressure / dP / resistance</text>
