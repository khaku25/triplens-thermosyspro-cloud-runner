    <rect class="io" x="1100" y="132" width="250" height="116" rx="10"/>
    <text class="mono" x="1115" y="160">vppHPFWPCheckValveOpen</text><text class="mono" x="1115" y="182">vppHPFWPCheckValveOpening</text><text class="mono" x="1115" y="204">vppHPFWPCheckValveMassFlowTH</text><text class="mono" x="1115" y="226">+ pressure / dP / resistance</text>
