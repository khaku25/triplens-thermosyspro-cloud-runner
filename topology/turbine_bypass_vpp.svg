<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">VPP HP and LP turbine bypass topology</title>
  <desc id="desc">HP bypass routes main steam to cold reheat. LP bypass routes hot reheat steam around both IP and LP turbines to the condenser. There is no separate IP bypass or LP drum steam dump.</desc>
  <defs>
    <style>
      .bg{fill:#f4f7fa}.panel{fill:#fff;stroke:#d8e1e8;stroke-width:2}.title{font:700 28px Arial,sans-serif;fill:#16324a}.sub{font:15px Arial,sans-serif;fill:#607384}
      .equip{fill:#eef5fb;stroke:#27689b;stroke-width:3}.header{fill:#fff8e7;stroke:#b77812;stroke-width:3}.cond{fill:#eef9f3;stroke:#30875b;stroke-width:3}
      .valve{fill:#fff;stroke:#923f94;stroke-width:3}.steam{fill:none;stroke:#d9544d;stroke-width:6}.bypass{fill:none;stroke:#8b4aa0;stroke-width:6}.drum{fill:none;stroke:#2e7cad;stroke-width:4}
      .logic{fill:#f3effa;stroke:#7550a8;stroke-width:2;stroke-dasharray:8 6}.label{font:700 16px Arial,sans-serif;fill:#243746;text-anchor:middle}.tag{font:13px Arial,sans-serif;fill:#5b6e7c;text-anchor:middle}.note{font:14px Arial,sans-serif;fill:#5b6e7c}.warn{font:700 14px Arial,sans-serif;fill:#a04329}.bad-dot{fill:#b42318;stroke:#7a271a;stroke-width:1.5}
    </style>
    <marker id="arrowSteam" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#d9544d"/></marker>
    <marker id="arrowBypass" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#8b4aa0"/></marker>
    <marker id="arrowLogic" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#7550a8"/></marker>
  </defs>
  <rect class="bg" width="1400" height="760"/>
  <rect class="panel" x="24" y="22" width="1352" height="710" rx="18"/>
  <text class="title" x="55" y="65">VPP Turbine Bypass — HPBP + Hot-Reheat LPBP</text>
  <text class="sub" x="55" y="92">ThermoSysPro naming: HP=HP, MP=IP, BP=LP · No separate IPBP · No LP-drum steam dump</text>

  <rect class="header" x="70" y="170" width="170" height="70" rx="12"/>
  <text class="label" x="155" y="198">HP Main Steam</text><text class="tag" x="155" y="221">~12.681 MPa</text>
  <rect class="valve" x="285" y="180" width="115" height="50" rx="8"/>
  <text class="label" x="342" y="201">HP Admission</text><text class="tag" x="342" y="220">Trip CLOSE</text>
  <rect class="equip" x="445" y="170" width="145" height="70" rx="35"/>
  <text class="label" x="517" y="211">HP Turbine</text>
  <rect class="header" x="635" y="170" width="175" height="70" rx="12"/>
  <text class="label" x="722" y="198">Cold Reheat</text><text class="tag" x="722" y="221">~2.727 MPa</text>
  <rect class="header" x="855" y="170" width="175" height="70" rx="12"/>
  <text class="label" x="942" y="198">Hot Reheat</text><text class="tag" x="942" y="221">~2.549 MPa</text>
  <rect class="equip" x="1075" y="170" width="115" height="70" rx="35"/>
  <text class="label" x="1132" y="211">IP Turbine</text>
  <rect class="equip" x="1230" y="170" width="115" height="70" rx="35"/>
  <text class="label" x="1287" y="211">LP Turbine</text>
  <path class="steam" d="M240 205 H285 M400 205 H445 M590 205 H635 M810 205 H855 M1030 205 H1075 M1190 205 H1230" marker-end="url(#arrowSteam)"/>

  <rect class="cond" x="1165" y="540" width="180" height="80" rx="38"/>
  <text class="label" x="1255" y="575">Condenser</text><text class="tag" x="1255" y="598">~6.14 kPa abs</text>
  <path class="steam" d="M1287 240 V540" marker-end="url(#arrowSteam)"/>

  <path class="bypass" d="M155 240 V365 H635" marker-end="url(#arrowBypass)"/>
  <rect class="valve" x="292" y="340" width="120" height="50" rx="8"/>
  <text class="label" x="352" y="362">HPBP</text><text class="tag" x="352" y="381">546.106 t/h target</text>
  <circle class="valve" cx="505" cy="365" r="27"/>
  <text class="tag" x="505" y="370">SPRAY</text>
  <text class="note" x="105" y="416">HP turbine only bypass</text>

  <path class="bypass" d="M942 240 V455 H1255 V540" marker-end="url(#arrowBypass)"/>
  <rect class="valve" x="985" y="430" width="120" height="50" rx="8"/>
  <text class="label" x="1045" y="452">LPBP</text><text class="tag" x="1045" y="471">636.329 t/h target</text>
  <circle class="valve" cx="1155" cy="455" r="27"/>
  <text class="tag" x="1155" y="460">SPRAY</text>
  <text class="note" x="845" y="505">Hot Reheat → Condenser; IP + LP turbine train bypass</text>

  <rect class="equip" x="760" y="565" width="155" height="60" rx="28"/>
  <text class="label" x="837" y="591">LP Drum Steam</text><text class="tag" x="837" y="611">~71.42 t/h contribution</text>
  <rect class="valve" x="955" y="570" width="120" height="50" rx="8"/>
  <text class="label" x="1015" y="592">LP Admission</text><text class="tag" x="1015" y="611">Trip CLOSE</text>
  <path class="drum" d="M915 595 H955 M1075 595 H1110 V310 H1230" marker-end="url(#arrowSteam)"/>
  <text class="warn" x="760" y="662">This LP-drum admission line is not LPBP; no separate steam dump is installed.</text>

  <rect class="logic" x="70" y="540" width="500" height="125" rx="12"/>
  <text class="label" x="320" y="572">ST TRIP LATCH</text>
  <text class="note" x="95" y="602">CLOSE: HP/IP turbine admission + LP drum admission</text>
  <text class="note" x="95" y="629">OPEN: HPBP + LPBP · ENABLE: spray temperature control</text>
  <path d="M320 540 V485 H352 V390" fill="none" stroke="#7550a8" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrowLogic)"/>
  <path d="M570 603 H690 V520 H1045 V480" fill="none" stroke="#7550a8" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrowLogic)"/>

  <!-- Authoritative static bindings; all default BAD/UNBOUND until live DataValue validation. -->
  <g id="st-train" data-bind="three steam flows; admissions; ST power" data-quality="BAD" data-state="UNBOUND"><title>Steam turbine train — BAD / UNBOUND</title><circle class="bad-dot" cx="1198" cy="155" r="8"/></g>
  <g id="bypass-hp" data-bind="POSITION; FLOW; LS; inlet/outlet P/T" data-quality="BAD" data-state="UNBOUND"><title>HP bypass — BAD / UNBOUND</title><circle class="bad-dot" cx="282" cy="365" r="8"/></g>
  <g id="bypass-hp-spray" data-bind="SPRAY_POSITION; SPRAY_FLOW" data-quality="BAD" data-state="UNBOUND"><title>HP spray — BAD / UNBOUND</title><circle class="bad-dot" cx="505" cy="328" r="8"/></g>
  <g id="bypass-lp" data-bind="POSITION; FLOW; LS; inlet/outlet P/T" data-quality="BAD" data-state="UNBOUND"><title>LP bypass — BAD / UNBOUND</title><circle class="bad-dot" cx="975" cy="455" r="8"/></g>
  <g id="bypass-lp-spray" data-bind="SPRAY_POSITION; SPRAY_FLOW" data-quality="BAD" data-state="UNBOUND"><title>LP spray — BAD / UNBOUND</title><circle class="bad-dot" cx="1155" cy="418" r="8"/></g>

  <text class="note" x="55" y="710">VPP design basis only · Lock Cv, spray flow and condenser acceptance after OpenModelica transient validation · Not for operation/LOTO</text>
</svg>
