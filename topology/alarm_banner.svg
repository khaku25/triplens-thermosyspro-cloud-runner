<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="700" viewBox="0 0 1400 700" role="img" aria-labelledby="title desc">
  <title id="title">TripLens alarm banner and sequence of events</title>
  <desc id="desc">Fail-closed alarm and SOE display roots. Static bindings do not claim runtime event delivery.</desc>
  <defs><style>
    .bg{fill:#f4f7fa}.panel{fill:#fff;stroke:#d8e1e8;stroke-width:2}.title{font:700 28px Arial,sans-serif;fill:#16324a}.sub{font:14px Arial,sans-serif;fill:#607384}.badpanel{fill:#fef3f2;stroke:#b42318;stroke-width:2.5}.head{fill:#b42318}.white{font:700 16px Arial,sans-serif;fill:#fff}.name{font:700 18px Arial,sans-serif;fill:#243746}.tag{font:12px Arial,sans-serif;fill:#657784}.bad{font:700 13px Arial,sans-serif;fill:#b42318}.row{fill:#fff;stroke:#e2e9ee}.note{font:13px Arial,sans-serif;fill:#5d7080}
  </style></defs>
  <rect class="bg" width="1400" height="700"/><rect class="panel" x="24" y="22" width="1352" height="650" rx="18"/>
  <text class="title" x="55" y="66">Alarm Banner + Sequence of Events</text><text class="sub" x="55" y="94">SourceTimestamp 우선 · 안정적인 sequence_id · 중복 금지 · 기본 상태 BAD / UNBOUND</text>
  <g id="alarm-banner" data-bind="all active alarm/event tags" data-quality="BAD" data-state="UNBOUND">
    <title>Highest priority alarm — BAD / UNBOUND</title><rect class="badpanel" x="60" y="135" width="1280" height="130" rx="14"/><rect class="head" x="60" y="135" width="1280" height="42" rx="14"/><text class="white" x="82" y="162">HIGHEST PRIORITY ALARM</text><text class="name" x="85" y="215">No trusted alarm DataValue</text><text class="bad" x="85" y="244">BAD · UNBOUND — ACK/SHELVE disabled</text>
  </g>
  <g id="soe-list" data-bind="command/request/latch/trip/open/physics timestamps" data-quality="BAD" data-state="UNBOUND">
    <title>Sequence of events — BAD / UNBOUND</title><rect class="badpanel" x="60" y="300" width="1280" height="260" rx="14"/><rect class="head" x="60" y="300" width="1280" height="42" rx="14"/><text class="white" x="82" y="327">SEQUENCE OF EVENTS — BAD / UNBOUND</text><rect class="row" x="80" y="365" width="1240" height="48"/><text class="tag" x="100" y="395">SourceTimestamp</text><text class="tag" x="320" y="395">sequence_id</text><text class="tag" x="520" y="395">source</text><text class="tag" x="735" y="395">event</text><text class="tag" x="1160" y="395">quality</text><rect class="row" x="80" y="421" width="1240" height="100"/><text class="bad" x="100" y="477">Events are withheld until timestamp, identifier, source and quality pass validation.</text>
  </g>
  <text class="note" x="60" y="620">Static SVG contract only. Live alarm ordering, acknowledgement, shelving, export, and deduplication remain runtime acceptance gates.</text>
</svg>
