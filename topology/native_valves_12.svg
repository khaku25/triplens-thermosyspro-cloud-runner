<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="920" viewBox="0 0 1500 920" role="img" aria-labelledby="title desc">
  <title id="title">TripLens native OPC UA 12-valve matrix</title>
  <desc id="desc">Twelve native valve control points, each declaring its authoritative static binding and defaulting BAD and UNBOUND.</desc>
  <defs><style>
    .bg{fill:#f4f7fa}.panel{fill:#fff;stroke:#d8e1e8;stroke-width:2}.title{font:700 28px Arial,sans-serif;fill:#16324a}.sub{font:14px Arial,sans-serif;fill:#607384}.card{fill:#fef3f2;stroke:#b42318;stroke-width:2}.pipe{stroke:#738695;stroke-width:4}.valve{fill:#fff;stroke:#b42318;stroke-width:3}.name{font:700 14px Arial,sans-serif;fill:#243746;text-anchor:middle}.tag{font:11px Arial,sans-serif;fill:#657784;text-anchor:middle}.bad{font:700 11px Arial,sans-serif;fill:#b42318;text-anchor:middle}.note{font:13px Arial,sans-serif;fill:#5d7080}
  </style></defs>
  <rect class="bg" width="1500" height="920"/><rect class="panel" x="24" y="22" width="1452" height="870" rx="18"/>
  <text class="title" x="55" y="66">Native OPC UA — 12 Valve Matrix</text><text class="sub" x="55" y="94">각 카드: 4 WRITE + 8 READ 계약 · runtime resolve 전 BAD / UNBOUND</text>
  <!-- Cards are intentionally red until live namespace/BrowseName/DataValue validation succeeds. -->
  <g id="valve-hp-fwcv" data-bind="TSP.VLV.HP_FWCV.*" data-quality="BAD" data-state="UNBOUND"><title>HP FWCV — BAD / UNBOUND</title><rect class="card" x="60" y="140" width="320" height="150" rx="14"/><line class="pipe" x1="105" y1="205" x2="335" y2="205"/><path class="valve" d="M185 175 L220 205 L185 235 Z M255 175 L220 205 L255 235 Z"/><text class="name" x="220" y="165">HP FWCV</text><text class="tag" x="220" y="260">TSP.VLV.HP_FWCV.*</text><text class="bad" x="220" y="280">BAD · UNBOUND</text></g>
  <g id="valve-hp-steam-vlv" data-bind="TSP.VLV.HP_STEAM_VLV.*" data-quality="BAD" data-state="UNBOUND"><title>HP steam valve — BAD / UNBOUND</title><rect class="card" x="410" y="140" width="320" height="150" rx="14"/><line class="pipe" x1="455" y1="205" x2="685" y2="205"/><path class="valve" d="M535 175 L570 205 L535 235 Z M605 175 L570 205 L605 235 Z"/><text class="name" x="570" y="165">HP STEAM VLV</text><text class="tag" x="570" y="260">TSP.VLV.HP_STEAM_VLV.*</text><text class="bad" x="570" y="280">BAD · UNBOUND</text></g>
  <g id="valve-ip-fwcv" data-bind="TSP.VLV.IP_FWCV.*" data-quality="BAD" data-state="UNBOUND"><title>IP FWCV — BAD / UNBOUND</title><rect class="card" x="760" y="140" width="320" height="150" rx="14"/><line class="pipe" x1="805" y1="205" x2="1035" y2="205"/><path class="valve" d="M885 175 L920 205 L885 235 Z M955 175 L920 205 L955 235 Z"/><text class="name" x="920" y="165">IP FWCV</text><text class="tag" x="920" y="260">TSP.VLV.IP_FWCV.*</text><text class="bad" x="920" y="280">BAD · UNBOUND</text></g>
  <g id="valve-ip-steam-vlv" data-bind="TSP.VLV.IP_STEAM_VLV.*" data-quality="BAD" data-state="UNBOUND"><title>IP steam valve — BAD / UNBOUND</title><rect class="card" x="1110" y="140" width="320" height="150" rx="14"/><line class="pipe" x1="1155" y1="205" x2="1385" y2="205"/><path class="valve" d="M1235 175 L1270 205 L1235 235 Z M1305 175 L1270 205 L1305 235 Z"/><text class="name" x="1270" y="165">IP STEAM VLV</text><text class="tag" x="1270" y="260">TSP.VLV.IP_STEAM_VLV.*</text><text class="bad" x="1270" y="280">BAD · UNBOUND</text></g>
  <g id="valve-lp-steam-vlv" data-bind="TSP.VLV.LP_STEAM_VLV.*" data-quality="BAD" data-state="UNBOUND"><title>LP steam valve — BAD / UNBOUND</title><rect class="card" x="60" y="320" width="320" height="150" rx="14"/><line class="pipe" x1="105" y1="385" x2="335" y2="385"/><path class="valve" d="M185 355 L220 385 L185 415 Z M255 355 L220 385 L255 415 Z"/><text class="name" x="220" y="345">LP STEAM VLV</text><text class="tag" x="220" y="440">TSP.VLV.LP_STEAM_VLV.*</text><text class="bad" x="220" y="460">BAD · UNBOUND</text></g>
  <g id="valve-lp-fw-vlv" data-bind="TSP.VLV.LP_FW_VLV.*" data-quality="BAD" data-state="UNBOUND"><title>LP feedwater valve — BAD / UNBOUND</title><rect class="card" x="410" y="320" width="320" height="150" rx="14"/><line class="pipe" x1="455" y1="385" x2="685" y2="385"/><path class="valve" d="M535 355 L570 385 L535 415 Z M605 355 L570 385 L605 415 Z"/><text class="name" x="570" y="345">LP FW VLV</text><text class="tag" x="570" y="440">TSP.VLV.LP_FW_VLV.*</text><text class="bad" x="570" y="460">BAD · UNBOUND</text></g>
  <g id="valve-lp-to-hpip-fw-vlv" data-bind="TSP.VLV.LP_TO_HPIP_FW_VLV.*" data-quality="BAD" data-state="UNBOUND"><title>LP to HP/IP feedwater valve — BAD / UNBOUND</title><rect class="card" x="760" y="320" width="320" height="150" rx="14"/><line class="pipe" x1="805" y1="385" x2="1035" y2="385"/><path class="valve" d="M885 355 L920 385 L885 415 Z M955 355 L920 385 L955 415 Z"/><text class="name" x="920" y="345">LP → HP/IP FW VLV</text><text class="tag" x="920" y="440">TSP.VLV.LP_TO_HPIP_FW_VLV.*</text><text class="bad" x="920" y="460">BAD · UNBOUND</text></g>
  <g id="valve-cond-extraction-vlv" data-bind="TSP.VLV.COND_EXTRACTION_VLV.*" data-quality="BAD" data-state="UNBOUND"><title>Condenser extraction valve — BAD / UNBOUND</title><rect class="card" x="1110" y="320" width="320" height="150" rx="14"/><line class="pipe" x1="1155" y1="385" x2="1385" y2="385"/><path class="valve" d="M1235 355 L1270 385 L1235 415 Z M1305 355 L1270 385 L1305 415 Z"/><text class="name" x="1270" y="345">COND EXTRACTION</text><text class="tag" x="1270" y="440">TSP.VLV.COND_EXTRACTION_VLV.*</text><text class="bad" x="1270" y="460">BAD · UNBOUND</text></g>
  <g id="valve-hp-turb-adm-vlv" data-bind="TSP.VLV.HP_TURB_ADM_VLV.*" data-quality="BAD" data-state="UNBOUND"><title>HP turbine admission valve — BAD / UNBOUND</title><rect class="card" x="60" y="500" width="320" height="150" rx="14"/><line class="pipe" x1="105" y1="565" x2="335" y2="565"/><path class="valve" d="M185 535 L220 565 L185 595 Z M255 535 L220 565 L255 595 Z"/><text class="name" x="220" y="525">HP TURB ADM VLV</text><text class="tag" x="220" y="620">TSP.VLV.HP_TURB_ADM_VLV.*</text><text class="bad" x="220" y="640">BAD · UNBOUND</text></g>
  <g id="valve-hp-fw-iso-vlv" data-bind="TSP.VLV.HP_FW_ISO_VLV.*" data-quality="BAD" data-state="UNBOUND"><title>HP feedwater isolation valve — BAD / UNBOUND</title><rect class="card" x="410" y="500" width="320" height="150" rx="14"/><line class="pipe" x1="455" y1="565" x2="685" y2="565"/><path class="valve" d="M535 535 L570 565 L535 595 Z M605 535 L570 565 L605 595 Z"/><text class="name" x="570" y="525">HP FW ISO VLV</text><text class="tag" x="570" y="620">TSP.VLV.HP_FW_ISO_VLV.*</text><text class="bad" x="570" y="640">BAD · UNBOUND</text></g>
  <g id="valve-ip-fw-iso-vlv" data-bind="TSP.VLV.IP_FW_ISO_VLV.*" data-quality="BAD" data-state="UNBOUND"><title>IP feedwater isolation valve — BAD / UNBOUND</title><rect class="card" x="760" y="500" width="320" height="150" rx="14"/><line class="pipe" x1="805" y1="565" x2="1035" y2="565"/><path class="valve" d="M885 535 L920 565 L885 595 Z M955 535 L920 565 L955 595 Z"/><text class="name" x="920" y="525">IP FW ISO VLV</text><text class="tag" x="920" y="620">TSP.VLV.IP_FW_ISO_VLV.*</text><text class="bad" x="920" y="640">BAD · UNBOUND</text></g>
  <g id="valve-ip-turb-adm-vlv" data-bind="TSP.VLV.IP_TURB_ADM_VLV.*" data-quality="BAD" data-state="UNBOUND"><title>IP turbine admission valve — BAD / UNBOUND</title><rect class="card" x="1110" y="500" width="320" height="150" rx="14"/><line class="pipe" x1="1155" y1="565" x2="1385" y2="565"/><path class="valve" d="M1235 535 L1270 565 L1235 595 Z M1305 535 L1270 565 L1305 595 Z"/><text class="name" x="1270" y="525">IP TURB ADM VLV</text><text class="tag" x="1270" y="620">TSP.VLV.IP_TURB_ADM_VLV.*</text><text class="bad" x="1270" y="640">BAD · UNBOUND</text></g>
  <rect x="60" y="720" width="1370" height="100" rx="12" fill="#eef3f7" stroke="#cbd7df"/><text class="note" x="85" y="752">Static matrix only: cards declare authoritative wildcard binding roots. Individual signal resolution remains a runtime gate.</text><text class="note" x="85" y="780">No card may become normal/green unless all required WRITE/READ nodes resolve with acceptable DataValue quality.</text>
</svg>
