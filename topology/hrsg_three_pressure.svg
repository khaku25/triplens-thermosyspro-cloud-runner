<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">TripLens three-pressure HRSG overview</title>
  <desc id="desc">HP, IP and LP drum and feedwater pump pairs with fail-closed OPC UA bindings.</desc>
  <defs><style>
    .bg{fill:#f4f7fa}.panel{fill:#fff;stroke:#d8e1e8;stroke-width:2}.title{font:700 28px Arial,sans-serif;fill:#16324a}.sub{font:14px Arial,sans-serif;fill:#607384}.lane{fill:#f8fafc;stroke:#cbd7df;stroke-width:2}.vessel{fill:#fef3f2;stroke:#b42318;stroke-width:3}.water{fill:#d6e9f7}.pump{fill:#fef3f2;stroke:#b42318;stroke-width:3}.pipe{fill:none;stroke:#3478b8;stroke-width:5}.name{font:700 17px Arial,sans-serif;fill:#243746;text-anchor:middle}.tag{font:12px Arial,sans-serif;fill:#657784;text-anchor:middle}.bad{font:700 12px Arial,sans-serif;fill:#b42318;text-anchor:middle}.note{font:13px Arial,sans-serif;fill:#5d7080}
  </style></defs>
  <rect class="bg" width="1400" height="820"/><rect class="panel" x="24" y="22" width="1352" height="770" rx="18"/>
  <text class="title" x="55" y="66">HRSG — Three Pressure Feedwater</text><text class="sub" x="55" y="94">실제 Level/Pressure/Speed/Flow DataValue 확인 전 모든 설비 BAD / UNBOUND</text>
  <rect class="lane" x="60" y="140" width="400" height="550" rx="18"/><rect class="lane" x="500" y="140" width="400" height="550" rx="18"/><rect class="lane" x="940" y="140" width="400" height="550" rx="18"/>
  <text class="name" x="260" y="180">HP SYSTEM</text><text class="name" x="700" y="180">IP SYSTEM</text><text class="name" x="1140" y="180">LP SYSTEM</text>
  <path class="pipe" d="M260 530 V430 M700 530 V430 M1140 530 V430"/>
  <g id="drum-hp-vessel" data-bind="LEVEL_M; PRESSURE_PA" data-quality="BAD" data-state="UNBOUND"><title>HP drum — BAD / UNBOUND</title><rect class="vessel" x="150" y="230" width="220" height="200" rx="70"/><rect class="water" x="164" y="337" width="192" height="72" rx="28"/><text class="name" x="260" y="280">HP DRUM</text><text class="tag" x="260" y="310">LEVEL_M · PRESSURE_PA</text><text class="bad" x="260" y="390">BAD · UNBOUND</text></g>
  <g id="fwp-hp" data-bind="SPEED_CMD/FB; MASS_FLOW; RUN_FB; TRIP_LATCH" data-quality="BAD" data-state="UNBOUND"><title>HP FWP — BAD / UNBOUND</title><circle class="pump" cx="260" cy="565" r="68"/><path d="M225 600 L225 530 L315 565 Z" fill="none" stroke="#b42318" stroke-width="3"/><text class="name" x="260" y="655">HP FWP</text><text class="bad" x="260" y="676">BAD · UNBOUND</text></g>
  <g id="drum-ip-vessel" data-bind="LEVEL_M; PRESSURE_PA" data-quality="BAD" data-state="UNBOUND"><title>IP drum — BAD / UNBOUND</title><rect class="vessel" x="590" y="230" width="220" height="200" rx="70"/><rect class="water" x="604" y="337" width="192" height="72" rx="28"/><text class="name" x="700" y="280">IP DRUM</text><text class="tag" x="700" y="310">LEVEL_M · PRESSURE_PA</text><text class="bad" x="700" y="390">BAD · UNBOUND</text></g>
  <g id="fwp-ip" data-bind="SPEED_CMD/FB; MASS_FLOW; RUN_FB; TRIP_LATCH" data-quality="BAD" data-state="UNBOUND"><title>IP FWP — BAD / UNBOUND</title><circle class="pump" cx="700" cy="565" r="68"/><path d="M665 600 L665 530 L755 565 Z" fill="none" stroke="#b42318" stroke-width="3"/><text class="name" x="700" y="655">IP FWP</text><text class="bad" x="700" y="676">BAD · UNBOUND</text></g>
  <g id="drum-lp-vessel" data-bind="LEVEL_M; PRESSURE_PA" data-quality="BAD" data-state="UNBOUND"><title>LP drum — BAD / UNBOUND</title><rect class="vessel" x="1030" y="230" width="220" height="200" rx="70"/><rect class="water" x="1044" y="337" width="192" height="72" rx="28"/><text class="name" x="1140" y="280">LP DRUM</text><text class="tag" x="1140" y="310">LEVEL_M · PRESSURE_PA</text><text class="bad" x="1140" y="390">BAD · UNBOUND</text></g>
  <g id="fwp-lp" data-bind="SPEED_CMD/FB; MASS_FLOW; RUN_FB; TRIP_LATCH" data-quality="BAD" data-state="UNBOUND"><title>LP FWP — BAD / UNBOUND</title><circle class="pump" cx="1140" cy="565" r="68"/><path d="M1105 600 L1105 530 L1195 565 Z" fill="none" stroke="#b42318" stroke-width="3"/><text class="name" x="1140" y="655">LP FWP</text><text class="bad" x="1140" y="676">BAD · UNBOUND</text></g>
  <text class="note" x="60" y="745">STOP and VCB OPEN remain distinct. Static SVG bindings do not prove motor, breaker, or ThermoSysPro runtime behavior.</text>
</svg>
