name: TEMP diagnose native OpenModelica initialization

on:
  pull_request:
    branches: [main]
    paths:
      - "modelica/build_native_opcua.mos.tpl"
      - "modelica/TripLens_PumpPhysics.mo"
      - "modelica/TripLens_CombinedCycle_TripTAC.mo.tpl"
      - "scripts/render_modelica.py"
      - "scripts/patch_turbine_bypass_model.py"
      - "scripts/patch_native_opcua_valve_controls.py"
      - "scripts/patch_lp_fwp_opcua.py"
      - "scripts/patch_all_fwp_check_valves.py"
      - "scripts/patch_hp_ip_fwp_opcua.py"
      - "scripts/patch_stodola_turbine.py"
      - "scripts/patch_pressure_loss_property_floor.py"
      - ".github/workflows/diagnose-native-opcua-init.yml"
      - "tests/test_native_init_diagnostic_workflow.py"

permissions:
  contents: read

concurrency:
  group: temporary-native-init-${{ github.ref }}
  cancel-in-progress: true

jobs:
  init-probe:
    name: init-${{ matrix.profile }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - profile: lp-only
            apply_all_check_valves: "false"
          - profile: lp-with-all-nrvs
            apply_all_check_valves: "true"
    env:
      OPENMODELICA_IMAGE: openmodelica/openmodelica:v1.27.0-minimal
      THERMOSYSPRO_COMMIT: db81ae1b5a6a85f6c6c7693244cafa6087e18ff5
      INIT_STOP_TIME_S: "0.04"

    steps:
      - uses: actions/checkout@v4

      - name: Assemble ${{ matrix.profile }} physical boundary
        env:
          APPLY_ALL_CHECK_VALVES: ${{ matrix.apply_all_check_valves }}
        run: |
          mkdir -p build/omhome vendor outputs/init-probe
          python3 scripts/render_modelica.py \
            --external-trip-input \
            --stop-time "$INIT_STOP_TIME_S" \
            --intervals 10
          git clone --no-checkout \
            https://github.com/Dwarf-Planet-Project/ThermoSysPro.git \
            vendor/ThermoSysPro
          git -C vendor/ThermoSysPro checkout --detach "$THERMOSYSPRO_COMMIT"
          test "$(git -C vendor/ThermoSysPro rev-parse HEAD)" = "$THERMOSYSPRO_COMMIT"
          plant=vendor/ThermoSysPro/ThermoSysPro/Examples/CombinedCyclePowerPlant/CombinedCycle_TripTAC.mo
          python3 scripts/patch_turbine_bypass_model.py --source "$plant"
          python3 scripts/patch_lp_fwp_opcua.py --source "$plant"
          if [ "$APPLY_ALL_CHECK_VALVES" = "true" ]; then
            python3 scripts/patch_all_fwp_check_valves.py --source "$plant"
          fi
          python3 scripts/patch_stodola_turbine.py \
            vendor/ThermoSysPro/ThermoSysPro/WaterSteam/Machines/StodolaTurbine.mo
          python3 scripts/patch_pressure_loss_property_floor.py \
            vendor/ThermoSysPro/ThermoSysPro/WaterSteam/PressureLosses/ControlValve.mo \
            vendor/ThermoSysPro/ThermoSysPro/WaterSteam/PressureLosses/PipePressureLoss.mo

      - name: Install pinned Modelica dependency
        run: |
          timeout --signal=TERM --kill-after=30s 8m \
            docker run --rm \
              -v "$PWD/build/omhome:/root" \
              -v "$PWD:/workspace" \
              -w /workspace \
              "$OPENMODELICA_IMAGE" \
              omc /workspace/modelica/install_dependencies.mos

      - name: Build native executable with default DASSL
        run: |
          timeout --signal=TERM --kill-after=30s 18m \
            docker run --rm \
              -v "$PWD/build/omhome:/root" \
              -v "$PWD:/workspace" \
              -w /workspace \
              "$OPENMODELICA_IMAGE" \
              omc /workspace/build/build_native_opcua.mos \
              | tee "outputs/init-probe/${{ matrix.profile }}-build.log"
          if grep -Eq 'Failed to build model|Error:' \
              "outputs/init-probe/${{ matrix.profile }}-build.log"; then
            exit 1
          fi
          test -x build/TripLens_Native_OPCUA

      - name: Probe initialization only
        run: |
          set +e
          timeout --signal=TERM --kill-after=10s 90s \
            docker run --rm \
              -v "$PWD/build:/workspace/build" \
              -w /workspace/build \
              "$OPENMODELICA_IMAGE" \
              ./TripLens_Native_OPCUA \
                -lv=LOG_SUCCESS,LOG_NLS \
                -r="${{ matrix.profile }}-init.csv" \
            > "outputs/init-probe/${{ matrix.profile }}-runtime.log" 2>&1
          probe_status=$?
          set -e
          if [ "$probe_status" -ne 0 ]; then
            tail -n 500 "outputs/init-probe/${{ matrix.profile }}-runtime.log"
            exit "$probe_status"
          fi
          if ! grep -Fq "The initialization finished successfully" \
              "outputs/init-probe/${{ matrix.profile }}-runtime.log"; then
            tail -n 500 "outputs/init-probe/${{ matrix.profile }}-runtime.log"
            echo "Initialization success marker was not emitted"
            exit 1
          fi
          echo "NATIVE_INIT_PROBE_PASS profile=${{ matrix.profile }} solver=dassl"

      - name: Upload ${{ matrix.profile }} initialization evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-init-${{ matrix.profile }}-${{ github.run_number }}
          path: |
            outputs/init-probe/${{ matrix.profile }}-build.log
            outputs/init-probe/${{ matrix.profile }}-runtime.log
            build/TripLens_Native_OPCUA_info.json
            build/TripLens_Native_OPCUA_init.xml
          if-no-files-found: warn
          retention-days: 14
