name: Build OMEdit Initialization MAT

on:
  pull_request:
    branches:
      - main
    paths:
      - "scripts/render_modelica.py"
      - "scripts/patch_turbine_bypass_model.py"
      - "scripts/patch_fmu_valve_controls.py"
      - "scripts/patch_stodola_turbine.py"
      - "modelica/TripLens_CombinedCycle_TripTAC.mo.tpl"
      - "modelica/TripLens_OMEdit_Init_Alias.mo"
      - "modelica/build_omedit_initialization.mos"
      - ".github/workflows/build-omedit-initialization.yml"
  push:
    branches:
      - codex/omedit-init-mat-20260910
    paths:
      - "scripts/render_modelica.py"
      - "scripts/patch_turbine_bypass_model.py"
      - "scripts/patch_fmu_valve_controls.py"
      - "scripts/patch_stodola_turbine.py"
      - "modelica/TripLens_CombinedCycle_TripTAC.mo.tpl"
      - "modelica/TripLens_OMEdit_Init_Alias.mo"
      - "modelica/build_omedit_initialization.mos"
      - ".github/workflows/build-omedit-initialization.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: omedit-initialization-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-initialization-mat:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      THERMOSYSPRO_COMMIT: db81ae1b5a6a85f6c6c7693244cafa6087e18ff5
      OPENMODELICA_IMAGE: openmodelica/openmodelica:v1.27.0-minimal
    steps:
      - uses: actions/checkout@v4

      - name: Render model and pin ThermoSysPro
        run: |
          mkdir -p build/omhome vendor
          python3 scripts/render_modelica.py \
            --normal-operation --stop-time 2 --intervals 20
          git clone --no-checkout \
            https://github.com/Dwarf-Planet-Project/ThermoSysPro.git \
            vendor/ThermoSysPro
          git -C vendor/ThermoSysPro checkout --detach "$THERMOSYSPRO_COMMIT"
          test "$(git -C vendor/ThermoSysPro rev-parse HEAD)" = "$THERMOSYSPRO_COMMIT"

      - name: Apply the validated physical model patches
        run: |
          MODEL=vendor/ThermoSysPro/ThermoSysPro/Examples/CombinedCyclePowerPlant/CombinedCycle_TripTAC.mo
          python3 scripts/patch_turbine_bypass_model.py --source "$MODEL"
          python3 scripts/patch_fmu_valve_controls.py --source "$MODEL"
          python3 scripts/patch_stodola_turbine.py \
            vendor/ThermoSysPro/ThermoSysPro/WaterSteam/Machines/StodolaTurbine.mo

      - name: Install pinned Modelica dependency
        run: |
          timeout --signal=TERM --kill-after=30s 8m \
            docker run --rm \
              -v "$PWD/build/omhome:/root" \
              -v "$PWD:/workspace" \
              -w /workspace \
              "$OPENMODELICA_IMAGE" \
              omc /workspace/modelica/install_dependencies.mos

      - name: Generate full-variable OMEdit initialization MAT
        run: |
          timeout --signal=TERM --kill-after=30s 35m \
            docker run --rm \
              -v "$PWD/build/omhome:/root" \
              -v "$PWD:/workspace" \
              -w /workspace \
              "$OPENMODELICA_IMAGE" \
              omc /workspace/modelica/build_omedit_initialization.mos \
            | tee build/openmodelica-omedit-init.log
          if grep -Eq \
            'resultFile = ""|Failed to build model|Simulation execution failed|Error:' \
            build/openmodelica-omedit-init.log; then
            echo "OpenModelica reported a build or simulation failure" >&2
            exit 1
          fi
          test -s build/TripLensUserModels.CombinedCycle_TripTAC_steady_init_res.mat

      - name: Upload OMEdit initialization package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: triplens-omedit-initialization-${{ github.run_number }}
          path: |
            build/TripLensUserModels.CombinedCycle_TripTAC_steady_init_res.mat
            build/TripLens_CombinedCycle_TripTAC.mo
            build/openmodelica-omedit-init.log
          if-no-files-found: warn
          retention-days: 30
