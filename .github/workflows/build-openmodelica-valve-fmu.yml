name: Build OpenModelica Native Valve FMU

on:
  push:
    branches:
      - main
      - codex/openmodelica-valve-adapter-v1-20260910
    paths:
      - "scripts/patch_fmu_valve_controls.py"
      - "scripts/patch_turbine_bypass_model.py"
      - "scripts/validate_fmu_valve_smoke.py"
      - "modelica/TripLens_Valve_Adapter_Smoke.mo"
      - "modelica/TripLens_Valve_Adapter_All_Smoke.mo"
      - "modelica/build_fmu_valve_adapter.mos"
      - "tests/test_openmodelica_valve_adapter.py"
      - ".github/workflows/build-openmodelica-valve-fmu.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openmodelica-native-valve-fmu-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify source transformation and single ownership
        run: |
          python3 -m unittest             tests.test_turbine_bypass_patch             tests.test_openmodelica_valve_adapter -v

  build-and-physical-smoke:
    needs: source-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      THERMOSYSPRO_COMMIT: db81ae1b5a6a85f6c6c7693244cafa6087e18ff5
      OPENMODELICA_IMAGE: openmodelica/openmodelica:v1.27.0-minimal
    steps:
      - uses: actions/checkout@v4

      - name: Render wrapper and pin ThermoSysPro
        run: |
          mkdir -p build/omhome vendor
          python3 scripts/render_modelica.py             --normal-operation --stop-time 2 --intervals 20
          git clone --no-checkout             https://github.com/Dwarf-Planet-Project/ThermoSysPro.git             vendor/ThermoSysPro
          git -C vendor/ThermoSysPro checkout --detach "$THERMOSYSPRO_COMMIT"
          test "$(git -C vendor/ThermoSysPro rev-parse HEAD)" = "$THERMOSYSPRO_COMMIT"

      - name: Apply physical bypass and FMI valve adapters
        run: |
          MODEL=vendor/ThermoSysPro/ThermoSysPro/Examples/CombinedCyclePowerPlant/CombinedCycle_TripTAC.mo
          python3 scripts/patch_turbine_bypass_model.py --source "$MODEL"
          python3 scripts/patch_fmu_valve_controls.py --source "$MODEL"
          python3 scripts/patch_stodola_turbine.py             vendor/ThermoSysPro/ThermoSysPro/WaterSteam/Machines/StodolaTurbine.mo

      - name: Install pinned Modelica dependency
        run: |
          timeout --signal=TERM --kill-after=30s 8m             docker run --rm               -v "$PWD/build/omhome:/root"               -v "$PWD:/workspace"               -w /workspace               "$OPENMODELICA_IMAGE"               omc /workspace/modelica/install_dependencies.mos

      - name: Build FMU and run native physical smoke simulations
        run: |
          timeout --signal=TERM --kill-after=30s 32m             docker run --rm               -v "$PWD/build/omhome:/root"               -v "$PWD:/workspace"               -w /workspace               "$OPENMODELICA_IMAGE"               omc /workspace/modelica/build_fmu_valve_adapter.mos               | tee build/openmodelica-valve-fmu.log
          if grep -Eq             'resultFile = ""|Failed to build model|Simulation execution failed|Error:'             build/openmodelica-valve-fmu.log; then
            echo "OpenModelica reported a build or simulation failure" >&2
            exit 1
          fi
          test -s build/valve_auto_baseline_res.csv
          test -s build/valve_manual_fault_smoke_res.csv
          test -s build/valve_all_manual_smoke_res.csv
          test -s build/TripLens_Native_Valve_Control_V1.fmu

      - name: Prove command-to-physics linkage and FMI causality
        run: |
          python3 scripts/validate_fmu_valve_smoke.py             --auto build/valve_auto_baseline_res.csv             --smoke build/valve_manual_fault_smoke_res.csv             --all-manual build/valve_all_manual_smoke_res.csv             --fmu build/TripLens_Native_Valve_Control_V1.fmu             | tee build/native-valve-physics-validation.log
          grep -q OPENMODELICA_NATIVE_VALVE_PHYSICS_PASS             build/native-valve-physics-validation.log

      - name: Upload FMU and physical evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openmodelica-native-valve-fmu-${{ github.run_number }}
          path: |
            build/TripLens_Native_Valve_Control_V1.fmu
            build/valve_auto_baseline_res.csv
            build/valve_manual_fault_smoke_res.csv
            build/valve_all_manual_smoke_res.csv
            build/openmodelica-valve-fmu.log
            build/native-valve-physics-validation.log
          if-no-files-found: warn
          retention-days: 30
