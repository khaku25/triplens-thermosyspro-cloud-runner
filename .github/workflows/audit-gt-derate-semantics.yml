name: Audit GT Trip vs DERATE Semantics

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-thermosyspro.yml'
      - '.github/workflows/run-vpp-gt-trip.yml'
      - '.github/workflows/audit-gt-derate-semantics.yml'
      - 'scripts/run_pipeline.sh'
      - 'scripts/render_modelica.py'
      - 'scripts/build_raw_manifest.py'
      - 'modelica/TripLens_CombinedCycle_TripTAC.mo.tpl'
      - 'config/ecms_command_catalog.csv'
      - 'tests/test_gt_derate_profile_semantics.py'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/run-thermosyspro.yml'
      - '.github/workflows/run-vpp-gt-trip.yml'
      - '.github/workflows/audit-gt-derate-semantics.yml'
      - 'scripts/run_pipeline.sh'
      - 'scripts/render_modelica.py'
      - 'scripts/build_raw_manifest.py'
      - 'modelica/TripLens_CombinedCycle_TripTAC.mo.tpl'
      - 'config/ecms_command_catalog.csv'
      - 'tests/test_gt_derate_profile_semantics.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify GT Trip and GT DERATE separation
        run: |
          python3 -m unittest \
            tests.test_gt_derate_profile_semantics \
            tests.test_raw_action -v
