name: Generate ThermoSysPro RAW (GT DERATE physical adapter)

on:
  workflow_dispatch:
    inputs:
      sampling_profile:
        description: Physical CSV sampling profile; no alarm or ECMS data is generated
        required: true
        type: choice
        default: causal_100ms
        options:
          - causal_100ms
          - standard
          - incident_1ms
      event_time_s:
        description: GT DERATE exhaust-boundary change start time in seconds; this is not GT Trip
        required: true
        default: "600"
      transition_duration_s:
        description: GT DERATE exhaust-boundary transition duration in seconds
        required: true
        default: "5"
      stop_time_s:
        description: Simulation stop time in seconds
        required: true
        default: "1000"
      output_intervals:
        description: Output interval count used by the standard profile
        required: true
        default: "1000"

permissions:
  contents: read

concurrency:
  group: thermosyspro-raw-gt-derate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out physical-model runner
        uses: actions/checkout@v4

      - name: Verify RAW-only and Trip-semantic boundaries
        run: |
          python3 -m unittest tests.test_raw_action -v
          python3 config/audit_trip_semantics.py

      - name: Run GT DERATE ThermoSysPro RAW-only simulation
        env:
          SAMPLING_PROFILE: ${{ inputs.sampling_profile }}
          EVENT_TIME_S: ${{ inputs.event_time_s }}
          TRANSITION_DURATION_S: ${{ inputs.transition_duration_s }}
          STOP_TIME_S: ${{ inputs.stop_time_s }}
          OUTPUT_INTERVALS: ${{ inputs.output_intervals }}
        run: |
          chmod +x scripts/run_pipeline.sh
          scripts/run_pipeline.sh \
            "$EVENT_TIME_S" \
            "$TRANSITION_DURATION_S" \
            "$STOP_TIME_S" \
            "$OUTPUT_INTERVALS" \
            "$SAMPLING_PROFILE"

      - name: Upload blind-test RAW
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: thermosyspro-raw-gt-derate-${{ github.run_number }}
          path: |
            outputs/thermosyspro-raw.csv
            outputs/raw-manifest.json
          if-no-files-found: error
          retention-days: 30
