name: Audit Trip Semantics

on:
  push:
    branches: [main]
    paths:
      - 'config/ecms_command_catalog.csv'
      - 'config/dcs_alarm_rules.csv'
      - 'data/ecms_tag_catalog.csv'
      - 'config/audit_trip_semantics.py'
      - '.github/workflows/audit-trip-semantics.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-trip-semantics:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Audit canonical Trip naming and breaker feedback
        run: |
          python3 config/audit_trip_semantics.py | tee trip_semantics_audit.log
          grep -q 'TRIPLENS_TRIP_SEMANTICS_AUDIT_PASS' trip_semantics_audit.log
      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trip-semantics-audit-${{ github.run_number }}
          path: |
            trip_semantics_audit.log
            outputs/trip_semantics_audit.json
          if-no-files-found: warn
          retention-days: 30
