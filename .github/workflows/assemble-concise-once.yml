name: Assemble Verified Concise Report Once
on:
  push:
    branches: [codex/concise-common-report-20260927]
    paths: ['.github/workflows/assemble-concise-once.yml']
permissions:
  contents: write
jobs:
  assemble:
    if: github.repository == 'khaku25/triplens-thermosyspro-cloud-runner'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply checksum-locked patch to exact approved snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, subprocess, urllib.request
          assert subprocess.check_output(['git','rev-parse','HEAD^'],text=True).strip() == 'f763df0b092ece862dafc79ec3d033fb3be86a4d', 'Base moved; stop rather than overwrite'
          repo='khaku25/triplens-thermosyspro-cloud-runner'
          chunks=['543c135040b9eceb10fcbe71fab9d440ec0cc744','95b1a58972033428284c7551f0873e84cedde0eb','0650af26a93a48db872722dab0b254b076c7439a','5a1ee59e8aec20127eb24baecd37888cba6fce99']
          encoded=[]
          for sha in chunks:
              req=urllib.request.Request(f'https://api.github.com/repos/{repo}/git/blobs/{sha}',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(req,timeout=30) as response: blob=json.load(response)
              encoded.append(base64.b64decode(blob['content']).decode())
          patch=lzma.decompress(base64.b64decode(''.join(encoded)))
          assert hashlib.sha256(patch).hexdigest() == '45427dda16e37f67fd09741c0466613db74cef34f7e9482a6c1f40f0f9b52203'
          pathlib.Path('/tmp/concise.patch').write_bytes(patch)
          subprocess.run(['git','apply','--check','/tmp/concise.patch'],check=True)
          subprocess.run(['git','apply','--index','/tmp/concise.patch'],check=True)
          manifest={
            'apps/web/components/TripLensWorkspace.js':'7db181b1b35133915db16a194c92f62a8b0bceed38f1de366f590a962871f78e',
            'apps/web/lib/reportExporter.cjs':'52b9f2fc3f87428e1946ae8d187c267dea68ad1b77904c797bcf9877a23ed74d',
            'apps/web/lib/triplens_ai_output_contract.js':'f130e4976f16c702174563ccca033fbd29646261a193961b30db9ee7f1cae628',
            'apps/web/lib/workspacePresentation.mjs':'f202db6b9970b601caad5d5c4f1fd061eeb35daa56bf853a1cee0811cb2f87c0',
            'docs/CONCISE_REPORT_POLICY.md':'0c2928a0dbcbef5fc7f58d9c41b1bf73000beb0265a301ff862b47b5cced9b1c',
            'services/agent-api/gemini_agent.py':'21d9fff151b58084694c3ea251d549aa1e333253ae68ae8f0137b7f1fd6e5bd3',
            'services/agent-api/openai_agent.py':'ae76b63438f2a9da244957e7a2a39a25d9ef311856a289f92971ce3c70d9b0c3',
            'services/agent-api/tests/test_concise_provider_repair.py':'d2e28e2f4dc501cc9d8b1389320f2680f92356290b1c7752f5910b0583b9307f',
            'services/agent-api/tests/test_concise_report.py':'b5d41664b4198fea46fc986e1591c513915eea8b17fcb5a9b87e308d03aa7366',
            'services/agent-api/triplens/analysis_contract.py':'3813bc591b2124184724f6946849c9b7310895603f5b9301dabf89a87e9a56e3',
            'services/agent-api/triplens/hybrid_agent_prompt.md':'e0cf193bacaac96587c58440f5ec484ab62c1ef0c97465fc9bcc4594bc1dedfd',
            'services/agent-api/triplens/report_presentation.py':'1dce615c17560dc2ce90e467a0c781a710cccf685676047d974b5a7d03da0cfb',
            'tests/test_concise_report.mjs':'9b7e4b8b4668feb688e2ddfae78afa14b0fa4bead978d64f570ec098b65fcc5e',
            'webapp/triplens_ai_output_contract.js':'79955031d6b2965d00607d6e7e41595524667c8f9aa79fb4fed321a598916c04'}
          changed=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          assert changed == set(manifest), 'Unexpected file outside approved scope'
          for path, digest in manifest.items(): assert hashlib.sha256(pathlib.Path(path).read_bytes()).hexdigest() == digest, path
          pathlib.Path('/tmp/concise-manifest.json').write_text(json.dumps(manifest))
          print('All 14 changed files exactly match the locally tested source')
          PY
      - name: Install backend dependencies
        run: |
          python - <<'PY'
          import pathlib,subprocess,sys,tomllib
          spec=tomllib.loads(pathlib.Path('services/agent-api/pyproject.toml').read_text())
          subprocess.run([sys.executable,'-m','pip','install',*spec['project']['dependencies']],check=True)
          PY
      - name: Backend and focused frontend regressions without provider calls
        run: |
          python -m unittest discover -s services/agent-api/tests -p 'test_*.py' -v
          node --test tests/test_concise_report.mjs tests/test_report_export.mjs tests/test_report_adapter.mjs tests/test_ai_output_contract.mjs tests/test_workspace_presentation.mjs tests/test_analysis_client.mjs tests/test_report_row_identity.mjs tests/test_report_semantic_placement.mjs
      - name: Record full frontend suite and reject new failures
        run: |
          python - <<'PY'
          import pathlib,re,subprocess
          files=sorted(str(p) for p in pathlib.Path('tests').glob('test_*.mjs'))+sorted(str(p) for p in pathlib.Path('apps/web/lib').glob('*.test.mjs'))
          result=subprocess.run(['node','--test',*files],stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True)
          pathlib.Path('/tmp/concise-node-all.log').write_text(result.stdout)
          failed=re.findall(r'^not ok \d+ - (.+)$',result.stdout,re.M)
          known={'Plant overview opens from its direct URL without an equipment selection','published Logic/TAG assets expose the verified ST grid power signal','published Drawing Master links ST grid power to its exact rule diagrams'}
          print('\n'.join(line for line in result.stdout.splitlines() if line.startswith(('not ok','# tests','# pass','# fail'))))
          assert not (set(failed)-known), 'New frontend regression'
          assert result.returncode == 0 or (result.returncode == 1 and len(failed)==3 and set(failed)==known), 'Unexpected test execution failure'
          with open(__import__('os').environ['GITHUB_STEP_SUMMARY'],'a') as out: out.write('Full frontend suite: known pre-existing failures remain (not a full pass).\n'+ '\n'.join(failed)+'\n')
          PY
      - name: Build current frontend
        run: |
          npm ci --prefix apps/web --no-audit --no-fund
          npm run build --prefix apps/web
      - name: Create verified candidate commit only; do not move any branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import hashlib,json,os,pathlib,urllib.request
          repo='khaku25/triplens-thermosyspro-cloud-runner'
          def api(path, data=None):
              req=urllib.request.Request('https://api.github.com/repos/'+repo+path,data=None if data is None else json.dumps(data,ensure_ascii=False).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'},method='GET' if data is None else 'POST')
              with urllib.request.urlopen(req,timeout=30) as response: return json.load(response)
          manifest=json.loads(pathlib.Path('/tmp/concise-manifest.json').read_text())
          entries=[]
          for path,digest in manifest.items():
              content=pathlib.Path(path).read_bytes()
              assert hashlib.sha256(content).hexdigest()==digest,path
              blob=api('/git/blobs',{'content':content.decode(),'encoding':'utf-8'})
              entries.append({'path':path,'mode':'100644','type':'blob','sha':blob['sha']})
          entries.append({'path':'.github/workflows/assemble-concise-once.yml','mode':'100644','type':'blob','sha':None})
          parent=api('/git/commits/'+os.environ['GITHUB_SHA'])
          tree=api('/git/trees',{'base_tree':parent['tree']['sha'],'tree':entries})
          commit=api('/git/commits',{'message':'feat: share concise report summaries across Gemini and OpenAI without changing evidence','tree':tree['sha'],'parents':[os.environ['GITHUB_SHA']]})
          result={'candidate_commit':commit['sha'],'parent':os.environ['GITHUB_SHA'],'tree':tree['sha'],'manifest':manifest,'branch_updated':False}
          pathlib.Path('/tmp/concise-candidate.json').write_text(json.dumps(result,indent=2))
          print('VERIFIED_CANDIDATE_COMMIT='+commit['sha'])
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as out: out.write('Verified candidate commit: '+commit['sha']+'\nNo branch or deployment was changed by this workflow.\n')
          PY
      - name: Preserve candidate metadata and full test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: concise-verified-candidate-${{ github.run_id }}
          path: |
            /tmp/concise-candidate.json
            /tmp/concise-node-all.log
          retention-days: 7
