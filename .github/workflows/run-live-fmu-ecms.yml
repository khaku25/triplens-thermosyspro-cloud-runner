name: Verify main FMU ECMS live link

on:
  workflow_dispatch:
    inputs:
      upstream_run_id:
        description: Successful native-valve FMU workflow run ID
        required: false
        default: "34449701844"
  pull_request:
    branches:
      - main
    paths:
      - "scripts/live_*.py"
      - "scripts/prepare_standard_init_fmu.py"
      - "scripts/validate_live_fmu_contract.py"
      - "scripts/run_live_fmu_ecms.sh"
      - "requirements-live.txt"
      - "tests/test_live_fmu_network.py"
      - ".github/workflows/run-live-fmu-ecms.yml"

permissions:
  actions: read
  contents: read

concurrency:
  group: main-fmu-ecms-live-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-main-fmu-link:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      UPSTREAM_RUN_ID: ${{ inputs.upstream_run_id || '34449701844' }}
      UPSTREAM_ARTIFACT: openmodelica-native-valve-fmu-46
      SOURCE_FMU_SHA256: 883ca79109cc5277a01868068e916ebb1ad7df346b841820ff7b5ea66c76f387
      LIVE_STOP_TIME_S: "2"
      LIVE_STEP_SIZE_S: "0.01"
      OPENMODELICA_IMAGE: openmodelica/openmodelica:v1.27.0-minimal
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify transport contract
        run: python3 -m unittest tests.test_live_fmu_network -v

      - name: Download the already physics-qualified main FMU
        run: |
          mkdir -p build/upstream
          gh run download "$UPSTREAM_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$UPSTREAM_ARTIFACT" \
            --dir build/upstream
          test "$(sha256sum build/upstream/TripLens_Native_Valve_Control_V1.fmu | awk '{print $1}')" = "$SOURCE_FMU_SHA256"

      - name: Extract the matching full OpenModelica runtime
        run: |
          mkdir -p build/openmodelica-runtime/omc
          runtime_container="$(docker create "$OPENMODELICA_IMAGE")"
          docker cp \
            "$runtime_container:/usr/lib/x86_64-linux-gnu/omc/." \
            build/openmodelica-runtime/omc/
          for library in \
            liblapack.so.3 \
            libblas.so.3 \
            libgfortran.so.5 \
            libquadmath.so.0
          do
            docker cp -L \
              "$runtime_container:/lib/x86_64-linux-gnu/$library" \
              build/openmodelica-runtime/omc/
          done
          docker rm "$runtime_container" >/dev/null
          runtime_library="$PWD/build/openmodelica-runtime/omc/libSimulationRuntimeC.so"
          test -s "$runtime_library"
          LD_LIBRARY_PATH="$PWD/build/openmodelica-runtime/omc" ldd "$runtime_library" \
            | tee build/openmodelica-runtime/runtime-ldd.txt
          if grep -q "not found" build/openmodelica-runtime/runtime-ldd.txt; then
            exit 1
          fi
          nm -D --defined-only "$runtime_library" | grep -E \
            " (initialization|initializeNonlinearSystemData|nlsKinsolAllocate)$" \
            | tee build/openmodelica-runtime/runtime-symbols.txt
          test "$(wc -l < build/openmodelica-runtime/runtime-symbols.txt)" -eq 3
          echo "FMU_RUNTIME_LIBRARY=$runtime_library" >> "$GITHUB_ENV"
          echo "FMU_RUNTIME_LIBRARY_PATH=$PWD/build/openmodelica-runtime/omc" >> "$GITHUB_ENV"
          sha256sum "$runtime_library" | tee build/openmodelica-runtime/runtime-sha256.txt

      - name: Restore previously rebuilt runtime FMU
        id: runtime-fmu-cache
        uses: actions/cache/restore@v4
        with:
          path: build/runtime-artifact
          key: openmodelica-full-runtime-${{ env.SOURCE_FMU_SHA256 }}-v3

      - name: Restore full-runtime compiler objects
        id: runtime-object-cache
        if: steps.runtime-fmu-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: build/runtime-cmake
          key: openmodelica-full-runtime-objects-${{ env.SOURCE_FMU_SHA256 }}-v3

      - name: Build full-runtime FMU with standard symbolic initialization
        if: steps.runtime-fmu-cache.outputs.cache-hit != 'true'
        run: |
          python3 scripts/prepare_standard_init_fmu.py \
            --source-fmu build/upstream/TripLens_Native_Valve_Control_V1.fmu \
            --work-dir build/runtime-source \
            --manifest build/runtime-artifact/fmu-runtime-provenance.json
          cmake -S build/runtime-source/sources -B build/runtime-cmake \
            -DRUNTIME_DEPENDENCIES_LEVEL=none \
            -DOPENMODELICA_RUNTIME_DIRECTORY="$PWD/build/openmodelica-runtime/omc"
          cmake --build build/runtime-cmake --target create_fmu --parallel "$(nproc)"
          test -s build/TripLens_Native_Valve_Control_V1.fmu
          mv build/TripLens_Native_Valve_Control_V1.fmu build/runtime-artifact/
          unzip -p build/runtime-artifact/TripLens_Native_Valve_Control_V1.fmu \
            binaries/linux64/TripLens_Native_Valve_Control_V1.so \
            > build/runtime-artifact/TripLens_Native_Valve_Control_V1.so
          readelf -d build/runtime-artifact/TripLens_Native_Valve_Control_V1.so \
            | tee build/runtime-artifact/runtime-linkage.txt
          grep -q 'Shared library: \[libSimulationRuntimeC.so\]' \
            build/runtime-artifact/runtime-linkage.txt
          runtime_sha256="$(sha256sum build/runtime-artifact/TripLens_Native_Valve_Control_V1.fmu | awk '{print $1}')"
          python3 - "$runtime_sha256" <<'PY'
          import json
          import sys
          from pathlib import Path

          path = Path("build/runtime-artifact/fmu-runtime-provenance.json")
          manifest = json.loads(path.read_text(encoding="utf-8"))
          manifest["status"] = "BUILT"
          manifest["runtime_fmu_sha256"] = sys.argv[1]
          path.write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Save full-runtime compiler objects
        if: always() && steps.runtime-fmu-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build/runtime-cmake
          key: ${{ steps.runtime-object-cache.outputs.cache-primary-key }}

      - name: Save rebuilt runtime FMU
        if: steps.runtime-fmu-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build/runtime-artifact
          key: ${{ steps.runtime-fmu-cache.outputs.cache-primary-key }}

      - name: Pin the exact runtime FMU
        run: |
          test -s build/runtime-artifact/TripLens_Native_Valve_Control_V1.fmu
          test -s build/runtime-artifact/fmu-runtime-provenance.json
          runtime_sha256="$(sha256sum build/runtime-artifact/TripLens_Native_Valve_Control_V1.fmu | awk '{print $1}')"
          echo "EXPECTED_FMU_SHA256=$runtime_sha256" >> "$GITHUB_ENV"

      - name: Install pinned FMI runtime
        run: python3 -m pip install --disable-pip-version-check -r requirements-live.txt

      - name: Prove commands to physics to ECMS over TCP
        run: |
          chmod +x scripts/run_live_fmu_ecms.sh
          scripts/run_live_fmu_ecms.sh build/runtime-artifact/TripLens_Native_Valve_Control_V1.fmu
          cp build/runtime-artifact/fmu-runtime-provenance.json outputs/live-main-fmu/

      - name: Upload live link proof and dashboard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: main-fmu-ecms-live-${{ github.run_number }}
          path: |
            outputs/live-main-fmu/**
            build/openmodelica-runtime/runtime-*.txt
          if-no-files-found: warn
          retention-days: 30
