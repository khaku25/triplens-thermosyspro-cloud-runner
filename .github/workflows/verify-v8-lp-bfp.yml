name: Verify V8.5.2 LP BFP Dual Log physics

on:
  workflow_dispatch:
  push:
    branches: [v8.5.3-rc1-lpbfp]
  pull_request:
    branches: [main]
    paths:
      - "modelica/TripLens_CombinedCycle_TripTAC_ProcessView_v36.mo"
      - "modelica/TripLens_PumpPhysics.mo"
      - "modelica/build_v8_lpbfp.mos"
      - "scripts/ecms_bfp_alarm_engine.py"
      - "scripts/triplens_dual_log_analyzer.py"
      - "scripts/opcua_run_controller.py"
      - "scripts/verify_alarm_coverage_live.py"
      - "scripts/validate_v8_init_xml.py"
      - "scripts/summarize_v8_lpbfp.py"
      - "config/alarm_registry_v1.csv"
      - "opcua_native_valve_nodes_v1.csv"
      - "tests/v8_5_2/**"
      - ".github/workflows/verify-v8-lp-bfp.yml"

permissions:
  contents: read

concurrency:
  group: v8-lp-bfp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lp-bfp-dual-log:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      OPENMODELICA_IMAGE: openmodelica/openmodelica:v1.27.0-minimal
      THERMOSYSPRO_COMMIT: db81ae1b5a6a85f6c6c7693244cafa6087e18ff5
      ENDPOINT: opc.tcp://127.0.0.1:4841
      LIVE_STOP_TIME_S: "90"
      LIVE_STEP_SIZE_S: "0.04"
    steps:
      - uses: actions/checkout@v4

      - name: Verify V8 source and Dual Log contracts
        run: |
          mkdir -p build/v8-lpbfp
          python3 -m py_compile \
            scripts/ecms_bfp_alarm_engine.py \
            scripts/triplens_dual_log_analyzer.py \
            scripts/opcua_run_controller.py \
            scripts/verify_alarm_coverage_live.py \
            scripts/validate_v8_init_xml.py \
            scripts/summarize_v8_lpbfp.py \
            tests/v8_5_2/*.py
          python3 tests/v8_5_2/selftest_dual_log_contract.py
          python3 tests/v8_5_2/selftest_protection_matrix_v8.py \
            modelica/TripLens_CombinedCycle_TripTAC_ProcessView_v36.mo
          python3 tests/v8_5_2/selftest_engine_v8.py \
            --engine scripts/ecms_bfp_alarm_engine.py \
            --registry config/alarm_registry_v1.csv
          python3 tests/v8_5_2/selftest_alarm_semantics_v8.py \
            --registry config/alarm_registry_v1.csv \
            --dcs-rules config/dcs_alarm_rules.csv \
            --output build/v8-lpbfp/alarm-semantics.verify.json
          python3 tests/v8_5_2/selftest_alarm_binding_verifier_v8_5_1.py \
            --verifier scripts/verify_alarm_coverage_live.py \
            --registry config/alarm_registry_v1.csv
          python3 tests/v8_5_2/selftest_runtime_ui.py \
            --ui ECMS_BFP_ALARMS.m \
            --engine scripts/ecms_bfp_alarm_engine.py \
            --reset-script RESET_TRIPLENS_SIMULATION_V7.ps1
          python3 tests/v8_5_2/selftest_protection_dashboard_ui.py \
            --ui ECMS_BFP_ALARMS.m

      - name: Pin ThermoSysPro 3.1 source
        run: |
          mkdir -p build/v8-lpbfp build/omhome vendor outputs/v8-lpbfp
          git clone --no-checkout \
            https://github.com/Dwarf-Planet-Project/ThermoSysPro.git \
            vendor/ThermoSysPro
          git -C vendor/ThermoSysPro checkout --detach "$THERMOSYSPRO_COMMIT"
          test "$(git -C vendor/ThermoSysPro rev-parse HEAD)" = "$THERMOSYSPRO_COMMIT"
          grep -Eq 'ThermoSysPro Version 3\.1' vendor/ThermoSysPro/ThermoSysPro/package.mo

      - name: Install Modelica 3.2.3 in isolated OpenModelica home
        run: |
          timeout --signal=TERM --kill-after=30s 8m \
            docker run --rm \
              -v "$PWD/build/omhome:/root" \
              -v "$PWD:/workspace" \
              -w /workspace \
              "$OPENMODELICA_IMAGE" \
              omc /workspace/modelica/install_dependencies.mos \
              | tee build/v8-lpbfp/install-modelica.log
          grep -q 'Modelica 3.2.3+maint.om/package.mo' build/v8-lpbfp/install-modelica.log
          grep -q 'Package installed successfully' build/v8-lpbfp/install-modelica.log

      - name: Build the exact V8.5.2 plant
        run: |
          timeout --signal=TERM --kill-after=30s 22m \
            docker run --rm \
              -v "$PWD/build/omhome:/root" \
              -v "$PWD:/workspace" \
              -w /workspace \
              "$OPENMODELICA_IMAGE" \
              omc /workspace/modelica/build_v8_lpbfp.mos \
              | tee build/v8-lpbfp/openmodelica-build.log
          if grep -Eq 'Failed to build model|Error:' build/v8-lpbfp/openmodelica-build.log; then
            exit 1
          fi
          test -x build/v8-lpbfp/TripLens_V8_5_2_LP_BFP_CI
          test -s build/v8-lpbfp/TripLens_V8_5_2_LP_BFP_CI_init.xml
          python3 scripts/validate_v8_init_xml.py \
            --init-xml build/v8-lpbfp/TripLens_V8_5_2_LP_BFP_CI_init.xml \
            --valve-map opcua_native_valve_nodes_v1.csv \
            --output outputs/v8-lpbfp/input-contract.json

      - name: Install the pinned OPC UA client
        run: python3 -m pip install --disable-pip-version-check -r requirements-live.txt

      - name: Live-audit OPC UA tag identity and writable valve contract
        run: |
          audit_server="triplens-v8-tag-audit-${GITHUB_RUN_ID}"
          docker run --rm --name "$audit_server" --network host \
            -v "$PWD:/workspace" \
            -w /workspace/build/v8-lpbfp \
            "$OPENMODELICA_IMAGE" \
            ./TripLens_V8_5_2_LP_BFP_CI \
              -startTime=0 \
              -stopTime=600 \
              -stepSize="$LIVE_STEP_SIZE_S" \
              -tolerance=0.001 \
              -s=dassl \
              -outputFormat=mat \
              -r=TripLens_V8_5_2_LP_BFP_CI_tag_audit_res.mat \
              -rt=1 -w \
              -lv=LOG_ASSERT,LOG_STATS \
              -embeddedServer=opc-ua \
              -embeddedServerPort=4841 \
            > outputs/v8-lpbfp/openmodelica-tag-audit.log 2>&1 &
          audit_pid=$!
          audit_cleanup() {
            docker rm -f "$audit_server" >/dev/null 2>&1 || true
            wait "$audit_pid" 2>/dev/null || true
          }
          trap audit_cleanup EXIT
          for attempt in $(seq 1 240); do
            if (echo > /dev/tcp/127.0.0.1/4841) >/dev/null 2>&1; then break; fi
            if ! kill -0 "$audit_pid" 2>/dev/null; then
              tail -n 300 outputs/v8-lpbfp/openmodelica-tag-audit.log || true
              exit 1
            fi
            sleep 0.5
          done
          (echo > /dev/tcp/127.0.0.1/4841) >/dev/null 2>&1
          python3 scripts/opcua_run_controller.py --endpoint "$ENDPOINT"
          python3 tests/v8_5_2/audit_live_opcua_tags.py \
            --endpoint "$ENDPOINT" \
            --output-csv outputs/v8-lpbfp/live-opcua-tags.csv \
            --summary outputs/v8-lpbfp/live-opcua-tag-audit.json \
            --expected-min-vpp 600
          python3 tests/v8_5_2/verify_opcua_write_persistence.py \
            --endpoint "$ENDPOINT" \
            --map opcua_native_valve_nodes_v1.csv \
            --mode live \
            --step-size "$LIVE_STEP_SIZE_S" \
            --commit-timeout 60 \
            | tee outputs/v8-lpbfp/opcua-write-persistence.jsonl
          audit_cleanup
          trap - EXIT
          if (echo > /dev/tcp/127.0.0.1/4841) >/dev/null 2>&1; then
            echo "OPC UA audit port 4841 is still open after cleanup" >&2
            exit 1
          fi

      - name: Trip LP BFP and prove EVENT plus RAW
        run: |
          server_name="triplens-v8-lpbfp-${GITHUB_RUN_ID}"
          docker run --rm --name "$server_name" --network host \
            -v "$PWD:/workspace" \
            -w /workspace/build/v8-lpbfp \
            "$OPENMODELICA_IMAGE" \
            ./TripLens_V8_5_2_LP_BFP_CI \
              -startTime=0 \
              -stopTime="$LIVE_STOP_TIME_S" \
              -stepSize="$LIVE_STEP_SIZE_S" \
              -tolerance=0.001 \
              -s=dassl \
              -outputFormat=mat \
              -r=TripLens_V8_5_2_LP_BFP_CI_live_res.mat \
              -rt=1 -w \
              -lv=LOG_ASSERT,LOG_STATS \
              -embeddedServer=opc-ua \
              -embeddedServerPort=4841 \
            > outputs/v8-lpbfp/openmodelica-server.log 2>&1 &
          server_pid=$!
          cleanup() {
            docker rm -f "$server_name" >/dev/null 2>&1 || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          for attempt in $(seq 1 240); do
            if (echo > /dev/tcp/127.0.0.1/4841) >/dev/null 2>&1; then break; fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              tail -n 300 outputs/v8-lpbfp/openmodelica-server.log || true
              exit 1
            fi
            sleep 0.5
          done
          (echo > /dev/tcp/127.0.0.1/4841) >/dev/null 2>&1
          python3 scripts/opcua_run_controller.py --endpoint "$ENDPOINT"
          python3 scripts/verify_alarm_coverage_live.py \
            --repo-root "$PWD" \
            --endpoint "$ENDPOINT" \
            --registry config/alarm_registry_v1.csv \
            --output outputs/v8-lpbfp/alarm-bindings-live.json
          python3 tests/v8_5_2/verify_dual_log_live.py \
            --repo-root "$PWD" \
            --endpoint "$ENDPOINT" \
            --proof-root outputs/v8-lpbfp/dual-log \
            --timeout 240 \
            --postroll-model-seconds 1.0 \
            | tee outputs/v8-lpbfp/dual-log-verifier.jsonl
          incident_dir=$(find outputs/v8-lpbfp/dual-log/runtime/incidents -mindepth 1 -maxdepth 1 -type d | head -n 1)
          test -n "$incident_dir"
          python3 scripts/summarize_v8_lpbfp.py \
            --event "$incident_dir/EVENT.csv" \
            --raw "$incident_dir/RAW.csv" \
            --analysis "$incident_dir/DUAL_ANALYSIS.json" \
            --output outputs/v8-lpbfp/validation-summary.json
          cp "$incident_dir/EVENT.csv" outputs/v8-lpbfp/EVENT.csv
          cp "$incident_dir/RAW.csv" outputs/v8-lpbfp/RAW.csv
          cp "$incident_dir/DUAL_ANALYSIS.json" outputs/v8-lpbfp/DUAL_ANALYSIS.json
          cleanup
          trap - EXIT
          if (echo > /dev/tcp/127.0.0.1/4841) >/dev/null 2>&1; then
            echo "OPC UA port 4841 is still open after cleanup" >&2
            exit 1
          fi

      - name: Upload V8 LP BFP evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v8-lp-bfp-dual-log-${{ github.run_number }}
          path: |
            outputs/v8-lpbfp/**
            build/v8-lpbfp/openmodelica-build.log
            build/v8-lpbfp/install-modelica.log
          if-no-files-found: warn
          retention-days: 30
