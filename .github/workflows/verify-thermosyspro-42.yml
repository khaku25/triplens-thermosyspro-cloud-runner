name: Verify ThermoSysPro 4.2 physical simulation

on:
  push:
    branches:
      - experiment/thermosyspro-4.2
      - debug/trace-negative-pressure-20261011
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/verify-thermosyspro-42.yml"
      - "modelica/**"
      - "scripts/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  physical-simulation:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      THERMOSYSPRO_SHA: a896ab75ce22162369e7fa4ce79927eeca44ad4a
    steps:
      - uses: actions/checkout@v4

      - name: Install OpenModelica 1.27.1 official release
        run: |
          set -euo pipefail
          mkdir -p outputs/tsp42
          sudo apt-get update
          sudo apt-get install -y ca-certificates curl gnupg
          curl -fsSL https://build.openmodelica.org/apt/openmodelica.asc \
            | sudo gpg --dearmor -o /usr/share/keyrings/openmodelica-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/openmodelica-keyring.gpg] https://build.openmodelica.org/apt noble stable" \
            | sudo tee /etc/apt/sources.list.d/openmodelica.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends omc
          omc --version | tee outputs/tsp42/openmodelica-version.txt
          grep -q '1.27.1' outputs/tsp42/openmodelica-version.txt

      - name: Download and verify official ThermoSysPro 4.2
        run: |
          set -euo pipefail
          mkdir -p vendor build outputs/tsp42 "$RUNNER_TEMP/tsp42"
          archive_url="https://gitlab.pam-retd.fr/thermosysproandco/ThermoSysPro/-/archive/$THERMOSYSPRO_SHA/ThermoSysPro-$THERMOSYSPRO_SHA.zip"
          curl --fail --location --retry 3 --retry-delay 2 "$archive_url" \
            --output "$RUNNER_TEMP/tsp42/ThermoSysPro.zip"
          unzip -q "$RUNNER_TEMP/tsp42/ThermoSysPro.zip" -d "$RUNNER_TEMP/tsp42/unpacked"
          package_file="$(find "$RUNNER_TEMP/tsp42" -type f \
            -path '*/ThermoSysPro/package.mo' -print -quit)"
          test -n "$package_file"
          archive_root="$(dirname "$(dirname "$package_file")")"
          mv "$archive_root" vendor/ThermoSysPro
          package_file=vendor/ThermoSysPro/ThermoSysPro/package.mo
          grep -Eq 'ThermoSysPro Version 4\.2|version[[:space:]]*=[[:space:]]*"(4\.2|4\.2\.0)' \
            "$package_file"
          archive_sha256="$(sha256sum "$RUNNER_TEMP/tsp42/ThermoSysPro.zip" | cut -d' ' -f1)"
          printf 'revision=%s\narchive_sha256=%s\n' \
            "$THERMOSYSPRO_SHA" "$archive_sha256" \
            | tee outputs/tsp42/source-identity.txt
          grep -nE 'Version 4\.2|version[[:space:]]*=' "$package_file" | head -n 5

      - name: Capture ThermoSysPro 4.2 pressure-property source
        run: |
          set -euo pipefail
          mkdir -p outputs/tsp42/reference-source
          cp vendor/ThermoSysPro/ThermoSysPro/Properties/WaterSteam/IF97_packages.mo \
            outputs/tsp42/reference-source/IF97_packages.mo
          cp vendor/ThermoSysPro/ThermoSysPro/Properties/WaterSteam/BaseIF97.mo \
            outputs/tsp42/reference-source/BaseIF97.mo
          cp vendor/ThermoSysPro/ThermoSysPro/WaterSteam/HeatExchangers/SimpleDynamicCondenser.mo \
            outputs/tsp42/reference-source/SimpleDynamicCondenser.mo
          cp vendor/ThermoSysPro/ThermoSysPro/WaterSteam/PressureLosses/PipePressureLoss.mo \
            outputs/tsp42/reference-source/PipePressureLoss.mo
          cp vendor/ThermoSysPro/ThermoSysPro/WaterSteam/Machines/StaticCentrifugalPump.mo \
            outputs/tsp42/reference-source/StaticCentrifugalPump.mo

      - name: Test the version-independent turbine patch
        run: python3 -m unittest discover -s tests -p "test_turbine_bypass_patch.py"

      - name: Render the existing TripLens physical trip case
        run: |
          set -euo pipefail
          python3 scripts/render_modelica.py \
            --trip-time 2 \
            --trip-ramp-duration 5 \
            --stop-time 10 \
            --intervals 10000
          plant=vendor/ThermoSysPro/ThermoSysPro/Examples/CombinedCyclePowerPlant/CombinedCycle_TripTAC.mo
          test -s "$plant"
          cp "$plant" outputs/tsp42/CombinedCycle_TripTAC-4.2-upstream.mo
          sha256sum outputs/tsp42/CombinedCycle_TripTAC-4.2-upstream.mo \
            | tee outputs/tsp42/CombinedCycle_TripTAC-4.2-upstream.sha256
          turbine=vendor/ThermoSysPro/ThermoSysPro/WaterSteam/Machines/StodolaTurbine.mo
          test -s "$turbine"
          cp "$turbine" outputs/tsp42/StodolaTurbine-4.2-upstream.mo
          sha256sum outputs/tsp42/StodolaTurbine-4.2-upstream.mo \
            | tee outputs/tsp42/StodolaTurbine-4.2-upstream.sha256
          python3 scripts/patch_turbine_bypass_model.py --source "$plant"
          python3 scripts/patch_stodola_turbine.py \
            vendor/ThermoSysPro/ThermoSysPro/WaterSteam/Machines/StodolaTurbine.mo
          cp "$plant" outputs/tsp42/CombinedCycle_TripTAC-4.2-patched.mo
          sha256sum outputs/tsp42/CombinedCycle_TripTAC-4.2-patched.mo \
            | tee outputs/tsp42/CombinedCycle_TripTAC-4.2-patched.sha256
          cp build/TripLens_CombinedCycle_TripTAC.mo \
            outputs/tsp42/TripLens_CombinedCycle_TripTAC-4.2-rendered.mo
          sha256sum outputs/tsp42/TripLens_CombinedCycle_TripTAC-4.2-rendered.mo \
            | tee outputs/tsp42/TripLens_CombinedCycle_TripTAC-4.2-rendered.sha256

      - name: Apply consistent boiler-feed-pump pressure start
        run: |
          set -euo pipefail
          mkdir -p outputs/tsp42/consistent-start
          python3 - <<'PY'
          from pathlib import Path
          import math
          import re

          source_path = Path(
              "vendor/ThermoSysPro/ThermoSysPro/Examples/"
              "CombinedCyclePowerPlant/CombinedCycle_TripTAC.mo"
          )
          source = source_path.read_text()
          old = "Pm(start = 802830.7060548771)"
          new = "Pm(start = 812570.4167526974)"
          if source.count(old) != 1:
              raise SystemExit(
                  f"expected exactly one baseline pump start, got {source.count(old)}"
              )
          if new in source:
              raise SystemExit("consistent pump start already present before patch")
          source = source.replace(old, new, 1)

          scaling_replacements = {
              "MassFlowMultiplier DoubleDebitHP(alpha = 2)": (
                  "MassFlowMultiplier DoubleDebitHP("
                  "alpha = 2, Cs(h(nominal = 3500000)))"
              ),
              (
                  "h(fixed = false, start = 3433000), "
                  "Cv(start = 10875), "
                  "Pm(fixed = false, start = 12550000)"
              ): (
                  "h(fixed = false, start = 3433000, nominal = 3500000), "
                  "Cv(start = 10875), "
                  "Pm(fixed = false, start = 12550000, nominal = 10000000)"
              ),
          }
          for baseline, scaled in scaling_replacements.items():
              if source.count(baseline) != 1:
                  raise SystemExit(
                      f"expected exactly one nonlinear scaling target: {baseline}"
                  )
              if scaled in source:
                  raise SystemExit(
                      f"nonlinear scaling target already patched: {scaled}"
                  )
              source = source.replace(baseline, scaled, 1)
          source_path.write_text(source)
          scaling_evidence = (
              "vanne_entree_TurbineHP.h nominal=3500000 J/kg\\n"
              "vanne_entree_TurbineHP.Pm nominal=10000000 Pa\\n"
              "DoubleDebitHP.Cs.h nominal=3500000 J/kg\\n"
              "Solver scaling metadata only; starts and physical parameters unchanged.\\n"
          )
          print(scaling_evidence, end="")
          Path(
              "outputs/tsp42/consistent-start/nls-scaling-metadata.txt"
          ).write_text(scaling_evidence)

          match = re.search(
              r"PompeAlimBP\([^;]*?Pm\(start = ([0-9.]+)\)", source
          )
          if match is None:
              raise SystemExit("missing patched PompeAlimBP.Pm(start)")
          pump_pm = float(match.group(1))
          pump_outlet = 1622740.8335053949
          pump_inlet = 2 * pump_pm - pump_outlet
          loss_pm = (10000.0 + pump_inlet) / 2
          evidence = (
              f"PompeAlimBP.Pm(start)={pump_pm:.10f} Pa\n"
              f"derived PompeAlimBP.C1.P={pump_inlet:.10f} Pa\n"
              f"derived perteChargeK.Pm={loss_pm:.10f} Pa\n"
          )
          print(evidence, end="")
          Path(
              "outputs/tsp42/consistent-start/pressure-chain.txt"
          ).write_text(evidence)
          if not math.isclose(loss_pm, 6200.0, rel_tol=0.0, abs_tol=1e-7):
              raise SystemExit(
                  f"expected consistent perteChargeK.Pm=6200 Pa, got {loss_pm}"
              )
          properties_path = Path(
              "vendor/ThermoSysPro/ThermoSysPro/"
              "Properties/WaterSteam/IF97_packages.mo"
          )
          properties = properties_path.read_text()
          old_assert = (
              'assert(false, "Water_Ph: Incorrect region number (" '
              '+ String(region) + ")");'
          )
          new_assert = (
              'assert(false, "TRACE Water_Ph invalid region: p=" + String(p) '
              '+ " Pa, h=" + String(h) + " J/kg, mode=" + String(mode) '
              '+ ", region=" + String(region));'
          )
          if properties.count(old_assert) != 1:
              raise SystemExit(
                  f"expected one Water_Ph region assert, got "
                  f"{properties.count(old_assert)}"
              )
          properties = properties.replace(old_assert, new_assert, 1)
          wrapper = """    function checkedWater_Ph
                input String caller;
                input Units.SI.AbsolutePressure p "Raw pressure";
                input Units.SI.SpecificEnthalpy h "Specific enthalpy";
                input Integer mode = 0 "IF97 region. 0:automatic";
                output ThermoSysPro.Properties.WaterSteam.Common.ThermoProperties_ph pro;
              protected
                Units.SI.AbsolutePressure pSafe;
              algorithm
                pSafe := max(
                  p,
                  ThermoSysPro.Properties.WaterSteam.BaseIF97.triple.ptriple + 1
                );
                assert(
                  noEvent(p == pSafe),
                  "TRACE bounded Water_Ph caller " + caller
                  + ": raw p=" + String(p) + " Pa, safe p=" + String(pSafe)
                  + " Pa, h=" + String(h) + " J/kg",
                  AssertionLevel.warning
                );
                pro := Water_Ph(pSafe, h, mode);
                annotation(Inline = false);
              end checkedWater_Ph;

              function tracedWater_Ph
                input String caller;
                input Units.SI.AbsolutePressure p "Raw pressure";
                input Units.SI.SpecificEnthalpy h "Specific enthalpy";
                input Integer mode = 0 "IF97 region. 0:automatic";
                output ThermoSysPro.Properties.WaterSteam.Common.ThermoProperties_ph pro;
              algorithm
                assert(
                  noEvent(
                    p
                    > ThermoSysPro.Properties.WaterSteam.BaseIF97.triple.ptriple
                    and p
                    <= ThermoSysPro.Properties.WaterSteam.BaseIF97.data.PLIMIT1
                  ),
                  "TRACE direct Water_Ph caller " + caller
                  + ": p=" + String(p) + " Pa, h=" + String(h)
                  + " J/kg, mode=" + String(mode),
                  AssertionLevel.warning
                );
                pro := Water_Ph(p, h, mode);
                annotation(Inline = false);
              end tracedWater_Ph;

          """
          package_end = properties.rfind("end IF97_wAJ;")
          if package_end < 0 or "function checkedWater_Ph" in properties:
              raise SystemExit("could not insert checkedWater_Ph exactly once")
          properties = properties[:package_end] + wrapper + properties[package_end:]
          conductivity_helper = """    function checkedWater_sat_P
                input String caller;
                input Units.SI.AbsolutePressure p "Raw pressure";
                output ThermoSysPro.Properties.WaterSteam.Common.PropThermoSat lsat;
                output ThermoSysPro.Properties.WaterSteam.Common.PropThermoSat vsat;
              protected
                Units.SI.AbsolutePressure pSafe;
              algorithm
                pSafe := max(
                  min(
                    p,
                    ThermoSysPro.Properties.WaterSteam.BaseIF97.data.PCRIT - 1
                  ),
                  ThermoSysPro.Properties.WaterSteam.BaseIF97.triple.ptriple + 1
                );
                assert(
                  noEvent(p == pSafe),
                  "TRACE bounded Water_sat_P caller " + caller
                  + ": raw p=" + String(p) + " Pa, safe p=" + String(pSafe)
                  + " Pa",
                  AssertionLevel.warning
                );
                (lsat, vsat) := Water_sat_P(pSafe);
                annotation(Inline = false);
              end checkedWater_sat_P;

              function checkedThermalConductivity_rhoT
                input String caller;
                input Units.SI.Density rho "Density";
                input Units.SI.Temperature T "Temperature";
                input Units.SI.AbsolutePressure P "Raw pressure";
                input Integer region = 0 "IF97 region. 0:automatic";
                output Units.SI.ThermalConductivity lambda "Thermal conductivity";
              protected
                Units.SI.AbsolutePressure pSafe;
                Units.SI.Density rhoSafe;
              algorithm
                pSafe := max(
                  P,
                  ThermoSysPro.Properties.WaterSteam.BaseIF97.triple.ptriple + 1
                );
                rhoSafe := max(rho, 0.004854581);
                assert(
                  noEvent(rho == rhoSafe),
                  "TRACE thermal conductivity caller " + caller
                  + ": raw d=" + String(rho) + " kg/m3, safe d="
                  + String(rhoSafe) + " kg/m3, T=" + String(T)
                  + " K, raw p=" + String(P) + " Pa, safe p=" + String(pSafe)
                  + " Pa, region=" + String(region),
                  AssertionLevel.warning
                );
                lambda := ThermalConductivity_rhoT(rhoSafe, T, pSafe, region);
                annotation(Inline = false);
              end checkedThermalConductivity_rhoT;

          """
          if "function checkedThermalConductivity_rhoT" in properties:
              raise SystemExit(
                  "checkedThermalConductivity_rhoT already exists before patch"
              )
          package_end = properties.rfind("end IF97_wAJ;")
          if package_end < 0:
              raise SystemExit(
                  "could not insert checkedThermalConductivity_rhoT"
              )
          properties = (
              properties[:package_end]
              + conductivity_helper
              + properties[package_end:]
          )
          properties_path.write_text(properties)

          Path(
              "outputs/tsp42/consistent-start/instrumented-fluid-ph-callers.txt"
          ).write_text(
              "none: global Fluid.Ph instrumentation deliberately removed\n"
          )

          pipe_path = Path(
              "vendor/ThermoSysPro/ThermoSysPro/"
              "WaterSteam/HeatExchangers/DynamicTwoPhaseFlowPipe.mo"
          )
          pipe_source = pipe_path.read_text()
          bounded_saturation_sites = [
              (
                  "ThermoSysPro.Properties.WaterSteam.IF97.Water_sat_P(P[i + 1])",
                  "ThermoSysPro.Properties.WaterSteam.IF97.checkedWater_sat_P("
                  "getInstanceName() + \".sat1[\" + String(i) + \"]\", "
                  "P[i + 1])",
              ),
              (
                  "ThermoSysPro.Properties.WaterSteam.IF97.Water_sat_P((P[i] + P[i + 1])/2)",
                  "ThermoSysPro.Properties.WaterSteam.IF97.checkedWater_sat_P("
                  "getInstanceName() + \".sat2[\" + String(i) + \"]\", "
                  "(P[i] + P[i + 1])/2)",
              ),
          ]
          for raw_call, bounded_call in bounded_saturation_sites:
              if pipe_source.count(raw_call) != 1:
                  raise SystemExit(
                      f"expected one saturation pressure call: {raw_call}"
                  )
              pipe_source = pipe_source.replace(raw_call, bounded_call, 1)
          # Caller-aware property wrappers now emit non-fatal raw/safe pressure
          # traces.  The earlier standalone assertions were solver-fatal and
          # could be evaluated after the property call by equation sorting.
          diagnostic_sites = []
          conductivity_sites = [
              (
                  "    kl[i] = ThermoSysPro.Properties.WaterSteam.IF97.ThermalConductivity_rhoT(rhol1[i], T1[i], P[i + 1]);",
                  """    kl[i] = ThermoSysPro.Properties.WaterSteam.IF97.checkedThermalConductivity_rhoT(
          getInstanceName() + ".kl[" + String(i) + "]",
          rhol1[i], T1[i], P[i + 1]);""",
              ),
              (
                  "    kv[i] = ThermoSysPro.Properties.WaterSteam.IF97.ThermalConductivity_rhoT(rhov1[i], T1[i], P[i + 1]);",
                  """    kv[i] = ThermoSysPro.Properties.WaterSteam.IF97.checkedThermalConductivity_rhoT(
          getInstanceName() + ".kv[" + String(i) + "]",
          rhov1[i], T1[i], P[i + 1]);""",
              ),
          ]
          for original, diagnostic in conductivity_sites:
              if pipe_source.count(original) != 1:
                  raise SystemExit(
                      f"expected one thermal-conductivity diagnostic site: {original}"
                  )
              pipe_source = pipe_source.replace(original, diagnostic, 1)
          Path(
              "outputs/tsp42/consistent-start/"
              "DynamicTwoPhaseFlowPipe-diagnostic-sites.txt"
          ).write_text(
              "\n".join(original for original, _ in diagnostic_sites) + "\n"
          )
          pipe_call_sites = [
              (
                  "ThermoSysPro.Properties.WaterSteam.IF97.Water_Ph("
                  "P[i + 1], h[i + 1])",
                  "ThermoSysPro.Properties.WaterSteam.IF97.checkedWater_Ph("
                  "getInstanceName() + \".pro1[\" + String(i) + \"]\", "
                  "P[i + 1], h[i + 1])",
              ),
              (
                  "ThermoSysPro.Properties.WaterSteam.IF97.Water_Ph("
                  "(P[i] + P[i + 1])/2, hb[i])",
                  "ThermoSysPro.Properties.WaterSteam.IF97.checkedWater_Ph("
                  "getInstanceName() + \".pro2[\" + String(i) + \"]\", "
                  "(P[i] + P[i + 1])/2, hb[i])",
              ),
              (
                  "ThermoSysPro.Properties.WaterSteam.IF97.Water_Ph("
                  "P[1], h[1])",
                  "ThermoSysPro.Properties.WaterSteam.IF97.checkedWater_Ph("
                  "getInstanceName() + \".proc[1]\", P[1], h[1])",
              ),
              (
                  "ThermoSysPro.Properties.WaterSteam.IF97.Water_Ph("
                  "P[N + 1], h[N + 1])",
                  "ThermoSysPro.Properties.WaterSteam.IF97.checkedWater_Ph("
                  "getInstanceName() + \".proc[2]\", P[N + 1], h[N + 1])",
              ),
          ]
          for original_call, traced_call in pipe_call_sites:
              if pipe_source.count(original_call) != 1:
                  raise SystemExit(
                      f"expected one pipe property call: {original_call}"
                  )
              pipe_source = pipe_source.replace(
                  original_call, traced_call, 1
              )
          pipe_path.write_text(pipe_source)

          pressure_loss_path = Path(
              "vendor/ThermoSysPro/ThermoSysPro/"
              "WaterSteam/PressureLosses/PipePressureLoss.mo"
          )
          pressure_loss_source = pressure_loss_path.read_text()
          raw_pressure_loss_property = (
              "  pro = ThermoSysPro.Properties.Fluid.Ph("
              "Pm, h, mode, fluid);"
          )
          traced_pressure_loss_property = """  pro = if fluid == 1 then
            ThermoSysPro.Properties.WaterSteam.IF97.checkedWater_Ph(
              getInstanceName() + ".pro", Pm, h, mode)
          else ThermoSysPro.Properties.Fluid.Ph(Pm, h, mode, fluid);"""
          if pressure_loss_source.count(raw_pressure_loss_property) != 1:
              raise SystemExit(
                  "expected one PipePressureLoss Fluid.Ph property call"
              )
          pressure_loss_source = pressure_loss_source.replace(
              raw_pressure_loss_property,
              traced_pressure_loss_property,
              1,
          )
          pressure_loss_path.write_text(pressure_loss_source)
          Path(
              "outputs/tsp42/consistent-start/"
              "PipePressureLoss-traced.mo"
          ).write_text(pressure_loss_source)

          control_valve_path = Path(
              "vendor/ThermoSysPro/ThermoSysPro/"
              "WaterSteam/PressureLosses/ControlValve.mo"
          )
          control_valve_source = control_valve_path.read_text()
          raw_valve_property = (
              "  pro = ThermoSysPro.Properties.Fluid.Ph("
              "Pm, h, mode, fluid);"
          )
          traced_valve_property = """  pro = if fluid == 1 then
            ThermoSysPro.Properties.WaterSteam.IF97.tracedWater_Ph(
              getInstanceName() + ".pro", Pm, h, mode)
          else ThermoSysPro.Properties.Fluid.Ph(Pm, h, mode, fluid);"""
          if control_valve_source.count(raw_valve_property) != 1:
              raise SystemExit(
                  "expected one ControlValve Fluid.Ph property call"
              )
          control_valve_source = control_valve_source.replace(
              raw_valve_property, traced_valve_property, 1
          )
          control_valve_path.write_text(control_valve_source)
          Path(
              "outputs/tsp42/consistent-start/ControlValve-traced.mo"
          ).write_text(control_valve_source)

          turbine_path = Path(
              "vendor/ThermoSysPro/ThermoSysPro/"
              "WaterSteam/Machines/StodolaTurbine.mo"
          )
          turbine_source = turbine_path.read_text()
          raw_turbine_inlet = (
              "  proe = ThermoSysPro.Properties.Fluid.Ph("
              "Pe, Ce.h, mode_e, fluid);"
          )
          traced_turbine_inlet = """  proe = if fluid == 1 then
            ThermoSysPro.Properties.WaterSteam.IF97.tracedWater_Ph(
              getInstanceName() + ".proe", Pe, Ce.h, mode_e)
          else ThermoSysPro.Properties.Fluid.Ph(
            Pe, Ce.h, mode_e, fluid);"""
          if turbine_source.count(raw_turbine_inlet) != 1:
              raise SystemExit(
                  "expected one StodolaTurbine inlet Fluid.Ph call"
              )
          turbine_source = turbine_source.replace(
              raw_turbine_inlet, traced_turbine_inlet, 1
          )
          turbine_path.write_text(turbine_source)
          Path(
              "outputs/tsp42/consistent-start/StodolaTurbine-traced.mo"
          ).write_text(turbine_source)

          bounded_evidence = (
              "DynamicTwoPhaseFlowPipe passes raw P to non-inline wrappers; "
              "each wrapper clamps pressure in an algorithm-local pSafe so "
              "equation tearing/CSE cannot expose the bounded value.\n"
              "PipePressureLoss now routes water/steam Pm through the same "
              "caller-labelled wrapper to isolate zero-pressure Newton trials.\n"
              "No model start values or physical parameters changed.\n"
          )
          Path(
              "outputs/tsp42/consistent-start/bounded-property-pressure.txt"
          ).write_text(bounded_evidence)
          print(bounded_evidence, end="")
          print(
              f"instrumented {len(pipe_call_sites)} "
              "DynamicTwoPhaseFlowPipe calls with node labels"
          )

          Path(
              "outputs/tsp42/consistent-start/"
              "instrumented-direct-water-ph-callers.txt"
          ).write_text(
              "none: global direct Water_Ph instrumentation deliberately removed\n"
          )
          PY
          cp             vendor/ThermoSysPro/ThermoSysPro/Examples/CombinedCyclePowerPlant/CombinedCycle_TripTAC.mo             outputs/tsp42/consistent-start/CombinedCycle_TripTAC-consistent-start.mo
          cp vendor/ThermoSysPro/ThermoSysPro/Properties/WaterSteam/IF97_packages.mo outputs/tsp42/consistent-start/IF97_packages-traced.mo
          cp vendor/ThermoSysPro/ThermoSysPro/WaterSteam/HeatExchangers/DynamicTwoPhaseFlowPipe.mo outputs/tsp42/consistent-start/DynamicTwoPhaseFlowPipe-traced.mo
          git diff --no-index             outputs/tsp42/CombinedCycle_TripTAC-4.2-patched.mo             outputs/tsp42/consistent-start/CombinedCycle_TripTAC-consistent-start.mo             > outputs/tsp42/consistent-start/start-value.patch || test "$?" -eq 1

      - name: Verify consistent start through OpenModelica initialization
        run: |
          set -euo pipefail
          cat > build/tsp42-consistent-start.mos <<MOS
          setCommandLineOptions("--std=3.4");
          setCommandLineOptions("-d=initialization,aliasConflicts,-NLSanalyticJacobian");
          setMatchingAlgorithm("PFPlusExt");
          setIndexReductionMethod("dynamicStateSelection");
          if not installPackage(Modelica, "4.0.0", exactMatch=true) then
            print(getErrorString());
            exit(1);
          end if;
          if not loadModel(Modelica, {"4.0.0"}) then
            print(getErrorString());
            exit(1);
          end if;
          if not loadFile("$PWD/vendor/ThermoSysPro/ThermoSysPro/package.mo") then
            print(getErrorString());
            exit(1);
          end if;
          if not loadFile("$PWD/build/TripLens_CombinedCycle_TripTAC.mo") then
            print(getErrorString());
            exit(1);
          end if;
          cd("$PWD/build");
          simulate(
            TripLens_CombinedCycle_TripTAC,
            startTime=0,
            stopTime=0.04,
            numberOfIntervals=10,
            tolerance=1e-3,
            method="dassl",
            outputFormat="csv",
            simflags="-nls=kinsol -nlsLS=lapack -lv=LOG_RES_INIT",
            fileNamePrefix="tsp42_triplens_consistent_start");
          getErrorString();
          MOS
          set +e
          timeout --signal=TERM --kill-after=30s 25m \
            omc "$PWD/build/tsp42-consistent-start.mos" \
            | tee outputs/tsp42/consistent-start/initialization.log
          omc_status="${PIPESTATUS[0]}"
          set -e
          mkdir -p outputs/tsp42/consistent-start/generated
          for suffix in _info.json _init.xml _02nls.c _06inz.c _functions.c; do
            source_file="build/tsp42_triplens_consistent_start${suffix}"
            if test -f "$source_file"; then
              cp "$source_file" outputs/tsp42/consistent-start/generated/
            fi
          done
          test "$omc_status" -eq 0
          if grep -Eq 'Failed to build model|Simulation execution failed|resultFile = ""|Error:' \
              outputs/tsp42/consistent-start/initialization.log; then
            exit 1
          fi
          test -s build/tsp42_triplens_consistent_start_res.csv
          test "$(wc -l < build/tsp42_triplens_consistent_start_res.csv)" -gt 1
          cp build/tsp42_triplens_consistent_start_res.csv \
            outputs/tsp42/consistent-start/
          printf 'THERMOSYSPRO_42_CONSISTENT_START_INITIALIZATION_PASS\n' \
            | tee outputs/tsp42/consistent-start/initialization-result.txt

      - name: Simulate the corrected TripLens physical model for 10 seconds
        run: |
          set -euo pipefail
          executable="$PWD/build/tsp42_triplens_consistent_start"
          result_file="$PWD/build/tsp42_triplens_trip_res.csv"
          log_file="$PWD/outputs/tsp42/triplens-physical-trip.log"
          test -x "$executable"
          pushd "$PWD/build" >/dev/null
          set +e
          timeout --signal=TERM --kill-after=30s 90m \
              "$executable" \
                -startTime=0 \
                -stopTime=10 \
                -stepSize=0.01 \
                -tolerance=0.001 \
                '-variableFilter=.*\.(P(\[[0-9]+\])?|Pm|p)' \
                -r="$result_file" \
                -outputFormat=csv \
                -nls=kinsol \
                -nlsLS=lapack \
                -lv=LOG_RES_INIT \
                -lvMaxWarn=10000 \
              2>&1 \
            | python3 "$GITHUB_WORKSPACE/scripts/capture_log_window.py" \
                "$log_file" \
                --head-lines 300 \
                --tail-lines 60000
          pipeline_status=("${PIPESTATUS[@]}")
          set -e
          popd >/dev/null
          simulator_status="${pipeline_status[0]}"
          capture_status="${pipeline_status[1]}"
          printf 'simulator_status=%s\ncapture_status=%s\n' \
            "$simulator_status" "$capture_status" \
            | tee outputs/tsp42/simulation-exit-status.txt
          echo '--- final simulator log tail ---'
          tail -n 400 "$log_file"
          test "$capture_status" -eq 0
          if grep -Eq 'Simulation execution failed|division by zero|Error:' \
              outputs/tsp42/triplens-physical-trip.log; then
            exit 1
          fi
          test -s build/tsp42_triplens_trip_res.csv
          test "$(wc -l < build/tsp42_triplens_trip_res.csv)" -gt 1
          python3 - <<'PY'
          import csv
          import math
          from pathlib import Path
          import re

          result_path = Path("build/tsp42_triplens_trip_res.csv")
          pressure_name = re.compile(r"\.(?:P(?:\[[0-9]+\])?|Pm|p)$")
          required = {"perteChargeK.Pm", "PompeAlimBP.C1.P"}
          with result_path.open(newline="") as result_file:
              rows = csv.reader(result_file)
              header = next(rows)
              width = len(header)
              pressure_columns = [
                  index
                  for index, name in enumerate(header)
                  if pressure_name.search(name)
              ]
              missing = required.difference(header)
              if missing:
                  raise SystemExit(
                      f"missing required pressure variables: {sorted(missing)}"
                  )
              row_count = 0
              last_time = None
              min_pressure = (math.inf, "")
              for row in rows:
                  if len(row) != width:
                      raise SystemExit(
                          f"incomplete CSV row {row_count + 2}: "
                          f"{len(row)} of {width} fields"
                      )
                  row_count += 1
                  last_time = float(row[0])
                  for index in pressure_columns:
                      pressure = float(row[index])
                      if not math.isfinite(pressure):
                          raise SystemExit(
                              f"non-finite pressure {header[index]} "
                              f"at t={last_time}"
                          )
                      if pressure < min_pressure[0]:
                          min_pressure = (pressure, header[index])
              if row_count == 0:
                  raise SystemExit("result CSV has no data rows")
              print(
                  f"partial verification: {row_count} rows through "
                  f"{last_time} s; {len(pressure_columns)} pressure "
                  f"variables; minimum {min_pressure[0]} Pa in "
                  f"{min_pressure[1]}"
              )
              if not math.isclose(
                  last_time, 10.0, rel_tol=0.0, abs_tol=1e-9
              ):
                  raise SystemExit(
                      f"expected 10-second result, CSV ends at {last_time}"
                  )
              if min_pressure[0] < 0.0:
                  raise SystemExit(
                      f"negative pressure {min_pressure[0]} Pa in "
                      f"{min_pressure[1]}"
                  )
              print(
                  f"verified {row_count} rows through {last_time} s; "
                  f"{len(pressure_columns)} pressure variables; "
                  f"minimum {min_pressure[0]} Pa in {min_pressure[1]}"
              )
          PY
          cp build/tsp42_triplens_trip_res.csv outputs/tsp42/
          printf 'THERMOSYSPRO_42_TRIPLENS_PHYSICAL_SIMULATION_PASS\n' \
            | tee outputs/tsp42/result.txt
          test "$simulator_status" -eq 0

      - name: Upload ThermoSysPro 4.2 simulation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: thermosyspro-42-physical-simulation
          path: |
            outputs/tsp42/**
            build/tsp42_reference_res.csv
            build/tsp42_triplens_trip_res.csv
          if-no-files-found: warn
          retention-days: 14
