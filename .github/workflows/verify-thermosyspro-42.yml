name: Verify ThermoSysPro 4.2 physical simulation

on:
  push:
    branches:
      - experiment/thermosyspro-4.2
      - debug/trace-negative-pressure-20261011
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/verify-thermosyspro-42.yml"
      - "modelica/**"
      - "scripts/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  physical-simulation:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      THERMOSYSPRO_SHA: a896ab75ce22162369e7fa4ce79927eeca44ad4a
    steps:
      - uses: actions/checkout@v4

      - name: Install OpenModelica 1.27.1 official release
        run: |
          set -euo pipefail
          mkdir -p outputs/tsp42
          sudo apt-get update
          sudo apt-get install -y ca-certificates curl gnupg
          curl -fsSL https://build.openmodelica.org/apt/openmodelica.asc \
            | sudo gpg --dearmor -o /usr/share/keyrings/openmodelica-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/openmodelica-keyring.gpg] https://build.openmodelica.org/apt noble stable" \
            | sudo tee /etc/apt/sources.list.d/openmodelica.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends omc
          omc --version | tee outputs/tsp42/openmodelica-version.txt
          grep -q '1.27.1' outputs/tsp42/openmodelica-version.txt

      - name: Download and verify official ThermoSysPro 4.2
        run: |
          set -euo pipefail
          mkdir -p vendor build outputs/tsp42 "$RUNNER_TEMP/tsp42"
          archive_url="https://gitlab.pam-retd.fr/thermosysproandco/ThermoSysPro/-/archive/$THERMOSYSPRO_SHA/ThermoSysPro-$THERMOSYSPRO_SHA.zip"
          curl --fail --location --retry 3 --retry-delay 2 "$archive_url" \
            --output "$RUNNER_TEMP/tsp42/ThermoSysPro.zip"
          unzip -q "$RUNNER_TEMP/tsp42/ThermoSysPro.zip" -d "$RUNNER_TEMP/tsp42/unpacked"
          package_file="$(find "$RUNNER_TEMP/tsp42" -type f \
            -path '*/ThermoSysPro/package.mo' -print -quit)"
          test -n "$package_file"
          archive_root="$(dirname "$(dirname "$package_file")")"
          mv "$archive_root" vendor/ThermoSysPro
          package_file=vendor/ThermoSysPro/ThermoSysPro/package.mo
          grep -Eq 'ThermoSysPro Version 4\.2|version[[:space:]]*=[[:space:]]*"(4\.2|4\.2\.0)' \
            "$package_file"
          archive_sha256="$(sha256sum "$RUNNER_TEMP/tsp42/ThermoSysPro.zip" | cut -d' ' -f1)"
          printf 'revision=%s\narchive_sha256=%s\n' \
            "$THERMOSYSPRO_SHA" "$archive_sha256" \
            | tee outputs/tsp42/source-identity.txt
          grep -nE 'Version 4\.2|version[[:space:]]*=' "$package_file" | head -n 5

      - name: Capture ThermoSysPro 4.2 pressure-property source
        run: |
          set -euo pipefail
          mkdir -p outputs/tsp42/reference-source
          cp vendor/ThermoSysPro/ThermoSysPro/Properties/WaterSteam/IF97_packages.mo \
            outputs/tsp42/reference-source/IF97_packages.mo
          cp vendor/ThermoSysPro/ThermoSysPro/Properties/WaterSteam/BaseIF97.mo \
            outputs/tsp42/reference-source/BaseIF97.mo
          cp vendor/ThermoSysPro/ThermoSysPro/WaterSteam/HeatExchangers/SimpleDynamicCondenser.mo \
            outputs/tsp42/reference-source/SimpleDynamicCondenser.mo
          cp vendor/ThermoSysPro/ThermoSysPro/WaterSteam/PressureLosses/PipePressureLoss.mo \
            outputs/tsp42/reference-source/PipePressureLoss.mo
          cp vendor/ThermoSysPro/ThermoSysPro/WaterSteam/Machines/StaticCentrifugalPump.mo \
            outputs/tsp42/reference-source/StaticCentrifugalPump.mo

      - name: Diagnostic upstream combined-cycle reference on ThermoSysPro 4.2
        continue-on-error: true
        run: |
          set -euo pipefail
          cat > build/tsp42-reference.mos <<MOS
          setCommandLineOptions("--std=3.4");
          setCommandLineOptions("-d=initialization,aliasConflicts");
          setMatchingAlgorithm("PFPlusExt");
          setIndexReductionMethod("dynamicStateSelection");
          if not installPackage(Modelica, "4.0.0", exactMatch=true) then
            print(getErrorString());
            exit(1);
          end if;
          if not loadModel(Modelica, {"4.0.0"}) then
            print(getErrorString());
            exit(1);
          end if;
          if not loadFile("$PWD/vendor/ThermoSysPro/ThermoSysPro/package.mo") then
            print(getErrorString());
            exit(1);
          end if;
          getVersion(Modelica);
          getVersion(ThermoSysPro);
          cd("$PWD/build");
          simulate(
            ThermoSysPro.Examples.CombinedCyclePowerPlant.CombinedCycle_TripTAC,
            startTime=0,
            stopTime=0.04,
            numberOfIntervals=10,
            tolerance=1e-3,
            method="dassl",
            outputFormat="csv",
            simflags="-lv=LOG_NLS,LOG_NLS_V,LOG_RES_INIT,LOG_NLS_NEWTON_DIAGNOSTICS",
            fileNamePrefix="tsp42_reference");
          getErrorString();
          MOS
          timeout --signal=TERM --kill-after=30s 18m \
            omc "$PWD/build/tsp42-reference.mos" \
            | tee outputs/tsp42/upstream-reference.log
          if grep -Eq 'Failed to build model|Simulation execution failed|resultFile = ""|Error:' \
              outputs/tsp42/upstream-reference.log; then
            exit 1
          fi
          test -s build/tsp42_reference_res.csv

      - name: Trace upstream reference pressure call sites
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          import shutil
          
          trace_root = Path("build/tsp42-reference-traced/ThermoSysPro")
          shutil.copytree(Path("vendor/ThermoSysPro/ThermoSysPro"), trace_root)
          for inspect_path in (
              trace_root / "Properties/WaterSteam/IF97.mo",
              trace_root / "Properties/WaterSteam/IF97_packages.mo",
          ):
              if inspect_path.is_file():
                  print("TRACE IF97 SOURCE:", inspect_path.relative_to(trace_root))
                  source_lines = inspect_path.read_text().splitlines()
                  for line_number, line in enumerate(source_lines, start=1):
                      if re.search(r"\b(package|function)[ \t]+(IF97|IF97_wAJ|Fluid|Ph|Water_Ph)\b|^[ \t]*end[ \t]+(IF97|IF97_wAJ|Fluid|Ph|Water_Ph)\b", line):
                          print(f"{line_number}: {line.strip()}")
          root_package = trace_root / "package.mo"
          root_source = root_package.read_text()
          root_match = re.search(r"(?m)^(?:encapsulated[ \t]+)?package[ \t]+ThermoSysPro\b", root_source)
          if root_match is None:
              raise SystemExit(f"could not find ThermoSysPro root package in {root_package}")
          if "package TSPFluidTrace =" in root_source:
              raise SystemExit("TSPFluidTrace already exists in the source clone")
          root_line_end = root_source.find("\n", root_match.end())
          if root_line_end < 0:
              raise SystemExit("could not find ThermoSysPro package declaration line ending")
          root_source = (
              root_source[:root_line_end + 1]
              + "  package TSPFluidTrace = Properties.Fluid;\n"
              + root_source[root_line_end + 1:]
          )
          root_package.write_text(root_source)
          print("TRACE IF97 DIRECTORY:", sorted(p.name for p in (trace_root / "Properties/WaterSteam").iterdir()))
          reported = 0
          for inspect_path in sorted(trace_root.rglob("*.mo")):
              try:
                  source_lines = inspect_path.read_text().splitlines()
              except UnicodeDecodeError:
                  continue
              hits = []
              for line_number, line in enumerate(source_lines, start=1):
                  if re.search(r"\b(package|function|model|class)[ \t]+(IF97|IF97_wAJ|Fluid|Ph|Water_Ph)\b|^[ \t]*end[ \t]+(IF97|IF97_wAJ|Fluid|Ph|Water_Ph)\b", line) or (("IF97" in line) and re.search(r"\b(import|package)\b|=", line)):
                      hits.append((line_number, line.strip()))
              if hits and ("IF97" in inspect_path.name or any("IF97_wAJ" in line or "package Fluid" in line or "package IF97" in line for _,line in hits)):
                  print("TRACE IF97 DECLARATIONS:", inspect_path.relative_to(trace_root))
                  for line_number, line in hits[:20]:
                      print(f"{line_number}: {line}")
                  reported += 1
                  if reported >= 30:
                      break
          candidate_model = trace_root / "WaterSteam/Volumes/DynamicDrum.mo"
          if candidate_model.is_file():
              for line_number, line in enumerate(candidate_model.read_text().splitlines(), start=1):
                  if re.search(r"\b(import|Fluid\.Ph|Water_Ph|IF97)\b", line):
                      print(f"TRACE DYNAMICDRUM {line_number}: {line.strip()}")
          properties = trace_root / "Properties/WaterSteam/IF97_packages.mo"
          property_source = properties.read_text()
          needle = """    algorithm
                supercritical := (p > ThermoSysPro.Properties.WaterSteam.BaseIF97.data.PCRIT);"""
          traced = """    algorithm
                assert(p > 611.657,
                  "TRACE Water_Ph: p = " + String(p) + " Pa, h = " + String(h) +
                  " J/kg, mode = " + String(mode));
                supercritical := (p > ThermoSysPro.Properties.WaterSteam.BaseIF97.data.PCRIT);"""
          function_start = property_source.find("    function Water_Ph\n")
          function_end = property_source.find("    end Water_Ph;", function_start)
          if function_start < 0 or function_end < 0:
              raise SystemExit("could not isolate Water_Ph function")
          water_function = property_source[function_start:function_end]
          checked_water_function = water_function
          if water_function.count(needle) != 1:
              raise SystemExit(f"expected one target in Water_Ph, got {water_function.count(needle)}")
          water_function = water_function.replace(needle, traced, 1)
          
          function_match = re.search(r"(?m)^([ \t]*)function Water_Ph[ \t]*$", checked_water_function)
          if function_match is None:
              raise SystemExit("could not isolate Water_Ph declaration for checked wrapper")
          function_indent = function_match.group(1)
          header_end = checked_water_function.find("\n", function_match.end())
          if header_end < 0:
              raise SystemExit("could not find Water_Ph declaration line ending")
          checked_water_function = (
              checked_water_function[:header_end + 1]
              + function_indent + "  input String caller;\n"
              + checked_water_function[header_end + 1:]
          )
          checked_water_function = checked_water_function.replace(
              "function Water_Ph", "function checkedWater_Ph", 1)
          algorithm_match = re.search(r"(?m)^([ \t]*)algorithm[ \t]*$", checked_water_function)
          if algorithm_match is None:
              raise SystemExit("could not find Water_Ph algorithm section")
          algorithm_line_end = checked_water_function.find("\n", algorithm_match.end())
          if algorithm_line_end < 0:
              raise SystemExit("could not find Water_Ph algorithm line ending")
          assert_indent = algorithm_match.group(1) + "  "
          trace_assert = (
              f'{assert_indent}assert(p > 611.657,\n'
              f'{assert_indent}  "TRACE " + caller + ": p=" + String(p) + " Pa, h=" + String(h) +\n'
              f'{assert_indent}  " J/kg, mode=" + String(mode));\n'
          )
          checked_water_function = (
              checked_water_function[:algorithm_line_end + 1]
              + trace_assert
              + checked_water_function[algorithm_line_end + 1:]
          )
          checked_water_function += function_indent + "end checkedWater_Ph;\n"
          
          property_source = (
              property_source[:function_start]
              + water_function
              + property_source[function_end:]
          )
          package_end = property_source.rfind("end IF97_wAJ;")
          if package_end < 0:
              raise SystemExit("could not find end of IF97_wAJ package")
          if "function checkedWater_Ph" in property_source:
              raise SystemExit("checkedWater_Ph already exists in IF97_wAJ")
          property_source = (
              property_source[:package_end]
              + "\n"
              + checked_water_function
              + "\n"
              + property_source[package_end:]
          )
          properties.write_text(property_source)
          fluid_package = trace_root / "Properties/Fluid.mo"
          if not fluid_package.is_file():
              fluid_package = trace_root / "Properties/Fluid/package.mo"
          fluid_source = fluid_package.read_text()
          fluid_end = fluid_source.rfind("end Fluid;")
          if fluid_end < 0:
              raise SystemExit(f"could not find end of Fluid package in {fluid_package}")
          helper_source = """  function checkedPh
            input ThermoSysPro.Units.SI.AbsolutePressure p;
            input ThermoSysPro.Units.SI.SpecificEnthalpy h;
            input Integer mode;
            input Integer fluid;
            input String caller;
            output ThermoSysPro.Properties.WaterSteam.Common.ThermoProperties_ph props;
          algorithm
            assert(p > 611.657,
              "TRACE " + caller + ": p=" + String(p) + " Pa, h=" + String(h) +
              " J/kg, mode=" + String(mode));
            props := Ph(p, h, mode, fluid);
          end checkedPh;
          """
          if "function checkedPh" in fluid_source:
              raise SystemExit("checkedPh already exists in the source clone")
          fluid_source = fluid_source[:fluid_end] + helper_source + fluid_source[fluid_end:]
          fluid_package.write_text(fluid_source)
          
          def split_arguments(argument_text):
              arguments = []
              depth = 0
              start = 0
              for index, character in enumerate(argument_text):
                  if character == "(":
                      depth += 1
                  elif character == ")":
                      depth -= 1
                  elif character == "," and depth == 0:
                      arguments.append(argument_text[start:index].strip())
                      start = index + 1
              arguments.append(argument_text[start:].strip())
              return arguments
          
          def find_call_end(source_text, opening):
              depth = 1
              for index in range(opening + 1, len(source_text)):
                  if source_text[index] == "(":
                      depth += 1
                  elif source_text[index] == ")":
                      depth -= 1
                      if depth == 0:
                          return index
              return None
          
          diagnostic_callers = []
          for candidate in sorted(trace_root.rglob("*.mo")):
              relative = candidate.relative_to(trace_root).as_posix()
              if relative.startswith("Properties/") or relative.startswith("Examples/"):
                  continue
              candidate_source = candidate.read_text()
              if "Fluid.Ph(" not in candidate_source and "Water_Ph(" not in candidate_source:
                  continue
              model_match = re.search(r"(?m)^(?:partial[ \t]+)?model[ \t]+[A-Za-z_][A-Za-z_0-9]*", candidate_source)
              if model_match is None:
                  continue
              equation_match = re.search(r"(?m)^[ \t]*equation[ \t]*$", candidate_source[model_match.end():])
              if equation_match is None:
                  continue
              scan_start = model_match.end() + equation_match.end()
              if candidate_source[scan_start:scan_start + 1] == "\n":
                  scan_start += 1
              annotation_start = candidate_source.find("annotation(", scan_start)
              scan_end = annotation_start if annotation_start >= 0 else len(candidate_source)
          
              call_sites = []
              for token in ("Fluid.Ph(", "Water_Ph("):
                  cursor = scan_start
                  while cursor < scan_end:
                      call_start = candidate_source.find(token, cursor, scan_end)
                      if call_start < 0:
                          break
                      opening = call_start + len(token) - 1
                      closing = find_call_end(candidate_source, opening)
                      if closing is None or closing >= scan_end:
                          break
                      arguments = split_arguments(candidate_source[opening + 1:closing])
                      qualified_if97 = False
                      replace_start = call_start
                      if token == "Fluid.Ph(" and len(arguments) == 4:
                          pressure, enthalpy, mode_arg, fluid_arg = arguments
                          fluid_prefix = "ThermoSysPro.Properties."
                          if call_start >= len(fluid_prefix) and (
                              candidate_source[call_start - len(fluid_prefix):call_start] == fluid_prefix
                          ):
                              replace_start -= len(fluid_prefix)
                      elif token == "Water_Ph(" and len(arguments) >= 2:
                          pressure, enthalpy = arguments[:2]
                          mode_arg = arguments[2] if len(arguments) >= 3 else "0"
                          fluid_arg = "1"
                          if call_start >= len("ThermoSysPro.Properties.WaterSteam.IF97.") and (
                              candidate_source[call_start - len("ThermoSysPro.Properties.WaterSteam.IF97."):call_start]
                              == "ThermoSysPro.Properties.WaterSteam.IF97."
                          ):
                              qualified_if97 = True
                              replace_start -= len("ThermoSysPro.Properties.WaterSteam.IF97.")
                      else:
                          cursor = closing + 1
                          continue
                      call_sites.append((
                          replace_start, closing + 1, pressure, enthalpy, mode_arg,
                          fluid_arg, len(arguments), qualified_if97,
                      ))
                      cursor = closing + 1
              if not call_sites:
                  continue
          
              for index, (
                  call_start, call_end, pressure, enthalpy, mode_arg, fluid_arg,
                  argument_count, qualified_if97,
              ) in reversed(list(enumerate(call_sites, start=1))):
                  caller = f"{relative} call {index}"
                  if qualified_if97:
                      checked_arguments = [f'"{caller}"', pressure, enthalpy]
                      if argument_count >= 3:
                          checked_arguments.append(mode_arg)
                      replacement = (
                          ".ThermoSysPro.Properties.WaterSteam.IF97.checkedWater_Ph("
                          + ", ".join(checked_arguments)
                          + ")"
                      )
                  else:
                      replacement = (
                          ".ThermoSysPro.Properties.Fluid.checkedPh("
                          f'{pressure}, {enthalpy}, {mode_arg}, {fluid_arg}, "{caller}")')
                  candidate_source = candidate_source[:call_start] + replacement + candidate_source[call_end:]
              candidate.write_text(candidate_source)
              diagnostic_callers.append(f"{relative}: {len(call_sites)}")
          Path("outputs/tsp42/diagnostic-property-callers.txt").write_text(
              "\n".join(diagnostic_callers) + "\n")
          print("Instrumented pressure property call sites:", diagnostic_callers)
          PY
          cp build/tsp42-reference-traced/ThermoSysPro/Examples/CombinedCyclePowerPlant/CombinedCycle_TripTAC.mo \
            outputs/tsp42/CombinedCycle_TripTAC-4.2-reference-traced-source.mo
          sha256sum outputs/tsp42/CombinedCycle_TripTAC-4.2-reference-traced-source.mo \
            | tee outputs/tsp42/reference-traced-source.sha256
          cat > build/tsp42-reference-pressure-trace.mos <<MOS
          setCommandLineOptions("--std=3.4");
          setCommandLineOptions("-d=initialization,aliasConflicts");
          setMatchingAlgorithm("PFPlusExt");
          setIndexReductionMethod("dynamicStateSelection");
          if not loadModel(Modelica, {"4.0.0"}) then
            print(getErrorString());
            exit(1);
          end if;
          if not loadFile("$PWD/build/tsp42-reference-traced/ThermoSysPro/package.mo") then
            print(getErrorString());
            exit(1);
          end if;
          getVersion(Modelica);
          getVersion(ThermoSysPro);
          cd("$PWD/build");
          simulate(
            ThermoSysPro.Examples.CombinedCyclePowerPlant.CombinedCycle_TripTAC,
            startTime=0,
            stopTime=0.04,
            numberOfIntervals=10,
            tolerance=1e-3,
            method="dassl",
            outputFormat="csv",
            simflags="-lv=LOG_NLS,LOG_NLS_V,LOG_RES_INIT,LOG_NLS_NEWTON_DIAGNOSTICS",
            fileNamePrefix="tsp42_reference_pressure_trace");
          getErrorString();
          MOS
          printf '%s\n' 'TRACE uses baseline starts; failures include caller, p, h, and mode.' \
            | tee outputs/tsp42/reference-pressure-trace.txt
          timeout --signal=TERM --kill-after=30s 18m \
            omc "$PWD/build/tsp42-reference-pressure-trace.mos" \
            | tee outputs/tsp42/upstream-reference-pressure-trace.log
          if grep -Eq 'Failed to build model|Simulation execution failed|resultFile = ""|Error:' \
              outputs/tsp42/upstream-reference-pressure-trace.log; then
            exit 1
          fi
          test -s build/tsp42_reference_pressure_trace_res.csv

      - name: Test the version-independent turbine patch
        run: python3 -m unittest discover -s tests -p "test_turbine_bypass_patch.py"

      - name: Render the existing TripLens physical trip case
        run: |
          set -euo pipefail
          python3 scripts/render_modelica.py \
            --trip-time 2 \
            --trip-ramp-duration 5 \
            --stop-time 10 \
            --intervals 10000
          plant=vendor/ThermoSysPro/ThermoSysPro/Examples/CombinedCyclePowerPlant/CombinedCycle_TripTAC.mo
          test -s "$plant"
          cp "$plant" outputs/tsp42/CombinedCycle_TripTAC-4.2-upstream.mo
          sha256sum outputs/tsp42/CombinedCycle_TripTAC-4.2-upstream.mo \
            | tee outputs/tsp42/CombinedCycle_TripTAC-4.2-upstream.sha256
          turbine=vendor/ThermoSysPro/ThermoSysPro/WaterSteam/Machines/StodolaTurbine.mo
          test -s "$turbine"
          cp "$turbine" outputs/tsp42/StodolaTurbine-4.2-upstream.mo
          sha256sum outputs/tsp42/StodolaTurbine-4.2-upstream.mo \
            | tee outputs/tsp42/StodolaTurbine-4.2-upstream.sha256
          python3 scripts/patch_turbine_bypass_model.py --source "$plant"
          python3 scripts/patch_stodola_turbine.py \
            vendor/ThermoSysPro/ThermoSysPro/WaterSteam/Machines/StodolaTurbine.mo
          cp "$plant" outputs/tsp42/CombinedCycle_TripTAC-4.2-patched.mo
          sha256sum outputs/tsp42/CombinedCycle_TripTAC-4.2-patched.mo \
            | tee outputs/tsp42/CombinedCycle_TripTAC-4.2-patched.sha256
          cp build/TripLens_CombinedCycle_TripTAC.mo \
            outputs/tsp42/TripLens_CombinedCycle_TripTAC-4.2-rendered.mo
          sha256sum outputs/tsp42/TripLens_CombinedCycle_TripTAC-4.2-rendered.mo \
            | tee outputs/tsp42/TripLens_CombinedCycle_TripTAC-4.2-rendered.sha256

      - name: Trace TripLens pressure call sites
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          import shutil
          
          trace_root = Path("build/tsp42-triplens-traced/ThermoSysPro")
          shutil.copytree(Path("vendor/ThermoSysPro/ThermoSysPro"), trace_root)
          root_package = trace_root / "package.mo"
          root_source = root_package.read_text()
          root_match = re.search(r"(?m)^(?:encapsulated[ \t]+)?package[ \t]+ThermoSysPro\b", root_source)
          if root_match is None:
              raise SystemExit(f"could not find ThermoSysPro root package in {root_package}")
          if "package TSPFluidTrace =" in root_source:
              raise SystemExit("TSPFluidTrace already exists in the source clone")
          root_line_end = root_source.find("\n", root_match.end())
          if root_line_end < 0:
              raise SystemExit("could not find ThermoSysPro package declaration line ending")
          root_source = (
              root_source[:root_line_end + 1]
              + "  package TSPFluidTrace = Properties.Fluid;\n"
              + root_source[root_line_end + 1:]
          )
          root_package.write_text(root_source)
          properties = trace_root / "Properties/WaterSteam/IF97_packages.mo"
          property_source = properties.read_text()
          needle = """    algorithm
                supercritical := (p > ThermoSysPro.Properties.WaterSteam.BaseIF97.data.PCRIT);"""
          traced = """    algorithm
                assert(p > 611.657,
                  "TRACE Water_Ph: p = " + String(p) + " Pa, h = " + String(h) +
                  " J/kg, mode = " + String(mode));
                supercritical := (p > ThermoSysPro.Properties.WaterSteam.BaseIF97.data.PCRIT);"""
          function_start = property_source.find("    function Water_Ph\n")
          function_end = property_source.find("    end Water_Ph;", function_start)
          if function_start < 0 or function_end < 0:
              raise SystemExit("could not isolate Water_Ph function")
          water_function = property_source[function_start:function_end]
          checked_water_function = water_function
          if water_function.count(needle) != 1:
              raise SystemExit(f"expected one target in Water_Ph, got {water_function.count(needle)}")
          water_function = water_function.replace(needle, traced, 1)
          
          function_match = re.search(r"(?m)^([ \t]*)function Water_Ph[ \t]*$", checked_water_function)
          if function_match is None:
              raise SystemExit("could not isolate Water_Ph declaration for checked wrapper")
          function_indent = function_match.group(1)
          header_end = checked_water_function.find("\n", function_match.end())
          if header_end < 0:
              raise SystemExit("could not find Water_Ph declaration line ending")
          checked_water_function = (
              checked_water_function[:header_end + 1]
              + function_indent + "  input String caller;\n"
              + checked_water_function[header_end + 1:]
          )
          checked_water_function = checked_water_function.replace(
              "function Water_Ph", "function checkedWater_Ph", 1)
          algorithm_match = re.search(r"(?m)^([ \t]*)algorithm[ \t]*$", checked_water_function)
          if algorithm_match is None:
              raise SystemExit("could not find Water_Ph algorithm section")
          algorithm_line_end = checked_water_function.find("\n", algorithm_match.end())
          if algorithm_line_end < 0:
              raise SystemExit("could not find Water_Ph algorithm line ending")
          assert_indent = algorithm_match.group(1) + "  "
          trace_assert = (
              f'{assert_indent}assert(p > 611.657,\n'
              f'{assert_indent}  "TRACE " + caller + ": p=" + String(p) + " Pa, h=" + String(h) +\n'
              f'{assert_indent}  " J/kg, mode=" + String(mode));\n'
          )
          checked_water_function = (
              checked_water_function[:algorithm_line_end + 1]
              + trace_assert
              + checked_water_function[algorithm_line_end + 1:]
          )
          checked_water_function += function_indent + "end checkedWater_Ph;\n"
          
          property_source = (
              property_source[:function_start]
              + water_function
              + property_source[function_end:]
          )
          package_end = property_source.rfind("end IF97_wAJ;")
          if package_end < 0:
              raise SystemExit("could not find end of IF97_wAJ package")
          if "function checkedWater_Ph" in property_source:
              raise SystemExit("checkedWater_Ph already exists in IF97_wAJ")
          property_source = (
              property_source[:package_end]
              + "\n"
              + checked_water_function
              + "\n"
              + property_source[package_end:]
          )
          properties.write_text(property_source)
          fluid_package = trace_root / "Properties/Fluid.mo"
          if not fluid_package.is_file():
              fluid_package = trace_root / "Properties/Fluid/package.mo"
          fluid_source = fluid_package.read_text()
          fluid_end = fluid_source.rfind("end Fluid;")
          if fluid_end < 0:
              raise SystemExit(f"could not find end of Fluid package in {fluid_package}")
          helper_source = """  function checkedPh
            input ThermoSysPro.Units.SI.AbsolutePressure p;
            input ThermoSysPro.Units.SI.SpecificEnthalpy h;
            input Integer mode;
            input Integer fluid;
            input String caller;
            output ThermoSysPro.Properties.WaterSteam.Common.ThermoProperties_ph props;
          algorithm
            assert(p > 611.657,
              "TRACE " + caller + ": p=" + String(p) + " Pa, h=" + String(h) +
              " J/kg, mode=" + String(mode));
            props := Ph(p, h, mode, fluid);
          end checkedPh;
          """
          if "function checkedPh" in fluid_source:
              raise SystemExit("checkedPh already exists in the source clone")
          fluid_source = fluid_source[:fluid_end] + helper_source + fluid_source[fluid_end:]
          fluid_package.write_text(fluid_source)
          
          def split_arguments(argument_text):
              arguments = []
              depth = 0
              start = 0
              for index, character in enumerate(argument_text):
                  if character == "(":
                      depth += 1
                  elif character == ")":
                      depth -= 1
                  elif character == "," and depth == 0:
                      arguments.append(argument_text[start:index].strip())
                      start = index + 1
              arguments.append(argument_text[start:].strip())
              return arguments
          
          def find_call_end(source_text, opening):
              depth = 1
              for index in range(opening + 1, len(source_text)):
                  if source_text[index] == "(":
                      depth += 1
                  elif source_text[index] == ")":
                      depth -= 1
                      if depth == 0:
                          return index
              return None
          
          diagnostic_callers = []
          for candidate in sorted(trace_root.rglob("*.mo")):
              relative = candidate.relative_to(trace_root).as_posix()
              if relative.startswith("Properties/") or relative.startswith("Examples/"):
                  continue
              candidate_source = candidate.read_text()
              if "Fluid.Ph(" not in candidate_source and "Water_Ph(" not in candidate_source:
                  continue
              model_match = re.search(r"(?m)^(?:partial[ \t]+)?model[ \t]+[A-Za-z_][A-Za-z_0-9]*", candidate_source)
              if model_match is None:
                  continue
              equation_match = re.search(r"(?m)^[ \t]*equation[ \t]*$", candidate_source[model_match.end():])
              if equation_match is None:
                  continue
              scan_start = model_match.end() + equation_match.end()
              if candidate_source[scan_start:scan_start + 1] == "\n":
                  scan_start += 1
              annotation_start = candidate_source.find("annotation(", scan_start)
              scan_end = annotation_start if annotation_start >= 0 else len(candidate_source)
          
              call_sites = []
              for token in ("Fluid.Ph(", "Water_Ph("):
                  cursor = scan_start
                  while cursor < scan_end:
                      call_start = candidate_source.find(token, cursor, scan_end)
                      if call_start < 0:
                          break
                      opening = call_start + len(token) - 1
                      closing = find_call_end(candidate_source, opening)
                      if closing is None or closing >= scan_end:
                          break
                      arguments = split_arguments(candidate_source[opening + 1:closing])
                      qualified_if97 = False
                      replace_start = call_start
                      if token == "Fluid.Ph(" and len(arguments) == 4:
                          pressure, enthalpy, mode_arg, fluid_arg = arguments
                          fluid_prefix = "ThermoSysPro.Properties."
                          if call_start >= len(fluid_prefix) and (
                              candidate_source[call_start - len(fluid_prefix):call_start] == fluid_prefix
                          ):
                              replace_start -= len(fluid_prefix)
                      elif token == "Water_Ph(" and len(arguments) >= 2:
                          pressure, enthalpy = arguments[:2]
                          mode_arg = arguments[2] if len(arguments) >= 3 else "0"
                          fluid_arg = "1"
                          if call_start >= len("ThermoSysPro.Properties.WaterSteam.IF97.") and (
                              candidate_source[call_start - len("ThermoSysPro.Properties.WaterSteam.IF97."):call_start]
                              == "ThermoSysPro.Properties.WaterSteam.IF97."
                          ):
                              qualified_if97 = True
                              replace_start -= len("ThermoSysPro.Properties.WaterSteam.IF97.")
                      else:
                          cursor = closing + 1
                          continue
                      call_sites.append((
                          replace_start, closing + 1, pressure, enthalpy, mode_arg,
                          fluid_arg, len(arguments), qualified_if97,
                      ))
                      cursor = closing + 1
              if not call_sites:
                  continue
          
              for index, (
                  call_start, call_end, pressure, enthalpy, mode_arg, fluid_arg,
                  argument_count, qualified_if97,
              ) in reversed(list(enumerate(call_sites, start=1))):
                  caller = f"{relative} call {index}"
                  if qualified_if97:
                      checked_arguments = [f'"{caller}"', pressure, enthalpy]
                      if argument_count >= 3:
                          checked_arguments.append(mode_arg)
                      replacement = (
                          ".ThermoSysPro.Properties.WaterSteam.IF97.checkedWater_Ph("
                          + ", ".join(checked_arguments)
                          + ")"
                      )
                  else:
                      replacement = (
                          ".ThermoSysPro.Properties.Fluid.checkedPh("
                          f'{pressure}, {enthalpy}, {mode_arg}, {fluid_arg}, "{caller}")')
                  candidate_source = candidate_source[:call_start] + replacement + candidate_source[call_end:]
              candidate.write_text(candidate_source)
              diagnostic_callers.append(f"{relative}: {len(call_sites)}")
          Path("outputs/tsp42/diagnostic-property-callers.txt").write_text(
              "\n".join(diagnostic_callers) + "\n")
          print("Instrumented pressure property call sites:", diagnostic_callers)
          PY
          cp build/tsp42-triplens-traced/ThermoSysPro/Examples/CombinedCyclePowerPlant/CombinedCycle_TripTAC.mo \
            outputs/tsp42/CombinedCycle_TripTAC-4.2-triplens-traced-source.mo
          sha256sum outputs/tsp42/CombinedCycle_TripTAC-4.2-triplens-traced-source.mo \
            | tee outputs/tsp42/triplens-traced-source.sha256
          cat > build/tsp42-triplens-pressure-trace.mos <<MOS
          setCommandLineOptions("--std=3.4");
          setCommandLineOptions("-d=initialization,aliasConflicts");
          setMatchingAlgorithm("PFPlusExt");
          setIndexReductionMethod("dynamicStateSelection");
          if not loadModel(Modelica, {"4.0.0"}) then
            print(getErrorString());
            exit(1);
          end if;
          if not loadFile("$PWD/build/tsp42-triplens-traced/ThermoSysPro/package.mo") then
            print(getErrorString());
            exit(1);
          end if;
          if not loadFile("$PWD/build/TripLens_CombinedCycle_TripTAC.mo") then
            print(getErrorString());
            exit(1);
          end if;
          getVersion(Modelica);
          getVersion(ThermoSysPro);
          cd("$PWD/build");
          simulate(
            TripLens_CombinedCycle_TripTAC,
            startTime=0,
            stopTime=0.04,
            numberOfIntervals=10,
            tolerance=1e-3,
            method="dassl",
            outputFormat="csv",
            simflags="-lv=LOG_NLS,LOG_NLS_V,LOG_RES_INIT,LOG_NLS_NEWTON_DIAGNOSTICS",
            fileNamePrefix="tsp42_triplens_pressure_trace");
          getErrorString();
          MOS
          printf '%s\n' 'TRACE uses baseline starts; failures include caller, p, h, and mode.' \
            | tee outputs/tsp42/triplens-pressure-trace.txt
          timeout --signal=TERM --kill-after=30s 20m \
            omc "$PWD/build/tsp42-triplens-pressure-trace.mos" \
            | tee outputs/tsp42/triplens-pressure-trace.log
          if grep -Eq 'Failed to build model|Simulation execution failed|resultFile = ""|Error:' \
              outputs/tsp42/triplens-pressure-trace.log; then
            exit 1
          fi
          test -s build/tsp42_triplens_pressure_trace_res.csv

      - name: Simulate the TripLens physical model with ThermoSysPro 4.2
        run: |
          set -euo pipefail
          cat > build/tsp42-triplens.mos <<MOS
          setCommandLineOptions("--std=3.4");
          setCommandLineOptions("-d=initialization,aliasConflicts");
          setMatchingAlgorithm("PFPlusExt");
          setIndexReductionMethod("dynamicStateSelection");
          if not loadModel(Modelica, {"4.0.0"}) then
            print(getErrorString());
            exit(1);
          end if;
          if not loadFile("$PWD/vendor/ThermoSysPro/ThermoSysPro/package.mo") then
            print(getErrorString());
            exit(1);
          end if;
          if not loadFile("$PWD/build/TripLens_CombinedCycle_TripTAC.mo") then
            print(getErrorString());
            exit(1);
          end if;
          getVersion(Modelica);
          getVersion(ThermoSysPro);
          cd("$PWD/build");
          simulate(
            TripLens_CombinedCycle_TripTAC,
            startTime=0,
            stopTime=10,
            numberOfIntervals=10000,
            tolerance=1e-3,
            method="dassl",
            outputFormat="csv",
            simflags="-lv=LOG_NLS,LOG_NLS_V,LOG_RES_INIT,LOG_NLS_NEWTON_DIAGNOSTICS",
            fileNamePrefix="tsp42_triplens_trip");
          getErrorString();
          MOS
          timeout --signal=TERM --kill-after=30s 25m \
            omc "$PWD/build/tsp42-triplens.mos" \
            | tee outputs/tsp42/triplens-physical-trip.log
          if grep -Eq 'Failed to build model|Simulation execution failed|resultFile = ""|Error:' \
              outputs/tsp42/triplens-physical-trip.log; then
            exit 1
          fi
          test -s build/tsp42_triplens_trip_res.csv
          printf 'THERMOSYSPRO_42_TRIPLENS_PHYSICAL_SIMULATION_PASS\n' \
            | tee outputs/tsp42/result.txt

      - name: Upload ThermoSysPro 4.2 simulation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: thermosyspro-42-physical-simulation
          path: |
            outputs/tsp42/**
            build/tsp42_reference_res.csv
            build/tsp42_triplens_trip_res.csv
          if-no-files-found: warn
          retention-days: 14
