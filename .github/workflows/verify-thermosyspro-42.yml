name: Verify ThermoSysPro 4.2 physical simulation

on:
  push:
    branches:
      - experiment/thermosyspro-4.2
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/verify-thermosyspro-42.yml"
      - "modelica/**"
      - "scripts/**"
      - "tests/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  physical-simulation:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      THERMOSYSPRO_SHA: a896ab75ce22162369e7fa4ce79927eeca44ad4a
    steps:
      - uses: actions/checkout@v4

      - name: Install OpenModelica 1.27.1 official release
        run: |
          set -euo pipefail
          mkdir -p outputs/tsp42
          sudo apt-get update
          sudo apt-get install -y ca-certificates curl gnupg
          curl -fsSL https://build.openmodelica.org/apt/openmodelica.asc \
            | sudo gpg --dearmor -o /usr/share/keyrings/openmodelica-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/openmodelica-keyring.gpg] https://build.openmodelica.org/apt noble stable" \
            | sudo tee /etc/apt/sources.list.d/openmodelica.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends omc
          omc --version | tee outputs/tsp42/openmodelica-version.txt
          grep -q '1.27.1' outputs/tsp42/openmodelica-version.txt

      - name: Download and verify official ThermoSysPro 4.2
        run: |
          set -euo pipefail
          mkdir -p vendor build outputs/tsp42 "$RUNNER_TEMP/tsp42"
          archive_url="https://gitlab.pam-retd.fr/thermosysproandco/ThermoSysPro/-/archive/$THERMOSYSPRO_SHA/ThermoSysPro-$THERMOSYSPRO_SHA.zip"
          curl --fail --location --retry 3 --retry-delay 2 "$archive_url" \
            --output "$RUNNER_TEMP/tsp42/ThermoSysPro.zip"
          unzip -q "$RUNNER_TEMP/tsp42/ThermoSysPro.zip" -d "$RUNNER_TEMP/tsp42/unpacked"
          package_file="$(find "$RUNNER_TEMP/tsp42" -type f \
            -path '*/ThermoSysPro/package.mo' -print -quit)"
          test -n "$package_file"
          archive_root="$(dirname "$(dirname "$package_file")")"
          mv "$archive_root" vendor/ThermoSysPro
          package_file=vendor/ThermoSysPro/ThermoSysPro/package.mo
          grep -Eq 'ThermoSysPro Version 4\.2|version[[:space:]]*=[[:space:]]*"(4\.2|4\.2\.0)' \
            "$package_file"
          archive_sha256="$(sha256sum "$RUNNER_TEMP/tsp42/ThermoSysPro.zip" | cut -d' ' -f1)"
          printf 'revision=%s\narchive_sha256=%s\n' \
            "$THERMOSYSPRO_SHA" "$archive_sha256" \
            | tee outputs/tsp42/source-identity.txt
          grep -nE 'Version 4\.2|version[[:space:]]*=' "$package_file" | head -n 5

      - name: Capture ThermoSysPro 4.2 pressure-property source
        run: |
          set -euo pipefail
          mkdir -p outputs/tsp42/reference-source/Properties
          cp -a vendor/ThermoSysPro/ThermoSysPro/Properties/Fluid \
            outputs/tsp42/reference-source/Properties/Fluid
          cp vendor/ThermoSysPro/ThermoSysPro/Properties/WaterSteam/IF97_packages.mo \
            outputs/tsp42/reference-source/IF97_packages.mo
          cp vendor/ThermoSysPro/ThermoSysPro/Properties/WaterSteam/BaseIF97.mo \
            outputs/tsp42/reference-source/BaseIF97.mo
          cp vendor/ThermoSysPro/ThermoSysPro/Properties/Fluid/Ph.mo \
            outputs/tsp42/reference-source/Ph.mo
          cp vendor/ThermoSysPro/ThermoSysPro/WaterSteam/HeatExchangers/SimpleDynamicCondenser.mo \
            outputs/tsp42/reference-source/SimpleDynamicCondenser.mo
          cp vendor/ThermoSysPro/ThermoSysPro/WaterSteam/PressureLosses/PipePressureLoss.mo \
            outputs/tsp42/reference-source/PipePressureLoss.mo
          cp vendor/ThermoSysPro/ThermoSysPro/WaterSteam/Machines/StaticCentrifugalPump.mo \
            outputs/tsp42/reference-source/StaticCentrifugalPump.mo

      - name: Diagnostic upstream combined-cycle reference on ThermoSysPro 4.2
        continue-on-error: true
        run: |
          set -euo pipefail
          cat > build/tsp42-reference.mos <<MOS
          setCommandLineOptions("--std=3.4");
          setCommandLineOptions("-d=initialization,aliasConflicts");
          setMatchingAlgorithm("PFPlusExt");
          setIndexReductionMethod("dynamicStateSelection");
          if not installPackage(Modelica, "4.0.0", exactMatch=true) then
            print(getErrorString());
            exit(1);
          end if;
          if not loadModel(Modelica, {"4.0.0"}) then
            print(getErrorString());
            exit(1);
          end if;
          if not loadFile("$PWD/vendor/ThermoSysPro/ThermoSysPro/package.mo") then
            print(getErrorString());
            exit(1);
          end if;
          getVersion(Modelica);
          getVersion(ThermoSysPro);
          cd("$PWD/build");
          simulate(
            ThermoSysPro.Examples.CombinedCyclePowerPlant.CombinedCycle_TripTAC,
            startTime=0,
            stopTime=0.04,
            numberOfIntervals=10,
            tolerance=1e-3,
            method="dassl",
            outputFormat="csv",
            simflags="-lv=LOG_NLS,LOG_NLS_V,LOG_RES_INIT,LOG_NLS_NEWTON_DIAGNOSTICS",
            fileNamePrefix="tsp42_reference");
          getErrorString();
          MOS
          timeout --signal=TERM --kill-after=30s 18m \
            omc "$PWD/build/tsp42-reference.mos" \
            | tee outputs/tsp42/upstream-reference.log
          if grep -Eq 'Failed to build model|Simulation execution failed|resultFile = ""|Error:' \
              outputs/tsp42/upstream-reference.log; then
            exit 1
          fi
          test -s build/tsp42_reference_res.csv

      - name: Probe reference with condenser P0 and pump pressure trace
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          import shutil

          seed_root = Path("build/tsp42-reference-seeded/ThermoSysPro")
          shutil.copytree(Path("vendor/ThermoSysPro/ThermoSysPro"), seed_root)
          properties = seed_root / "Properties/WaterSteam/IF97_packages.mo"
          property_source = properties.read_text()
          needle = """    algorithm
                supercritical := (p > ThermoSysPro.Properties.WaterSteam.BaseIF97.data.PCRIT);"""
          traced = """    algorithm
                assert(p > 611.657,
                  "TRACE Water_Ph: p = " + String(p) + " Pa, h = " + String(h) +
                  " J/kg, mode = " + String(mode));
                supercritical := (p > ThermoSysPro.Properties.WaterSteam.BaseIF97.data.PCRIT);"""
          function_start = property_source.find("    function Water_Ph\n")
          function_end = property_source.find("    end Water_Ph;", function_start)
          if function_start < 0 or function_end < 0:
              raise SystemExit("could not isolate Water_Ph function")
          water_function = property_source[function_start:function_end]
          if water_function.count(needle) != 1:
              raise SystemExit(f"expected one target in Water_Ph, got {water_function.count(needle)}")
          water_function = water_function.replace(needle, traced, 1)
          invalid_region = """assert(false, "Water_Ph: Incorrect region number (" + String(region) + ")");"""
          invalid_region_trace = """assert(false, "TRIPLENS_IF97_INVALID_REGION: region=" +
                    String(region) + " p=" + String(p) + " Pa, h=" + String(h) +
                    " J/kg, mode=" + String(mode) + ", phase=" + String(phase));"""
          if water_function.count(invalid_region) != 1:
              raise SystemExit(
                  f"expected one Water_Ph invalid-region assertion, got {water_function.count(invalid_region)}")
          water_function = water_function.replace(invalid_region, invalid_region_trace, 1)
          properties.write_text(property_source[:function_start] + water_function + property_source[function_end:])
          fluid_package = seed_root / "Properties/Fluid/package.mo"
          if not fluid_package.is_file():
              fluid_package = seed_root / "Properties/Fluid.mo"
          fluid_source = fluid_package.read_text()
          fluid_end = fluid_source.rfind("end Fluid;")
          if fluid_end < 0:
              raise SystemExit(f"could not find end of Fluid package in {fluid_package}")
          helper_source = """  function checkedPh
            input ThermoSysPro.Units.SI.AbsolutePressure p;
            input ThermoSysPro.Units.SI.SpecificEnthalpy h;
            input Integer mode;
            input Integer fluid;
            input String caller;
            output ThermoSysPro.Properties.WaterSteam.Common.ThermoProperties_ph props;
          algorithm
            assert(p > 611.657,
              "TRACE " + caller + ": p=" + String(p) + " Pa, h=" + String(h) +
              " J/kg, mode=" + String(mode));
            props := Ph(p, h, mode, fluid);
          end checkedPh;
          """
          if "function checkedPh" in fluid_source:
              raise SystemExit("checkedPh already exists in the source clone")
          fluid_source = fluid_source[:fluid_end] + helper_source + fluid_source[fluid_end:]
          fluid_package.write_text(fluid_source)

          def split_arguments(argument_text):
              arguments = []
              depth = 0
              start = 0
              for index, character in enumerate(argument_text):
                  if character == "(":
                      depth += 1
                  elif character == ")":
                      depth -= 1
                  elif character == "," and depth == 0:
                      arguments.append(argument_text[start:index].strip())
                      start = index + 1
              arguments.append(argument_text[start:].strip())
              return arguments

          def find_call_end(source_text, opening):
              depth = 1
              for index in range(opening + 1, len(source_text)):
                  if source_text[index] == "(":
                      depth += 1
                  elif source_text[index] == ")":
                      depth -= 1
                      if depth == 0:
                          return index
              return None

          diagnostic_callers = []
          for candidate in sorted(seed_root.rglob("*.mo")):
              relative = candidate.relative_to(seed_root).as_posix()
              if relative.startswith("Properties/") or relative.startswith("Examples/"):
                  continue
              candidate_source = candidate.read_text()
              if "Fluid.Ph(" not in candidate_source and "Water_Ph(" not in candidate_source:
                  continue
              model_match = re.search(r"(?m)^(?:partial[ \t]+)?model[ \t]+[A-Za-z_][A-Za-z_0-9]*", candidate_source)
              if model_match is None:
                  continue
              equation_match = re.search(r"(?m)^[ \t]*equation[ \t]*$", candidate_source[model_match.end():])
              if equation_match is None:
                  continue
              scan_start = model_match.end() + equation_match.end()
              if candidate_source[scan_start:scan_start + 1] == "\n":
                  scan_start += 1
              annotation_start = candidate_source.find("annotation(", scan_start)
              scan_end = annotation_start if annotation_start >= 0 else len(candidate_source)

              call_sites = []
              for token in ("Fluid.Ph(", "Water_Ph("):
                  cursor = scan_start
                  while cursor < scan_end:
                      call_start = candidate_source.find(token, cursor, scan_end)
                      if call_start < 0:
                          break
                      opening = call_start + len(token) - 1
                      closing = find_call_end(candidate_source, opening)
                      if closing is None or closing >= scan_end:
                          break
                      arguments = split_arguments(candidate_source[opening + 1:closing])
                      if token == "Fluid.Ph(" and len(arguments) == 4:
                          pressure, enthalpy, mode_arg, fluid_arg = arguments
                      elif token == "Water_Ph(" and len(arguments) >= 2:
                          pressure, enthalpy = arguments[:2]
                          mode_arg = arguments[2] if len(arguments) >= 3 else "0"
                          fluid_arg = "1"
                      else:
                          cursor = closing + 1
                          continue
                      qualified_start = call_start
                      while qualified_start > scan_start and (
                          candidate_source[qualified_start - 1].isalnum()
                          or candidate_source[qualified_start - 1] in "_."
                      ):
                          qualified_start -= 1
                      call_sites.append((qualified_start, closing + 1, pressure, enthalpy, mode_arg, fluid_arg))
                      cursor = closing + 1
              if not call_sites:
                  continue

              for index, (call_start, call_end, pressure, enthalpy, mode_arg, fluid_arg) in reversed(list(enumerate(call_sites, start=1))):
                  caller = f"{relative} call {index}"
                  replacement = (
                      "ThermoSysPro.Properties.Fluid.checkedPh("
                      f'{pressure}, {enthalpy}, {mode_arg}, {fluid_arg}, "{caller}")')
                  candidate_source = candidate_source[:call_start] + replacement + candidate_source[call_end:]
              candidate.write_text(candidate_source)
              diagnostic_callers.append(f"{relative}: {len(call_sites)}")
          Path("outputs/tsp42/diagnostic-property-callers.txt").write_text(
              "\n".join(diagnostic_callers) + "\n")
          diagnostic_source_dir = Path("outputs/tsp42/diagnostic-source")
          diagnostic_source_dir.mkdir(parents=True, exist_ok=True)
          shutil.copyfile(fluid_package, diagnostic_source_dir / "Fluid-package-diagnostic.mo")
          for relative in (
              "WaterSteam/HeatExchangers/SimpleDynamicCondenser.mo",
              "WaterSteam/HeatExchangers/DynamicTwoPhaseFlowPipe.mo",
              "WaterSteam/PressureLosses/PipePressureLoss.mo",
              "WaterSteam/Machines/StaticCentrifugalPump.mo",
              "WaterSteam/Volumes/VolumeC.mo",
          ):
              source_file = seed_root / relative
              if source_file.is_file():
                  shutil.copyfile(source_file, diagnostic_source_dir / relative.replace("/", "__"))
          model = seed_root / "Examples/CombinedCyclePowerPlant/CombinedCycle_TripTAC.mo"
          source = model.read_text()
          # ThermoSysPro 4.2 imposes P=P0 when steady_state=false.
          # This instance starts P at 6136 Pa; gravity_pressure defaults false, so Pfond=P.
          # Keep P free and align P0, Pfond, and the nearby pressure-loss start at 6136 Pa.
          replacements = (
              ("steady_state = false, yNiveau(signal(start = 1.5))",
               "steady_state = false, P0 = 6136, gravity_pressure = false, yNiveau(signal(start = 1.5))"),
              ("Pfond(start = 10000.0)", "Pfond(start = 6136)"),
              ("Pm(start = 6200)", "Pm(start = 6136)"),
          )
          for old, new in replacements:
              if source.count(old) != 1:
                  raise SystemExit(f"expected one occurrence of {old!r}, got {source.count(old)}")
              source = source.replace(old, new, 1)
          model.write_text(source)
          PY
          cp build/tsp42-reference-seeded/ThermoSysPro/Examples/CombinedCyclePowerPlant/CombinedCycle_TripTAC.mo \
            outputs/tsp42/CombinedCycle_TripTAC-4.2-reference-pressure-seed.mo
          sha256sum outputs/tsp42/CombinedCycle_TripTAC-4.2-reference-pressure-seed.mo \
            | tee outputs/tsp42/reference-pressure-seed.sha256
          cat > build/tsp42-reference-condenser-seed.mos <<MOS
          setCommandLineOptions("--std=3.4");
          setCommandLineOptions("-d=initialization,aliasConflicts");
          setMatchingAlgorithm("PFPlusExt");
          setIndexReductionMethod("dynamicStateSelection");
          if not loadModel(Modelica, {"4.0.0"}) then
            print(getErrorString());
            exit(1);
          end if;
          if not loadFile("$PWD/build/tsp42-reference-seeded/ThermoSysPro/package.mo") then
            print(getErrorString());
            exit(1);
          end if;
          getVersion(Modelica);
          getVersion(ThermoSysPro);
          cd("$PWD/build");
          simulate(
            ThermoSysPro.Examples.CombinedCyclePowerPlant.CombinedCycle_TripTAC,
            startTime=0,
            stopTime=0.04,
            numberOfIntervals=10,
            tolerance=1e-3,
            method="dassl",
            outputFormat="csv",
            simflags="-lv=LOG_NLS,LOG_NLS_V,LOG_RES_INIT,LOG_NLS_NEWTON_DIAGNOSTICS",
            fileNamePrefix="tsp42_reference_condenser_seed");
          getErrorString();
          MOS
          printf 'source-clone initial conditions: P=P0=6136 Pa; gravity_pressure=false, so Pfond=P; Pm(start)=6136 Pa\n' \
            | tee outputs/tsp42/reference-condenser-seed.txt
          timeout --signal=TERM --kill-after=30s 18m \
            omc "$PWD/build/tsp42-reference-condenser-seed.mos" \
            | tee outputs/tsp42/upstream-reference-condenser-seed.log
          if grep -Eq 'Failed to build model|Simulation execution failed|resultFile = ""|Error:' \
              outputs/tsp42/upstream-reference-condenser-seed.log; then
            exit 1
          fi
          test -s build/tsp42_reference_condenser_seed_res.csv

      - name: Test the version-independent turbine patch
        run: python3 -m unittest discover -s tests -p "test_turbine_bypass_patch.py"

      - name: Test the ThermoSysPro 4.2 pressure-property patch
        run: python3 -m unittest discover -s tests -p "test_tsp42_pipe_pressure_floor.py"

      - name: Test the ThermoSysPro 4.2 IF97 domain guard
        run: python3 -m unittest discover -s tests -p "test_tsp42_if97_domain_guard.py"

      - name: Render the existing TripLens physical trip case
        run: |
          set -euo pipefail
          python3 scripts/render_modelica.py \
            --trip-time 2 \
            --trip-ramp-duration 5 \
            --stop-time 10 \
            --intervals 10000
          plant=vendor/ThermoSysPro/ThermoSysPro/Examples/CombinedCyclePowerPlant/CombinedCycle_TripTAC.mo
          test -s "$plant"
          cp "$plant" outputs/tsp42/CombinedCycle_TripTAC-4.2-upstream.mo
          sha256sum outputs/tsp42/CombinedCycle_TripTAC-4.2-upstream.mo \
            | tee outputs/tsp42/CombinedCycle_TripTAC-4.2-upstream.sha256
          turbine=vendor/ThermoSysPro/ThermoSysPro/WaterSteam/Machines/StodolaTurbine.mo
          test -s "$turbine"
          cp "$turbine" outputs/tsp42/StodolaTurbine-4.2-upstream.mo
          sha256sum outputs/tsp42/StodolaTurbine-4.2-upstream.mo \
            | tee outputs/tsp42/StodolaTurbine-4.2-upstream.sha256
          python3 scripts/patch_turbine_bypass_model.py --source "$plant"
          python3 scripts/patch_stodola_turbine.py \
            vendor/ThermoSysPro/ThermoSysPro/WaterSteam/Machines/StodolaTurbine.mo
          pipe_loss=vendor/ThermoSysPro/ThermoSysPro/WaterSteam/PressureLosses/PipePressureLoss.mo
          cp "$pipe_loss" outputs/tsp42/PipePressureLoss-4.2-upstream.mo
          python3 scripts/patch_tsp42_pipe_pressure_floor.py "$pipe_loss"
          cp "$pipe_loss" outputs/tsp42/PipePressureLoss-4.2-property-floor.mo
          sha256sum outputs/tsp42/PipePressureLoss-4.2-property-floor.mo \
            | tee outputs/tsp42/PipePressureLoss-4.2-property-floor.sha256
          fluid_properties=vendor/ThermoSysPro/ThermoSysPro/Properties/Fluid
          test -s "$fluid_properties/Ph.mo"
          cp "$fluid_properties/Ph.mo" outputs/tsp42/Ph-4.2-upstream.mo
          python3 scripts/patch_tsp42_if97_domain_guard.py "$fluid_properties" \
            | tee outputs/tsp42/if97-domain-guard-patch-report.txt
          cp "$fluid_properties/Ph.mo" outputs/tsp42/Ph-4.2-if97-domain-guard.mo
          cp "$fluid_properties/Ph_der.mo" outputs/tsp42/Ph_der-4.2-if97-domain-guard.mo
          mkdir -p outputs/tsp42/patched-source/Properties
          cp -a "$fluid_properties" outputs/tsp42/patched-source/Properties/Fluid
          find "$fluid_properties" -maxdepth 1 -type f -name '*.mo' -print0 \
            | sort -z | xargs -0 sha256sum \
            > outputs/tsp42/Patched-Fluid-Properties-4.2.sha256
          sha256sum outputs/tsp42/Ph-4.2-if97-domain-guard.mo \
            outputs/tsp42/Ph_der-4.2-if97-domain-guard.mo \
            | tee outputs/tsp42/Ph-4.2-if97-domain-guard.sha256
          cp "$plant" outputs/tsp42/CombinedCycle_TripTAC-4.2-patched.mo
          sha256sum outputs/tsp42/CombinedCycle_TripTAC-4.2-patched.mo \
            | tee outputs/tsp42/CombinedCycle_TripTAC-4.2-patched.sha256
          cp build/TripLens_CombinedCycle_TripTAC.mo \
            outputs/tsp42/TripLens_CombinedCycle_TripTAC-4.2-rendered.mo
          sha256sum outputs/tsp42/TripLens_CombinedCycle_TripTAC-4.2-rendered.mo \
            | tee outputs/tsp42/TripLens_CombinedCycle_TripTAC-4.2-rendered.sha256

      - name: Probe TripLens with condenser P0 and pump pressure trace
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          import shutil

          seed_root = Path("build/tsp42-triplens-seeded/ThermoSysPro")
          shutil.copytree(Path("vendor/ThermoSysPro/ThermoSysPro"), seed_root)
          properties = seed_root / "Properties/WaterSteam/IF97_packages.mo"
          property_source = properties.read_text()
          needle = """    algorithm
                supercritical := (p > ThermoSysPro.Properties.WaterSteam.BaseIF97.data.PCRIT);"""
          traced = """    algorithm
                assert(p > 611.657,
                  "TRACE Water_Ph: p = " + String(p) + " Pa, h = " + String(h) +
                  " J/kg, mode = " + String(mode));
                supercritical := (p > ThermoSysPro.Properties.WaterSteam.BaseIF97.data.PCRIT);"""
          function_start = property_source.find("    function Water_Ph\n")
          function_end = property_source.find("    end Water_Ph;", function_start)
          if function_start < 0 or function_end < 0:
              raise SystemExit("could not isolate Water_Ph function")
          water_function = property_source[function_start:function_end]
          if water_function.count(needle) != 1:
              raise SystemExit(f"expected one target in Water_Ph, got {water_function.count(needle)}")
          water_function = water_function.replace(needle, traced, 1)
          properties.write_text(property_source[:function_start] + water_function + property_source[function_end:])
          fluid_package = seed_root / "Properties/Fluid.mo"
          if not fluid_package.is_file():
              fluid_package = seed_root / "Properties/Fluid/package.mo"
          fluid_source = fluid_package.read_text()
          fluid_end = fluid_source.rfind("end Fluid;")
          if fluid_end < 0:
              raise SystemExit(f"could not find end of Fluid package in {fluid_package}")
          helper_source = """  function checkedPh
            input ThermoSysPro.Units.SI.AbsolutePressure p;
            input ThermoSysPro.Units.SI.SpecificEnthalpy h;
            input Integer mode;
            input Integer fluid;
            input String caller;
            output ThermoSysPro.Properties.WaterSteam.Common.ThermoProperties_ph props;
          algorithm
            assert(p > 611.657,
              "TRACE " + caller + ": p=" + String(p) + " Pa, h=" + String(h) +
              " J/kg, mode=" + String(mode));
            props := Ph(p, h, mode, fluid);
          end checkedPh;
          """
          if "function checkedPh" in fluid_source:
              raise SystemExit("checkedPh already exists in the source clone")
          fluid_source = fluid_source[:fluid_end] + helper_source + fluid_source[fluid_end:]
          fluid_package.write_text(fluid_source)

          property_root = seed_root / "Properties"
          diagnostic_ph_functions = []
          if97_relative = "Properties/WaterSteam/IF97_packages.mo"
          for candidate in sorted(property_root.rglob("*.mo")):
              relative = candidate.relative_to(seed_root).as_posix()
              if relative == if97_relative:
                  continue
              candidate_source = candidate.read_text()
              matches = list(re.finditer(
                  r"(?m)^[ \t]*(?:partial[ \t]+)?function[ \t]+([A-Za-z_][A-Za-z_0-9]*)\b",
                  candidate_source))
              for function_match in reversed(matches):
                  function_name = function_match.group(1)
                  function_end_match = re.search(
                      r"(?m)^[ \t]*end[ \t]+" + re.escape(function_name) + r"[ \t]*;",
                      candidate_source[function_match.end():])
                  if function_end_match is None:
                      continue
                  function_end = function_match.end() + function_end_match.end()
                  function_source = candidate_source[function_match.start():function_end]
                  if "Water_Ph(" not in function_source:
                      continue
                  pressure_match = re.search(
                      r'(?m)^[ \t]*input\b[^;\n]*\b([pP])(?:[ \t]+"[^"]*")?[ \t]*;',
                      function_source)
                  enthalpy_match = re.search(
                      r'(?m)^[ \t]*input\b[^;\n]*\b([hH])(?:[ \t]+"[^"]*")?[ \t]*;',
                      function_source)
                  if pressure_match is None or enthalpy_match is None:
                      continue
                  pressure_name = pressure_match.group(1)
                  enthalpy_name = enthalpy_match.group(1)
                  algorithm_match = re.search(r"(?m)^([ \t]*)algorithm[ \t]*$", function_source)
                  if algorithm_match is None:
                      continue
                  indent = algorithm_match.group(1)
                  algorithm_start = function_match.start() + algorithm_match.start()
                  algorithm_line_end = candidate_source.find(
                      "\n", function_match.start() + algorithm_match.end())
                  if algorithm_line_end < 0:
                      continue
                  injected_algorithm = (
                      f"{indent}algorithm\n"
                      f'{indent}  assert({pressure_name} > 611.657, "TRACE {relative} {function_name}: P=" + String({pressure_name}) + " Pa, h=" + String({enthalpy_name}));\n')
                  candidate_source = (
                      candidate_source[:algorithm_start] + injected_algorithm +
                      candidate_source[algorithm_line_end + 1:])
                  diagnostic_ph_functions.append(f"{relative}: {function_name}")
              candidate.write_text(candidate_source)
          Path("outputs/tsp42/diagnostic-ph-functions.txt").write_text(
              "\n".join(diagnostic_ph_functions) + "\n")
          def split_arguments(argument_text):
              arguments = []
              depth = 0
              start = 0
              for index, character in enumerate(argument_text):
                  if character == "(":
                      depth += 1
                  elif character == ")":
                      depth -= 1
                  elif character == "," and depth == 0:
                      arguments.append(argument_text[start:index].strip())
                      start = index + 1
              arguments.append(argument_text[start:].strip())
              return arguments

          def find_call_end(source_text, opening):
              depth = 1
              for index in range(opening + 1, len(source_text)):
                  if source_text[index] == "(":
                      depth += 1
                  elif source_text[index] == ")":
                      depth -= 1
                      if depth == 0:
                          return index
              return None

          diagnostic_callers = []
          for candidate in sorted(seed_root.rglob("*.mo")):
              relative = candidate.relative_to(seed_root).as_posix()
              if relative.startswith("Properties/"):
                  continue
              candidate_source = candidate.read_text()
              if "Fluid.Ph(" not in candidate_source and "Water_Ph(" not in candidate_source:
                  continue
              # Include declaration modifiers, initial equations, nested local
              # models, and code after inline graphical annotations.
              scan_start = 0
              scan_end = len(candidate_source)

              call_sites = []
              for token in ("Fluid.Ph(", "Water_Ph("):
                  cursor = scan_start
                  while cursor < scan_end:
                      call_start = candidate_source.find(token, cursor, scan_end)
                      if call_start < 0:
                          break
                      opening = call_start + len(token) - 1
                      closing = find_call_end(candidate_source, opening)
                      if closing is None or closing >= scan_end:
                          break
                      arguments = split_arguments(candidate_source[opening + 1:closing])
                      if token == "Fluid.Ph(" and len(arguments) == 4:
                          pressure, enthalpy, mode_arg, fluid_arg = arguments
                      elif token == "Water_Ph(" and len(arguments) >= 2:
                          pressure, enthalpy = arguments[:2]
                          mode_arg = arguments[2] if len(arguments) >= 3 else "0"
                          fluid_arg = "1"
                      else:
                          cursor = closing + 1
                          continue
                      qualified_start = call_start
                      while qualified_start > scan_start and (
                          candidate_source[qualified_start - 1].isalnum()
                          or candidate_source[qualified_start - 1] in "_."
                      ):
                          qualified_start -= 1
                      call_sites.append((qualified_start, closing + 1, pressure, enthalpy, mode_arg, fluid_arg))
                      cursor = closing + 1
              if not call_sites:
                  continue

              for index, (call_start, call_end, pressure, enthalpy, mode_arg, fluid_arg) in reversed(list(enumerate(call_sites, start=1))):
                  caller = f"{relative} call {index}"
                  replacement = (
                      "ThermoSysPro.Properties.Fluid.checkedPh("
                      f'{pressure}, {enthalpy}, {mode_arg}, {fluid_arg}, "{caller}")')
                  candidate_source = candidate_source[:call_start] + replacement + candidate_source[call_end:]
              candidate.write_text(candidate_source)
              diagnostic_callers.append(f"{relative}: {len(call_sites)}")
          Path("outputs/tsp42/diagnostic-property-callers.txt").write_text(
              "\n".join(diagnostic_callers) + "\n")
          diagnostic_source_dir = Path("outputs/tsp42/diagnostic-source")
          diagnostic_source_dir.mkdir(parents=True, exist_ok=True)
          shutil.copyfile(fluid_package, diagnostic_source_dir / "Fluid-package-diagnostic.mo")

          shutil.copyfile(properties, diagnostic_source_dir / "IF97-packages-diagnostic.mo")
          property_source_dir = diagnostic_source_dir / "Properties"
          diagnostic_property_index = []
          for candidate in sorted(property_root.rglob("*.mo")):
              source_text = candidate.read_text()
              relative = candidate.relative_to(property_root)
              target = property_source_dir / relative
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(candidate, target)
              for line_number, line in enumerate(source_text.splitlines(), start=1):
                  if re.search(r"\b(?:Ph|Water_Ph)\b", line):
                      diagnostic_property_index.append(
                          f"{relative}:{line_number}: {line.strip()}")
          Path("outputs/tsp42/diagnostic-property-index.txt").write_text(
              "\n".join(diagnostic_property_index) + "\n")
          for relative in (
              "WaterSteam/HeatExchangers/SimpleDynamicCondenser.mo",
              "WaterSteam/HeatExchangers/DynamicTwoPhaseFlowPipe.mo",
              "WaterSteam/PressureLosses/PipePressureLoss.mo",
              "WaterSteam/Machines/StaticCentrifugalPump.mo",
              "WaterSteam/Volumes/VolumeC.mo",
          ):
              source_file = seed_root / relative
              if source_file.is_file():
                  shutil.copyfile(source_file, diagnostic_source_dir / relative.replace("/", "__"))
          model = seed_root / "Examples/CombinedCyclePowerPlant/CombinedCycle_TripTAC.mo"
          source = model.read_text()
          # ThermoSysPro 4.2 imposes P=P0 when steady_state=false.
          # This instance starts P at 6136 Pa; gravity_pressure defaults false, so Pfond=P.
          # Keep P free and align P0, Pfond, and the nearby pressure-loss start at 6136 Pa.
          replacements = (
              ("steady_state = false, yNiveau(signal(start = 1.5))",
               "steady_state = false, P0 = 6136, gravity_pressure = false, yNiveau(signal(start = 1.5))"),
              ("Pfond(start = 10000.0)", "Pfond(start = 6136)"),
              ("Pm(start = 6200)", "Pm(start = 6136)"),
          )
          for old, new in replacements:
              if source.count(old) != 1:
                  raise SystemExit(f"expected one occurrence of {old!r}, got {source.count(old)}")
              source = source.replace(old, new, 1)
          model.write_text(source)
          PY
          cp build/tsp42-triplens-seeded/ThermoSysPro/Examples/CombinedCyclePowerPlant/CombinedCycle_TripTAC.mo \
            outputs/tsp42/CombinedCycle_TripTAC-4.2-triplens-pressure-seed.mo
          sha256sum outputs/tsp42/CombinedCycle_TripTAC-4.2-triplens-pressure-seed.mo \
            | tee outputs/tsp42/triplens-pressure-seed.sha256
          cat > build/tsp42-triplens-condenser-seed.mos <<MOS
          setCommandLineOptions("--std=3.4");
          setCommandLineOptions("-d=initialization,aliasConflicts,dumpLoops");
          setMatchingAlgorithm("PFPlusExt");
          setIndexReductionMethod("dynamicStateSelection");
          if not loadModel(Modelica, {"4.0.0"}) then
            print(getErrorString());
            exit(1);
          end if;
          if not loadFile("$PWD/build/tsp42-triplens-seeded/ThermoSysPro/package.mo") then
            print(getErrorString());
            exit(1);
          end if;
          if not loadFile("$PWD/build/TripLens_CombinedCycle_TripTAC.mo") then
            print(getErrorString());
            exit(1);
          end if;
          getVersion(Modelica);
          getVersion(ThermoSysPro);
          cd("$PWD/build");
          simulate(
            TripLens_CombinedCycle_TripTAC,
            startTime=0,
            stopTime=0.04,
            numberOfIntervals=10,
            tolerance=1e-3,
            method="dassl",
            outputFormat="csv",
            simflags="-lv=LOG_NLS,LOG_NLS_V,LOG_RES_INIT,LOG_NLS_NEWTON_DIAGNOSTICS",
            fileNamePrefix="tsp42_triplens_condenser_seed");
          getErrorString();
          MOS
          printf 'source-clone initial conditions: P=P0=6136 Pa; gravity_pressure=false, so Pfond=P; Pm(start)=6136 Pa\n' \
            | tee outputs/tsp42/triplens-condenser-seed.txt
          timeout --signal=TERM --kill-after=30s 20m \
            omc "$PWD/build/tsp42-triplens-condenser-seed.mos" \
            | tee outputs/tsp42/triplens-condenser-seed.log
          if grep -Eq 'Failed to build model|Simulation execution failed|resultFile = ""|Error:' \
              outputs/tsp42/triplens-condenser-seed.log; then
            exit 1
          fi
          test -s build/tsp42_triplens_condenser_seed_res.csv

      - name: Simulate the TripLens physical model with ThermoSysPro 4.2
        run: |
          set -euo pipefail
          cat > build/tsp42-triplens.mos <<MOS
          setCommandLineOptions("--std=3.4");
          setCommandLineOptions("-d=initialization,aliasConflicts");
          setMatchingAlgorithm("PFPlusExt");
          setIndexReductionMethod("dynamicStateSelection");
          if not loadModel(Modelica, {"4.0.0"}) then
            print(getErrorString());
            exit(1);
          end if;
          if not loadFile("$PWD/vendor/ThermoSysPro/ThermoSysPro/package.mo") then
            print(getErrorString());
            exit(1);
          end if;
          if not loadFile("$PWD/build/TripLens_CombinedCycle_TripTAC.mo") then
            print(getErrorString());
            exit(1);
          end if;
          getVersion(Modelica);
          getVersion(ThermoSysPro);
          cd("$PWD/build");
          simulate(
            TripLens_CombinedCycle_TripTAC,
            startTime=0,
            stopTime=10,
            numberOfIntervals=10000,
            tolerance=1e-3,
            method="dassl",
            outputFormat="csv",
            simflags="-lv=LOG_NLS,LOG_NLS_V,LOG_RES_INIT,LOG_NLS_NEWTON_DIAGNOSTICS",
            fileNamePrefix="tsp42_triplens_trip");
          getErrorString();
          MOS
          timeout --signal=TERM --kill-after=30s 25m \
            omc "$PWD/build/tsp42-triplens.mos" \
            | tee outputs/tsp42/triplens-physical-trip.log
          if grep -Eq 'Failed to build model|Simulation execution failed|resultFile = ""|Error:' \
              outputs/tsp42/triplens-physical-trip.log; then
            exit 1
          fi
          test -s build/tsp42_triplens_trip_res.csv
          python3 - build/tsp42_triplens_trip_res.csv <<'PY'
          import csv
          import math
          import sys
          from pathlib import Path

          result = Path(sys.argv[1])
          with result.open(newline="", encoding="utf-8") as stream:
              reader = csv.DictReader(stream)
              columns = [name for name in (reader.fieldnames or []) if name.endswith("perteChargeK.Pm")]
              if len(columns) != 1:
                  raise SystemExit(f"expected one perteChargeK.Pm result column, found {columns}")
              values = [float(row[columns[0]]) for row in reader if row.get(columns[0])]
          if not values or any(not math.isfinite(value) or value <= 700 for value in values):
              minimum = min(values) if values else float("nan")
              raise SystemExit(f"converged physical pressure reached the 700 Pa property floor (min={minimum} Pa)")
          print(f"perteChargeK.Pm remains above the property floor: min={min(values):.1f} Pa")
          PY
          printf 'THERMOSYSPRO_42_TRIPLENS_PHYSICAL_SIMULATION_PASS\n' \
            | tee outputs/tsp42/result.txt

      - name: Upload ThermoSysPro 4.2 simulation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: thermosyspro-42-physical-simulation
          path: |
            outputs/tsp42/**
            build/tsp42_reference_res.csv
            build/tsp42_triplens_trip_res.csv
          if-no-files-found: warn
          retention-days: 14
