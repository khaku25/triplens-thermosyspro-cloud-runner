name: Review V8 Evidence UI Integration
on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'services/agent-api/**'
      - 'tests/test_analysis_client.mjs'
      - 'tests/test_gemini_sdk_transport.py'
      - 'tests/browser_v8_review.py'
      - '.github/workflows/review-v8-integration.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare source snapshot for independent local review
        run: |
          mkdir -p outputs/integration-review
          tar --exclude='__pycache__' --exclude='node_modules' --exclude='.next' -czf outputs/integration-review/source-review.tar.gz apps/web services/agent-api webapp tests/test_analysis_client.mjs tests/test_gemini_sdk_transport.py tests/browser_v8_review.py
      - name: Check actual Google SDK request serialization without network
        run: |
          python -m pip install 'google-genai>=2.3.0' httpx
          python tests/test_gemini_sdk_transport.py
      - name: Focused backend and display tests
        run: |
          python -m unittest discover -s services/agent-api/tests -p 'test_*.py' -v
          node --test tests/test_analysis_client.mjs
          node --test tests/test_ai_output_contract.mjs tests/test_event_tag_resolver.mjs tests/test_report_export.mjs
      - name: Install browser tooling
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Build frontend
        working-directory: apps/web
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Run desktop and mobile browser checks
        shell: bash
        run: |
          set -euo pipefail
          (cd apps/web && npm run start -- --hostname 127.0.0.1 > ../../outputs/integration-review/next-server.log 2>&1) &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for n in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:3000/ -o /dev/null; then break; fi
            sleep 1
          done
          python tests/browser_v8_review.py
      - name: Preserve screenshots, edited CSV, result assertions and source snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v8-integration-review-${{ github.run_id }}
          path: outputs/integration-review/
          retention-days: 14
