name: Apply and Run VPP GT Trip Update

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-run:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply staged VPP update
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode vpp-update-98957db.patch.gz.b64.txt > /tmp/vpp-update.patch.gz
          gzip -dc /tmp/vpp-update.patch.gz | git apply --check
          gzip -dc /tmp/vpp-update.patch.gz | git apply
          rm -f vpp-update-98957db.patch.gz.b64.txt
          rm -f .github/workflows/bootstrap-vpp-update.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Verify VPP baseline and logic
        run: |
          python3 -m unittest discover -s tests -v
          python3 config/audit_trip_semantics.py

      - name: Generate GT Trip event inputs
        run: |
          python3 scripts/run_vpp_gt_trip.py --output-dir outputs/GT_TRIP_01

      - name: Upload TripLens event inputs
        uses: actions/upload-artifact@v4
        with:
          name: gt-trip-event-inputs-${{ github.run_number }}
          path: |
            outputs/GT_TRIP_01/ECMS_EVENT.csv
            outputs/GT_TRIP_01/VPP_EVENT.csv
            outputs/GT_TRIP_01/VPP.MANIFEST.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload complete VPP replay
        uses: actions/upload-artifact@v4
        with:
          name: gt-trip-vpp-replay-${{ github.run_number }}
          path: |
            outputs/GT_TRIP_01/VPP.RAW.csv
            outputs/GT_TRIP_01/ProcessBus.csv
            outputs/GT_TRIP_01/DCS1.csv
            outputs/GT_TRIP_01/DCS2.csv
            outputs/GT_TRIP_01/ECMS.csv
            outputs/GT_TRIP_01/ECMS_EVENT.csv
            outputs/GT_TRIP_01/VPP_EVENT.csv
            outputs/GT_TRIP_01/VPP.MANIFEST.json
            outputs/GT_TRIP_01/GT_TRIP_01.raw-manifest.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish verified VPP update
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          git commit -m "Register VPP baseline and GT Trip event pipeline"
          git push origin HEAD:main
