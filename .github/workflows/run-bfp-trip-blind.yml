name: Generate ThermoSysPro RAW (BFP physical adapter)

on:
  workflow_dispatch:
    inputs:
      event_time_s:
        description: HP boiler-feed-pump physical disturbance start time in seconds
        required: true
        default: "10"
      transition_duration_s:
        description: Hydraulic speed transition duration in seconds
        required: true
        default: "5"
      stop_time_s:
        description: Simulation stop time in seconds
        required: true
        default: "70"
      output_intervals:
        description: OpenModelica output interval count
        required: true
        default: "700"
      final_rpm:
        description: Physical adapter final shaft-speed boundary in RPM
        required: true
        default: "1000"

permissions:
  contents: read

concurrency:
  group: thermosyspro-raw-bfp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out physical-model runner
        uses: actions/checkout@v4

      - name: Verify RAW-only boundary
        run: python3 -m unittest tests.test_raw_action -v

      - name: Run ThermoSysPro RAW-only simulation
        env:
          EVENT_TIME_S: ${{ inputs.event_time_s }}
          TRANSITION_DURATION_S: ${{ inputs.transition_duration_s }}
          STOP_TIME_S: ${{ inputs.stop_time_s }}
          OUTPUT_INTERVALS: ${{ inputs.output_intervals }}
          FINAL_RPM: ${{ inputs.final_rpm }}
        run: |
          chmod +x scripts/run_bfp_blind_pipeline.sh
          scripts/run_bfp_blind_pipeline.sh \
            "$EVENT_TIME_S" \
            "$TRANSITION_DURATION_S" \
            "$STOP_TIME_S" \
            "$OUTPUT_INTERVALS" \
            "$FINAL_RPM"

      - name: Upload blind-test RAW
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: thermosyspro-raw-${{ github.run_number }}
          path: |
            outputs/thermosyspro-raw.csv
            outputs/raw-manifest.json
          if-no-files-found: error
          retention-days: 30
