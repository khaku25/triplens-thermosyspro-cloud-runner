name: Diagnose ThermoSysPro 4.2 bypass initialization

on:
  pull_request:
    paths:
      - "modelica/TripLensUserModels_Bypass.mo"
      - "modelica/install_modelica_4_0.mos"
      - "modelica/build_v42_bypass_diagnostic.mos"
      - ".github/workflows/diagnose-v42-bypass-initialization.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      THERMOSYSPRO_COMMIT: a896ab75ce22162369e7fa4ce79927eeca44ad4a
      OPENMODELICA_IMAGE: openmodelica/openmodelica:v1.27.0-minimal
    steps:
      - uses: actions/checkout@v4

      - name: Download exact ThermoSysPro 4.2 source
        run: |
          mkdir -p vendor/download vendor/ThermoSysPro build/omhome build/v42
          curl -fL --retry 3 --retry-delay 5 \
            "https://gitlab.pam-retd.fr/thermosysproandco/ThermoSysPro/-/archive/${THERMOSYSPRO_COMMIT}/ThermoSysPro-${THERMOSYSPRO_COMMIT}.zip" \
            -o vendor/thermosyspro-4.2.zip
          unzip -q vendor/thermosyspro-4.2.zip -d vendor/download
          source_root="$(find vendor/download -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          test -n "$source_root"
          cp -a "$source_root"/. vendor/ThermoSysPro/
          grep -Eq 'ThermoSysPro Version 4\.2|version *= *"4\.2"' \
            vendor/ThermoSysPro/ThermoSysPro/package.mo

      - name: Install Modelica 4.0.0
        run: |
          timeout --signal=TERM --kill-after=30s 10m \
            docker run --rm \
              -v "$PWD/build/omhome:/root" \
              -v "$PWD:/workspace" \
              -w /workspace \
              "$OPENMODELICA_IMAGE" \
              omc /workspace/modelica/install_modelica_4_0.mos \
            | tee build/v42/install.log

      - name: Translate ThermoSysPro 4.2 bypass model
        run: |
          timeout --signal=TERM --kill-after=30s 35m \
            docker run --rm \
              -v "$PWD/build/omhome:/root" \
              -v "$PWD:/workspace" \
              -w /workspace \
              "$OPENMODELICA_IMAGE" \
              omc /workspace/modelica/build_v42_bypass_diagnostic.mos \
            | tee build/v42/translation.log
          test -x build/v42/TripLensUserModels_Bypass.CombinedCycle_TripTAC_Bypass

      - name: Run dense hybrid initialization with detailed NLS log
        run: |
          set +e
          cd build/v42
          ./TripLensUserModels_Bypass.CombinedCycle_TripTAC_Bypass \
            -override=startTime=0,stopTime=1,stepSize=0.1,tolerance=0.001 \
            -s=dassl \
            -nls=hybrid \
            -lv=LOG_STDOUT,LOG_ASSERT,LOG_STATS,LOG_INIT,LOG_NLS,LOG_NLS_V \
            > initialization-hybrid.log 2>&1
          sim_status=$?
          cat initialization-hybrid.log
          exit "$sim_status"

      - name: Upload complete initialization evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: thermosyspro-4.2-bypass-initialization-${{ github.run_number }}
          path: |
            build/v42/install.log
            build/v42/translation.log
            build/v42/initialization-hybrid.log
            build/v42/*_init.xml
            build/v42/*_info.json
          if-no-files-found: warn
          retention-days: 30
