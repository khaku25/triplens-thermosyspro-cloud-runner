name: Publish ST source observations in the web viewer
on:
  push:
    branches: [codex/plant-process-drawing-master-20260923]
    paths:
      - .github/workflows/publish-st-power-web.yml
      - scripts/apply_st_power_web_release.py
      - scripts/logic_assets/**
      - data/current_v8/masters/**
      - data/current_v8/st_power_evidence_20260924.json
      - tests/test_st_power_web_release.py
      - tests/test_logic_pipeline.py
      - tests/test_logic_update_command.py
      - tests/test_logic_viewer.py
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: st-power-web-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref_name == 'codex/plant-process-drawing-master-20260923'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate provenance separation and regenerate all viewer assets
        run: python scripts/apply_st_power_web_release.py
      - name: Install browser test dependency
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Run logic, drawing, release, and application regressions
        run: |
          python -m unittest discover -s tests -p 'test_st_power_web_release.py' -v
          python -m unittest discover -s tests -p 'test_logic_*.py' -v
          python -m unittest tests.test_drawing_master -v
          node --test tests/test_*.mjs
      - name: Build the existing Next application
        run: |
          npm ci --prefix apps/web
          npm run build --prefix apps/web
      - name: Verify tag search, rule detail, I/O links, and Drawing Master in Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm run start --prefix apps/web -- --hostname 127.0.0.1 --port 3000 > "$RUNNER_TEMP/st-next.log" 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          python - <<'PY'
          import os,time,urllib.request
          from playwright.sync_api import sync_playwright
          for attempt in range(60):
              try:
                  urllib.request.urlopen('http://127.0.0.1:3000',timeout=2).close();break
              except Exception: time.sleep(1)
          else: raise SystemExit('Next server unavailable')
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True)
              page=browser.new_page(viewport={'width':1440,'height':1000})
              errors=[]
              page.on('pageerror',lambda error:errors.append(str(error)))
              frame=page.frame_locator('iframe')
              for tag in ('vppSTGeneratorPowerMW','vppSTGridPowerMW'):
                  page.goto('http://127.0.0.1:3000/logic?tag='+tag)
                  frame.locator('body[data-ready="true"]').wait_for()
                  frame.locator('#inspector').get_by_text('MODEL_SOURCE_CONFIRMED').wait_for()
                  frame.locator('#related-rules button[data-rule="RESP-ST-GRID-POWER"]').wait_for()
                  frame.locator('#related-rules button[data-rule="RESP-ST-GRID-POWER"]').click()
                  assert frame.locator('#page-select').input_value()=='IG-036'
                  assert frame.locator('#diagram [data-tag="vppSTGeneratorPowerMW"]').count()==1
                  assert frame.locator('#diagram [data-tag="vpp52STClosed"]').count()==1
                  assert frame.locator('#diagram [data-tag="vppSTGridPowerMW"]').count()==1
                  detail=frame.locator('#inspector').inner_text()
                  assert '52ST OPEN: NOT_TESTED' in detail and 'PARTIAL' in detail
              page.screenshot(path=os.path.join(os.environ['RUNNER_TEMP'],'st-logic-next.png'),full_page=True)
              page.goto('http://127.0.0.1:3000/logic?tag=vppSTGridPowerMW')
              frame.get_by_role('button',name='Drawing Master',exact=True).click()
              frame.locator('#search').fill('vppSTGridPowerMW')
              result=frame.locator('#results button').filter(has_text='ST Protection').first
              result.wait_for()
              result.click()
              assert 'ST Protection' in frame.locator('#page-title').inner_text()
              assert frame.locator('#diagram [data-tag="vppSTGridPowerMW"].selected').count()==1
              repository=frame.locator('#repository-data').text_content()
              assert 'MODEL_SOURCE_CONFIRMED' in repository
              assert 'NOT_TESTED' in repository
              browser.close()
          if errors: raise AssertionError(errors)
          print('NEXT_ST_SEARCH_RULE_IO_DRAWING_PASS')
          PY
      - name: Check synchronized artifacts and protected paths
        run: |
          python scripts/update_triplens_logic.py --check
          git diff --exit-code -- modelica matlab ECMSVPP.m ECMS_BFP_ALARMS.m scripts/native_ecms_opcua_client.py
          git -c core.whitespace=cr-at-eol diff --check -- . ':!*.csv' ':!*.tsv'
      - name: Publish generated assets if needed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/current_v8 logic_diagrams generated/logic apps/web/lib/current-logic-summary.json apps/web/public/logic-assets services/agent-api/triplens/current_v8
          git -c core.whitespace=cr-at-eol diff --cached --check -- . ':!*.csv' ':!*.tsv'
          if ! git diff --cached --quiet; then
            git commit -m 'fix: publish ST source-observed tags and response logic indexes'
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi
          git rev-parse HEAD | tee "$RUNNER_TEMP/st-release-sha.txt"
          echo "Verified source release: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo 'Run 54 census 603 tags / 53 live rules; static search 605 tags / 54 rules. OPEN behavior remains NOT_TESTED.' >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve browser and release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: st-source-observation-web-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/st-next.log
            ${{ runner.temp }}/st-logic-next.png
            ${{ runner.temp }}/st-release-sha.txt
            data/current_v8/st_power_evidence_20260924.json
            apps/web/lib/current-logic-summary.json
          if-no-files-found: warn
