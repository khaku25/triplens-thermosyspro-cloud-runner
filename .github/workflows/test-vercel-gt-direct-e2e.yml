name: Test Deployed V8 Evidence Integration
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/test-vercel-gt-direct-e2e.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  archived-v8-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch original archived V8 evidence without modifying its bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p outputs/deployed-v8-review
          gh api repos/khaku25/triplens-thermosyspro-cloud-runner/actions/artifacts/10404407335/zip > outputs/run41.zip
          python -m pip install requests
      - name: Replay actual GT and ST logs plus an evidence-missing control
        run: python tests/run_deployed_v8_review.py --archive outputs/run41.zip
      - name: Preserve input digests, actual Gemini output and tool traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployed-v8-integration-${{ github.run_id }}
          path: outputs/deployed-v8-review/
          retention-days: 14
