name: Build TripLens Logic Database

on:
  push:
    branches: [main]
    paths:
      - 'data/triplens_A-L_alarm_logic_master_absolute_v2.csv'
      - 'data/thermo_vpp_full_tag_list.csv'
      - 'data/ecms_tag_catalog.csv'
      - 'config/dcs_alarm_rules.csv'
      - 'config/alarm_registry_v1.csv'
      - 'config/signal_map.json'
      - 'logic_db/**'
      - 'tests/test_event_tag_master_coverage.py'
      - '.github/workflows/build-logic-db.yml'
  pull_request:
    branches: [main]
    paths:
      - 'config/alarm_registry_v1.csv'
      - 'logic_db/**'
      - 'tests/test_event_tag_master_coverage.py'
      - '.github/workflows/build-logic-db.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-logic-db:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Filter raw Thermo tags to model-backed Core
        run: |
          python3 logic_db/filter_core_model_tags.py \
            --input data/thermo_vpp_full_tag_list.csv \
            --output outputs/core_model_tags.csv \
            --excluded-report outputs/excluded_non_model_tags.csv

      - name: Filter A-L catalogue to first-order H HH L LL Core
        run: |
          python3 logic_db/filter_simulation_grounded.py \
            --input data/triplens_A-L_alarm_logic_master_absolute_v2.csv \
            --output outputs/core_first_order_logic.csv \
            --excluded-report outputs/excluded_non_core_logic.csv

      - name: Filter runtime alarms to first-order H HH L LL Core
        run: |
          python3 logic_db/filter_core_runtime_rules.py \
            --input config/dcs_alarm_rules.csv \
            --output outputs/core_runtime_alarm_rules.csv \
            --excluded-report outputs/excluded_non_core_runtime_rules.csv

      - name: Build normalized SQLite Logic Core
        run: |
          python3 logic_db/build_simulation_grounded_db.py \
            --logic outputs/core_first_order_logic.csv \
            --dcs outputs/core_runtime_alarm_rules.csv \
            --thermo-tags outputs/core_model_tags.csv \
            --source-commit "$GITHUB_SHA"

      - name: Add EVENT registry Tag Master coverage
        run: |
          python3 logic_db/event_tag_master.py outputs/triplens_logic_master_v2.sqlite

      - name: EVENT Tag Master regression tests
        run: |
          python3 -m pip install pytest
          python3 -m pytest -q tests/test_event_tag_master_coverage.py

      - name: Query smoke test
        run: |
          python3 logic_db/query_logic_db.py outputs/triplens_logic_master_v2.sqlite --limit 5
          python3 logic_db/query_logic_db.py outputs/triplens_logic_master_v2.sqlite --tag-id TSP.DRUM.HP.LEVEL --limit 5

      - name: Export visual traceability viewer
        run: |
          python3 logic_db/export_traceability.py outputs/triplens_logic_master_v2.sqlite --output-dir outputs

      - name: Export EVENT Tag Master mapping
        run: |
          python3 - <<'PY'
          import csv, sqlite3
          from pathlib import Path
          db = sqlite3.connect('outputs/triplens_logic_master_v2.sqlite')
          rows = db.execute('SELECT * FROM v_event_tag_map ORDER BY rule_id').fetchall()
          cols = [d[0] for d in db.execute('SELECT * FROM v_event_tag_map LIMIT 0').description]
          out = Path('outputs/event_tag_map.csv')
          with out.open('w', encoding='utf-8-sig', newline='') as f:
              w = csv.writer(f); w.writerow(cols); w.writerows(rows)
          print(f'exported {len(rows)} EVENT mappings')
          PY

      - name: Upload Logic Core database
        uses: actions/upload-artifact@v4
        with:
          name: triplens-logic-core-${{ github.run_number }}
          path: |
            outputs/triplens_logic_master_v2.sqlite
            outputs/logic_db_manifest.json
            outputs/event_tag_map.csv
            outputs/core_model_tags.csv
            outputs/core_first_order_logic.csv
            outputs/core_runtime_alarm_rules.csv
            outputs/excluded_non_model_tags.csv
            outputs/excluded_non_core_logic.csv
            outputs/excluded_non_core_runtime_rules.csv
            outputs/active_logic_trace.json
            outputs/active_logic_trace.csv
            outputs/logic_traceability.html
          if-no-files-found: error
          retention-days: 30
