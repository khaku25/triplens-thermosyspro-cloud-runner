name: Verify Drawing Master Restoration

on:
  push:
    branches: [codex/restore-drawing-master-20260922]
    paths:
      - 'scripts/logic_assets/**'
      - 'tests/test_drawing_master*.py'
      - 'apps/web/public/logic-assets/**'
      - '.github/drawing-master-restoration/**'
      - '.github/workflows/verify-drawing-master-restoration.yml'
  pull_request:
    paths:
      - 'scripts/logic_assets/**'
      - 'tests/test_drawing_master*.py'
      - 'apps/web/public/logic-assets/**'
      - '.github/workflows/verify-drawing-master-restoration.yml'

permissions:
  contents: read

concurrency:
  group: drawing-master-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE_SHA: 0a57ecfeea8b34f1328a2df6b6e825aae562d055
      LEGACY_SHA: 53b7c8d0b4ccf9058b583d00073bbb740093e472
      DRAWING_MASTER_SCREENSHOTS: outputs/drawing-master-review/screenshots
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply bounded restoration delta once when staging is present
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p outputs/drawing-master-review
          if [ -f .github/drawing-master-restoration/patch.0.b64 ]; then
            git fetch --no-tags origin "$LEGACY_SHA"
            for p in scripts/logic_assets/__init__.py scripts/logic_assets/build.py scripts/logic_assets/drawing_master.py scripts/logic_assets/pipeline.py scripts/logic_assets/viewer.html tests/test_drawing_master.py; do
              git show "$LEGACY_SHA:$p" > "$p"
            done
            python - <<'PY'
          import base64, hashlib, lzma, pathlib, subprocess
          root=pathlib.Path('.github/drawing-master-restoration')
          encoded=''.join((root/f'patch.{i}.b64').read_text().strip() for i in (0,1))
          patch=lzma.decompress(base64.b64decode(encoded,validate=True))
          assert hashlib.sha256(patch).hexdigest()=='bbb6c883202cc381f291b7ed79a07392e46e3b1ba5a01d6e6a2b02aec231e142', 'Restoration delta checksum mismatch'
          allowed={'docs/DRAWING_MASTER_RESTORATION.md','scripts/logic_assets/__init__.py','scripts/logic_assets/pipeline.py','scripts/logic_assets/viewer.html','tests/test_drawing_master_browser.py','tests/test_drawing_master_restoration.py'}
          paths={line[6:] for line in patch.decode().splitlines() if line.startswith('+++ b/')}
          assert paths==allowed, paths
          path=pathlib.Path('outputs/drawing-master-review/restoration.patch');path.write_bytes(patch)
          subprocess.run(['git','apply','--check','--unidiff-zero',str(path)],check=True)
          subprocess.run(['git','apply','--unidiff-zero',str(path)],check=True)
          for i in (0,1):(root/f'patch.{i}.b64').unlink()
          PY
          fi
      - name: Regenerate all Drawing Master publication paths
        shell: bash
        run: |
          set -euo pipefail
          python scripts/update_triplens_logic.py | tee outputs/drawing-master-review/generation.json
          python scripts/update_triplens_logic.py --check | tee outputs/drawing-master-review/consistency.json
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Existing logic regression suite including HTTP navigation
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_logic_*.py' -v 2>&1 | tee outputs/drawing-master-review/logic-tests.log
      - name: Drawing Master exact cell and desktop mobile browser tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_drawing_master*.py' -v 2>&1 | tee outputs/drawing-master-review/drawing-tests.log
      - name: Broad Node baseline comparison (known failures remain reported)
        shell: bash
        run: |
          set -euo pipefail
          BASE_DIR=$(mktemp -d)
          git archive "$BASE_SHA" | tar -x -C "$BASE_DIR"
          export BASE_DIR
          python - <<'PY'
          import json, os, pathlib, re, subprocess
          out=pathlib.Path('outputs/drawing-master-review')
          results={}
          for name,cwd in [('baseline',os.environ['BASE_DIR']),('restored','.')]:
              tests=sorted(str(p.relative_to(cwd)) for p in pathlib.Path(cwd).glob('tests/test*.mjs'))
              run=subprocess.run(['node','--test',*tests],cwd=cwd,text=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
              (out/f'node-{name}.log').write_text(run.stdout)
              failures=re.findall(r'^not ok \d+ - (.+)$',run.stdout,re.M)
              total=re.search(r'^# tests (\d+)$',run.stdout,re.M)
              assert total is not None, 'Node test runner did not complete'
              results[name]={'exit_code':run.returncode,'total':int(total[1]),'failed_tests':failures}
          (out/'node-baseline-comparison.json').write_text(json.dumps(results,ensure_ascii=False,indent=2))
          print(json.dumps(results,ensure_ascii=False,indent=2))
          assert sorted(results['baseline']['failed_tests'])==sorted(results['restored']['failed_tests']), 'New Node regression introduced'
          assert results['baseline']['total']==results['restored']['total']
          print('BASELINE_PARITY_PASS; this is not a claim that the broad Node suite is green')
          PY
          rm -rf "$BASE_DIR"
      - name: Build unchanged Next.js application with restored static assets
        working-directory: apps/web
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Verify protected operator and physical sources are byte unchanged
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code "$BASE_SHA" -- apps/web/components apps/web/lib apps/web/app services/agent-api data/current_v8 logic_diagrams/TripLens_Logic_Master_Current_V8.drawio logic_diagrams/logic_diagram_index.json
          python - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('.')
          dm=json.loads((root/'logic_diagrams/drawing_master_index.json').read_text())
          xml=(root/'logic_diagrams/TripLens_Logic_Master_Current_V8.drawio').read_bytes()
          assert dm['source_sha256']==hashlib.sha256(xml).hexdigest()
          print(json.dumps({'counts':dm['counts'],'source_sha256':dm['source_sha256']},indent=2))
          (root/'outputs/drawing-master-review/counts.json').write_text(json.dumps({'counts':dm['counts'],'source_sha256':dm['source_sha256']},indent=2))
          PY
      - name: Prepare reviewed branch-only patch
        shell: bash
        run: |
          set -euo pipefail
          git add -N -- scripts/logic_assets tests/test_drawing_master.py tests/test_drawing_master_browser.py tests/test_drawing_master_restoration.py docs/DRAWING_MASTER_RESTORATION.md apps/web/public/logic-assets generated/logic logic_diagrams
          git diff --binary HEAD > outputs/drawing-master-review/verified.patch
          sha256sum outputs/drawing-master-review/verified.patch > outputs/drawing-master-review/verified.patch.sha256
          git rev-parse HEAD > outputs/drawing-master-review/tested-base-sha.txt
          git diff --stat HEAD > outputs/drawing-master-review/changed-files.txt
          cp apps/web/public/logic-assets/viewer.html outputs/drawing-master-review/drawing-master-preview.html
      - name: Preserve successes and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drawing-master-review-${{ github.run_id }}
          path: outputs/drawing-master-review/
          retention-days: 7
          if-no-files-found: error

  publish-restoration-branch:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/codex/restore-drawing-master-20260922'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: drawing-master-review-${{ github.run_id }}
          path: outputs/drawing-master-review
      - name: Commit only verified restoration files without touching main
        env:
          EXPECTED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c outputs/drawing-master-review/verified.patch.sha256
          if [ ! -s outputs/drawing-master-review/verified.patch ]; then
            echo 'No uncommitted restoration changes remain.'
            exit 0
          fi
          test "$(git ls-remote origin refs/heads/codex/restore-drawing-master-20260922 | cut -f1)" = "$EXPECTED_SHA"
          git apply --check outputs/drawing-master-review/verified.patch
          git apply outputs/drawing-master-review/verified.patch
          git add -- scripts/logic_assets tests/test_drawing_master.py tests/test_drawing_master_browser.py tests/test_drawing_master_restoration.py docs/DRAWING_MASTER_RESTORATION.md apps/web/public/logic-assets generated/logic logic_diagrams
          git add -u -- .github/drawing-master-restoration
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Restore and verify Drawing Master exact object navigation'
          git push origin HEAD:codex/restore-drawing-master-20260922
          echo "Verified restoration commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
