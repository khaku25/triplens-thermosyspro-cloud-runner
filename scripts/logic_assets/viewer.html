function openDrawing(ref,push=false){const value=String(ref);const exact=drawingMaster.entries.filter(row=>row.source_ref===value);const candidates=exact.length?exact:drawingMaster.entries.filter(row=>row.cell_id===value);if(candidates.length!==1){$('drawing-feedback').textContent=candidates.length?'도면 위치가 여러 곳입니다. 페이지가 포함된 검색 결과를 선택하세요.':'도면 위치를 찾지 못했습니다. 원본 페이지·객체를 확인하세요.';return false;}selectDrawing(candidates[0],push);return true;}

function selectDrawing(row,push=false){if(push)remember();selectedDrawing=row;selectedRule=row.logic_id||null;selectedTag=row.tag_id||null;drawingInspector(row);activePage=row.page_id;setHash('drawing',row.source_ref);$('drawing-feedback').textContent='';frameDrawing();}
function selectRule(rid,push=false,keepPage=false){if(push)remember();selectedDrawing=null;selectedRule=rid;selectedTag=null;ruleInspector(rid);const r=index.rules[rid];if(r&&!keepPage)activePage=r.group_page;setHash('rule',rid);render();}
function selectTag(tag,push=false,fromDiagram=false){if(push)remember();selectedDrawing=null;selectedTag=tag;selectedRule=null;tagInspector(tag);const r=index.entities[tag]?.rule_ids?.[0];if(r&&!fromDiagram)activePage=index.rules[r].group_page;setHash('tag',tag);render();if(parent!==window&&location.origin!=='null')parent.postMessage({type:'triplens:tag-selected',tag_id:tag},location.origin);}
function results(){const q=$('search').value.trim().toLowerCase();let rows;if(mode==='tags')rows=Object.values(index.tags).map(t=>({id:t.raw_tag_id,label:t.description_ko||t.description_en||'',action:()=>selectTag(t.raw_tag_id,true)}));else if(mode==='rules')rows=Object.values(index.rules).map(r=>({id:r.rule_id,label:r.logic_name+' · '+r.group,action:()=>selectRule(r.rule_id,true)}));else if(mode==='screens')rows=Object.values(index.pages).filter(p=>p.scope==='equipment').map(p=>({id:p.id,label:p.name,action:()=>{remember();activePage=p.id;render();}}));else rows=(drawingMaster.entries||[]).map(row=>({id:row.display_name||row.cell_id,label:[row.page_name,row.cell_id,row.tag_id,row.canonical_tag,row.logic_id,row.display_name].filter(Boolean).join(' · '),action:()=>selectDrawing(row,true)}));rows=rows.filter(r=>(r.id+' '+r.label).toLowerCase().includes(q));$('result-count').textContent=`검색 결과 ${rows.length}개`+(mode==='drawings'&&rows.length>resultLimit?` · ${resultLimit}개 표시`:'');$('more-results').hidden=mode!=='drawings'||rows.length<=resultLimit;$('results').replaceChildren();for(const r of (mode==='drawings'?rows.slice(0,resultLimit):rows)){const b=element('button',r.id);if(mode!=='screens')b.append(element('small',r.label));b.onclick=r.action;$('results').append(b);}}function geometry(cell){const g=[...cell.children].find(x=>x.tagName==='mxGeometry');const result={x:+(g?.getAttribute('x')||0),y:+(g?.getAttribute('y')||0),w:+(g?.getAttribute('width')||0),h:+(g?.getAttribute('height')||0),xml:g};for(const n of [result.x,result.y,result.w,result.h])if(!Number.isFinite(n)||Math.abs(n)>1e6)throw Error('도면 좌표 범위 오류');return result;}
function styles(s){const o={};for(const pair of s.split(';')){const k=pair.indexOf('=');if(k>0)o[pair.slice(0,k)]=pair.slice(k+1);}return o;}
const color=(value,fallback)=>/^#[0-9a-f]{3,8}$/i.test(value||'')?value:fallback;
const measure=document.createElement('canvas').getContext('2d');
function labelLines(value,width,font){measure.font=font+'px Arial';const output=[];for(const line of value.split('\n')){let current='';for(const c of line){if(current&&measure.measureText(current+c).width>width){output.push(current);current='';}current+=c;}output.push(current);}return output;}
function render(){const page=pageMap.get(activePage)||pageMap.get('overview');activePage=page.id;const p=index.pages[activePage];$('page-select').value=activePage;$('page-title').textContent=p.name;$('context-note').textContent=p.scope==='overview'?'설비, 태그 또는 로직을 선택하세요.':`로직 ${p.rule_ids.length}개 · 도형을 누르면 태그/로직 상세로 이동`;
for(const id of ['equipment-view','group-view','individual-view'])$(id).disabled=!selectedRule;
const graph=page.querySelector('mxGraphModel');const root=[...graph.children].find(x=>x.tagName==='root');const svg=$('diagram');svg.replaceChildren();const width=+(graph.getAttribute('pageWidth')||1560),height=+(graph.getAttribute('pageHeight')||1100);svg.setAttribute('viewBox',`0 0 ${width} ${height}`);svg.dataset.width=width;svg.dataset.height=height;svg.style.width=width*scale+'px';svg.style.height=height*scale+'px';svg.classList.toggle('layout',layoutMode);
const defs=svgEl('defs'),marker=svgEl('marker',{id:'arrow',viewBox:'0 0 10 10',refX:9,refY:5,markerWidth:7,markerHeight:7,orient:'auto-start-reverse'});marker.append(svgEl('path',{d:'M 0 0 L 10 5 L 0 10 z',fill:'#607d94'}));defs.append(marker);svg.append(defs);const nodeMap=new Map(),edgeList=[];
for(const item of root.children){const cell=item.tagName==='mxCell'?item:[...item.children].find(c=>c.tagName==='mxCell');if(!cell)continue;if(cell.getAttribute('vertex')==='1')nodeMap.set(item.id,{item,cell,g:geometry(cell)});else if(cell.getAttribute('edge')==='1')edgeList.push(cell);}
const edges=svgEl('g'),nodes=svgEl('g');svg.append(edges,nodes);
for(const edge of edgeList){const a=nodeMap.get(edge.getAttribute('source')),b=nodeMap.get(edge.getAttribute('target'));if(!a||!b)throw Error('연결되지 않은 도면 선');const start=[a.g.x+a.g.w,a.g.y+a.g.h/2],end=[b.g.x,b.g.y+b.g.h/2];const points=[...edge.querySelectorAll('Array[as="points"] > mxPoint')].map(p=>[+p.getAttribute('x'),+p.getAttribute('y')]);let chain;if(points.length)chain=[start,...points,end];else{const mid=(start[0]+end[0])/2;chain=[start,[mid,start[1]],[mid,end[1]],end];}if(chain.flat().some(n=>!Number.isFinite(n)))throw Error('선 좌표 오류');edges.append(svgEl('path',{d:chain.map((p,i)=>(i?'L':'M')+p.join(' ')).join(' '),fill:'none',stroke:'#607d94','stroke-width':1.5,'marker-end':'url(#arrow)'}));}
for(const [id,{item,cell,g}]of nodeMap){const st=styles(cell.getAttribute('style')||'');const group=svgEl('g',{transform:`translate(${g.x} ${g.y})`,class:'node','data-cell-id':id});const tag=item.getAttribute('tag_id'),rid=item.getAttribute('rule_id'),kind=item.getAttribute('kind');const interactive=Boolean(tag||kind==='page_link'||(rid&&(kind==='condition'||kind==='operation')));if(interactive){group.setAttribute('tabindex','0');group.setAttribute('role','button');}if(tag)group.dataset.tag=tag;if(rid)group.dataset.rule=rid;if(selectedDrawing?(selectedDrawing.page_id===activePage&&selectedDrawing.cell_id===id):((tag&&tag===selectedTag)||(rid&&rid===selectedRule)))group.classList.add('selected');group.setAttribute('aria-label',tag||rid||item.getAttribute('label')||id);group.append(svgEl('rect',{width:g.w,height:g.h,rx:st.rounded==='0'?0:8,fill:color(st.fillColor,'#fff'),stroke:color(st.strokeColor,'#607d94'),'stroke-width':Math.min(4,+st.strokeWidth||1.5)}));
const value=item.getAttribute('label')||cell.getAttribute('value')||'';let font=Math.min(18,Math.max(10,+st.fontSize||14));let ls=labelLines(value,g.w-24,font);if(ls.length*(font+3)>g.h-18){font=Math.max(10,Math.min(font,(g.h-18)/ls.length-3));ls=labelLines(value,g.w-24,font);}const label=svgEl('text',{x:12,y:18,'font-family':'Arial, Malgun Gothic, sans-serif','font-size':font,fill:color(st.fontColor,'#183348'),'pointer-events':'none'});ls.forEach((line,i)=>{const span=svgEl('tspan',{x:12,dy:i?font+3:0});span.textContent=line;label.append(span);});group.append(label);const title=svgEl('title');title.textContent=value;group.append(title);
const click=()=>{if(!interactive||suppressClick)return;if(layoutMode&&kind!=='page_link')return;if(kind==='page_link'){remember();activePage=item.getAttribute('target_page');render();}else if(tag)selectTag(tag,true,true);else if(rid)selectRule(rid,true,true);};if(interactive){group.addEventListener('click',click);group.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();click();}});}
group.addEventListener('pointerdown',e=>{if(!layoutMode||kind==='page_link')return;e.preventDefault();const startX=e.clientX,startY=e.clientY,oldX=g.x,oldY=g.y;group.setPointerCapture(e.pointerId);let moved=false;const move=ev=>{const dx=(ev.clientX-startX)/scale,dy=(ev.clientY-startY)/scale;moved ||= Math.abs(dx)+Math.abs(dy)>2;g.x=Math.round(oldX+dx);g.y=Math.round(oldY+dy);g.xml.setAttribute('x',String(g.x));g.xml.setAttribute('y',String(g.y));group.setAttribute('transform',`translate(${g.x} ${g.y})`);};const up=()=>{group.removeEventListener('pointermove',move);group.removeEventListener('pointerup',up);group.removeEventListener('pointercancel',up);if(moved){dirty=true;suppressClick=true;$('dirty').textContent='위치 변경 있음 · draw.io 저장 후 UPDATE 명령에 전달';render();setTimeout(()=>suppressClick=false,100);}};group.addEventListener('pointermove',move);group.addEventListener('pointerup',up);group.addEventListener('pointercancel',up);});nodes.append(group);}
$('zoom-label').textContent=Math.round(scale*100)+'%';$('back').disabled=!historyStack.length;}
function fit(){const d=pageMap.get(activePage)?.querySelector('mxGraphModel');scale=Math.max(.2,Math.min(1.25,($('canvas').clientWidth-20)/+(d?.getAttribute('pageWidth')||1560)));render();}
for(const m of ['tags','rules','screens','drawings'])$('tab-'+m).onclick=()=>setMode(m);
$('more-results').onclick=()=>{resultLimit+=100;results();};
$('search').addEventListener('input',()=>{resultLimit=100;results();});$('page-select').onchange=()=>{remember();selectedDrawing=null;activePage=$('page-select').value;render();};$('fit').onclick=fit;$('zoom-in').onclick=()=>{scale=Math.min(2,scale*1.2);render();};$('zoom-out').onclick=()=>{scale=Math.max(.2,scale/1.2);render();};
$('group-view').onclick=()=>{remember();selectedDrawing=null;activePage=index.rules[selectedRule].group_page;render();};$('individual-view').onclick=()=>{remember();selectedDrawing=null;activePage=index.rules[selectedRule].rule_page;render();};$('equipment-view').onclick=()=>{remember();selectedDrawing=null;activePage=index.rules[selectedRule].equipment_page;render();};$('back').onclick=()=>{const prev=historyStack.pop();if(!prev)return;selectedRule=prev.rule;selectedTag=prev.tag;selectedDrawing=prev.drawing||null;activePage=prev.page;mode=prev.mode||'tags';$('search').value=prev.query||'';setMode(mode);try{history.replaceState(null,'',prev.hash||location.pathname+location.search);}catch(_){}if(selectedDrawing)drawingInspector(selectedDrawing);else if(selectedRule)ruleInspector(selectedRule);else if(selectedTag)tagInspector(selectedTag);render();focusDrawing();};
$('layout-mode').onclick=()=>{layoutMode=!layoutMode;$('layout-mode').classList.toggle('active',layoutMode);$('layout-mode').textContent=layoutMode?'레이아웃 편집 종료':'레이아웃 편집';render();};
$('save-layout').onclick=()=>{const xml='<?xml version="1.0" encoding="utf-8"?>\n'+new XMLSerializer().serializeToString(xmlDoc.documentElement)+'\n';const url=URL.createObjectURL(new Blob([xml],{type:'application/xml'}));const a=element('a');a.href=url;a.download='TripLens_Logic_Master_Current_V8.drawio';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
window.TripLensLogic=Object.freeze({openRule:id=>selectRule(String(id),true),openTag:id=>selectTag(String(id),true),openDrawing:ref=>openDrawing(ref,true),exportXml:()=> '<?xml version="1.0" encoding="utf-8"?>\n'+new XMLSerializer().serializeToString(xmlDoc.documentElement)+'\n'});
results();let query=new URLSearchParams(location.hash.slice(1));try{if(!query.toString()&&parent!==window)query=new URLSearchParams(parent.location.search);}catch(_){}
if(query.has('rule'))selectRule(query.get('rule'));else if(query.has('tag'))selectTag(query.get('tag'));else if(query.has('drawing')){setMode('drawings');if(!openDrawing(query.get('drawing')))render();}else render();if(selectedDrawing)frameDrawing();else fit();document.body.dataset.ready='true';
window.addEventListener('hashchange',()=>{const q=new URLSearchParams(location.hash.slice(1));if(q.has('drawing'))openDrawing(q.get('drawing'));else if(q.has('tag'))selectTag(q.get('tag'));else if(q.has('rule'))selectRule(q.get('rule'));});
window.addEventListener('resize',()=>{if(innerWidth<800){if(selectedDrawing)frameDrawing();else fit();}});
})().catch(error=>{document.getElementById('fatal').textContent=error.message;document.getElementById('fatal').style.display='block';});
